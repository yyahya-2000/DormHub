openapi: 3.1.0

info:
  title: Dormitory support system — API v1
  version: 0.1.0
  summary: Role model, authentication, audit log, the housing register and staff
  description: |
    The implemented part of the REST contract of §3.3.6, in three slices. The
    first is FR-07 (role model), FR-08 (authentication and sessions) and FR-33
    (audit log). The second is the housing register: FR-01 (dormitories), FR-02
    (rooms and places), FR-03 (moving in), FR-05 (moving out) and FR-06 (the
    resident card). The third follows revision 2 of the role model: FR-41 (staff
    appointment inside a building) and FR-42 (issuing a resident account).

    The remaining routes of §3.3.6 — guest requests, the checkpoint,
    announcements, lost-and-found and maintenance — belong to later increments and
    are deliberately absent from this document rather than described as
    unimplemented: the file is the input for client generation, and a generated
    client should not carry methods that answer 404.

    Five properties of the contract are worth reading before the paths.

    Authorisation is scoped by building, not only by role. A grant of a role names
    the dormitory it holds in, and every building-addressed route decides on the
    object rather than on the role alone. A warden of one building asking about
    another gets 403, at the API and not merely in the interface.

    There are six roles, and the two in the middle differ in exactly one thing.
    The warden heads the dormitory; the manager beneath him does the register
    work — rooms, places, moving in and out, resident cards and accounts — and
    appoints nobody. Everywhere in this document that says «the warden of this
    building» about operative work, the manager of that building is included.
    Where a route is the warden's alone, it says so.

    The sign-in route has two distinct refusals. 401 means the credential did not
    resolve to an account that may sign in; it never says whether the login exists.
    429 means the login is inside its block window after the configured number of
    failed attempts, and the reply carries the seconds remaining.

    The bed, not the room, is the unit of residency. A room declares a `capacity`
    and holds that many places; a residency names a place. This is what lets
    «three beds in the room, two taken» be said at all, and it is why the refusal
    to exceed a capacity can name the free remainder.

    A residency is historical and is never deleted. Moving out writes
    `moved_out_at` and a ground; the record stays, the place is freed at once, and
    the person's access to building-bound routes ends on the stated date. Two
    residents holding one place over overlapping periods is refused by a partial
    unique index in the database, and the refusal carries the conflicting record.

servers:
  - url: http://localhost:8080/api/v1
    description: Local development — the port docker-compose publishes the web container on
  - url: /api/v1
    description: Same origin as the client

tags:
  - name: Authentication
    description: FR-08. Sign-in, sign-out and the identity of the current session.
  - name: Buildings
    description: >-
      FR-01 and FR-07. The register of dormitories, and the routes the
      role-and-building scope is demonstrated on.
  - name: Rooms
    description: FR-02. The register of rooms and places, kept per building.
  - name: Residencies
    description: FR-03 and FR-05. Moving in, and moving out.
  - name: Residents
    description: FR-06 and FR-42. The resident card, and the account behind it.
  - name: Staff
    description: >-
      FR-41. Appointing and dismissing the staff of one dormitory. The warden's
      route: the manager appoints nobody.
  - name: Audit
    description: FR-33. Append-only, readable by the administrator alone.

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and receive an API token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The credential was accepted and a token was issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedToken'
        '401':
          description: |
            The login or the password is wrong, or the account is not active. The
            body carries how many attempts remain before the block; zero means this
            attempt was the last one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: |
            The request was refused for a while, and `reason` says by which of the
            three limits. `login_locked`: the account reached the configured number
            of failed attempts — five attempts, fifteen minutes by default.
            `address_locked`: the network address reached its own ceiling, counted
            across every login tried from it. `rate_limited`: the address sent more
            requests to this route than it admits per minute, which says nothing
            about credentials at all — a caller with a correct password and no
            failed attempt can meet it.

            All three carry the same body, so a client reads `retry_after` without
            branching and branches on `reason` only where the wording matters.
          headers:
            Retry-After:
              description: Seconds until the request is accepted again.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'

  /auth/password:
    post:
      tags: [Authentication]
      summary: Set a password with a one-time code
      description: |
        FR-42, third criterion. An account issued to an incoming resident is
        created with a secret nobody holds; what the resident receives, at their
        own contact and never on the screen of the person who created the
        account, is a one-time code. This route spends that code and puts a
        password of the resident's own in its place.

        Unauthenticated, of necessity: the account has no password to sign in
        with yet. The code takes the place of a session, works once, and expires
        an hour after it is issued. Every API token the account already held is
        revoked with the change.

        The refusal says nothing about which of the four causes it was — no such
        address, a code that never existed, one already spent, one expired — for
        the same reason the sign-in route never says whether a login exists.
      operationId: setPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordInput'
      responses:
        '204':
          description: The password is set and the code is spent. The event is in the audit log.
        '422':
          description: |
            Either the payload failed validation, or the code did not resolve.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '429':
          description: >-
            The address sent more requests to this route than it admits per
            minute. The same limiter as the sign-in route, for the same reason:
            a one-time code is a secret, and guessing at it is an attempt.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the token used for this request
      operationId: logout
      responses:
        '204':
          description: The token is revoked and the sign-out is recorded in the audit log.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Authentication]
      summary: The account behind the current token, with its role grants
      operationId: currentUser
      responses:
        '200':
          description: The authenticated account.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /buildings:
    get:
      tags: [Buildings]
      summary: The register of dormitories, scoped to the caller
      description: |
        The administrator sees every dormitory; every other role sees the ones its
        grants name. This is the «empty scoped result» half of FR-07's criterion:
        the route is not refused, the answer is narrowed.

        A resident the register shows as moved out is narrowed out too, even
        though eviction revokes no role grant. The listing and
        `GET /buildings/{building}` answer the same question, so no row here
        leads to a 403 there.
      operationId: listBuildings
      responses:
        '200':
          description: The dormitories this account may see.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Buildings]
      summary: Register a dormitory
      description: |
        FR-01, first criterion: the administrator and nobody else. A warden's
        token gets 403 here, including a warden of the dormitory the request
        concerns — the refusal is about the role, not about the scope.
      operationId: createBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '201':
          description: >-
            The dormitory was registered. The change is in the audit log. The
            answer carries the regime settings that were defaulted, so it matches
            a subsequent read of the same dormitory field for field.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/archive:
    post:
      tags: [Buildings]
      summary: Archive a dormitory
      description: |
        FR-01, first criterion. The row survives and `is_active` becomes false, so
        that the residency history of a closed dormitory stays readable. The
        administrator alone.
      operationId: archiveBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The dormitory is archived.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}/rooms:
    get:
      tags: [Rooms]
      summary: The register of rooms and places of one dormitory
      description: |
        FR-02. Each entry carries the capacity, the places registered, the places
        occupied, how many further places may be registered (`free_places`) and
        how many registered places are free for somebody to move into
        (`vacant_beds`), so that a client never has to subtract and arrive at a
        figure the server did not refuse on.

        The administrator, and the warden, manager or duty officer **of this
        building**. A resident does not read the occupancy of the whole dormitory.
      operationId: listBuildingRooms
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The rooms, by floor and then by number.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Rooms]
      summary: Register a room
      description: |
        FR-02. The warden or the manager of this building, or the administrator. A
        room number is unique inside its building and free across buildings.
      operationId: createRoom
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: The room was registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /rooms/{room}:
    get:
      tags: [Rooms]
      summary: One room with its places
      operationId: showRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: The room card, places included.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rooms]
      summary: Edit a room
      description: |
        FR-02. Lowering `capacity` below the places already registered is the
        capacity rule approached from the other side and is refused with the same
        422, carrying the same figures.
      operationId: updateRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: The room as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the payload failed validation, or the capacity rule of FR-02 was
            broken. The second case carries `capacity`, `beds` and `free_places`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/CapacityExceeded'

  /rooms/{room}/beds:
    post:
      tags: [Rooms]
      summary: Register a place in a room
      description: |
        FR-02, second criterion. An attempt to take the room past its capacity is
        rejected **and the free remainder is shown**: the 422 carries `capacity`,
        `beds` and `free_places`, and `free_places` is the number the register
        refused on rather than one the client computed.

        A place label is unique inside its room, which the database enforces and
        the form reports.
      operationId: createBed
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 16
                  description: The place identifier inside the room.
                  examples: ['1', '2a']
      responses:
        '201':
          description: The place was registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Bed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the payload failed validation — a duplicate label, for one — or
            the room is full, in which case the body names the free remainder.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/CapacityExceeded'

  /residencies:
    post:
      tags: [Residencies]
      summary: Place a resident in a bed
      description: |
        FR-03. The scope is read off the bed: a residency names no building, and
        the warden or manager of the building the bed stands in is the one allowed
        to write the row.

        Two residents cannot hold one place over overlapping periods. The refusal
        comes from the exclusion constraint `residencies_bed_no_overlap` in the
        database, not from a check in the application, and the 409 it produces
        carries the conflicting record under `conflict`. A resident already
        holding another place is refused the same way, by
        `residencies_user_no_overlap`.

        The rule is about **periods**, not about open records. A `moved_in_at`
        backdated underneath a residency that is already running is refused, and
        so is a place whose termination has been recorded for a date still to
        come. The bounds are closed below and open above, so a move-in on the
        very day the last occupant leaves is admitted: a bed changes hands
        without a night of nobody in it.
      operationId: createResidency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidencyInput'
      responses:
        '201':
          description: The residency was recorded and the place is now occupied.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Residency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The place is held over a period that overlaps the one asked for, or
            the person already holds another place over such a period. The record
            standing in the way is in `conflict` — it may well be one whose
            termination date lies in the future.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidencyConflict'
        '422':
          description: |
            Either the payload failed validation, or the place cannot receive
            anybody — a blocked bed, or a room under repair or withdrawn.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'

  /residencies/{residency}/termination:
    post:
      tags: [Residencies]
      summary: End a residency
      description: |
        FR-05. The row is **not** deleted: the ground and the date are written,
        and the history stays readable on the card of FR-06.

        `moved_out_at` may lie in the future, and then nothing else changes yet.
        The record stays `active`, the place stays `occupied`, and the person's
        access to building-bound routes runs until the stated date and is gone on
        it — «no later than the stated date». `is_open` becomes false because a
        departure date is now written down; `is_current` stays true because the
        person is still living there. The two are the halves of that distinction
        and they are meant to differ.

        On the stated date the record becomes `ended` and the place becomes
        `free`, done by the nightly `housing:settle-residencies` when no request
        happens to be doing it. A termination dated today does all of it at
        once.

        The ground is required. A termination with an empty reason is refused with
        422.
      operationId: terminateResidency
      parameters:
        - $ref: '#/components/parameters/ResidencyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ground]
              properties:
                ground:
                  type: string
                  minLength: 3
                  maxLength: 255
                  description: Why the residency ends. Recorded verbatim.
                  examples: ['Graduation, art. 105 cl. 2 of the Housing Code']
                moved_out_at:
                  type: string
                  format: date
                  description: >-
                    The day the residency ends. Defaults to today; may be set
                    forward, never before the move-in date.
      responses:
        '200':
          description: The residency as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Residency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /residents/{resident}:
    get:
      tags: [Residents]
      summary: The resident card
      description: |
        FR-06. Visible to the warden and the manager **of that dormitory** and to
        the administrator; a resident sees only their own. Nobody else: the duty
        officer's work is the guest request and the security officer's is the
        entrance, and neither needs a citizenship or a telephone number. The
        warden of building 1 requesting a card of building 2 gets 403, at the API
        and not merely in the interface.

        The card carries the name, the study status, the citizenship, the contact,
        the current place, the whole residency history and the open obligations.
        `current_bed` and `open_obligations` are read as «resident today», not as
        «no departure date written»: somebody leaving at the end of December has
        a current place until the end of December. Reading the card is recorded in
        the audit log, because it carries personal data.
      operationId: showResidentCard
      parameters:
        - $ref: '#/components/parameters/ResidentId'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResidentCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}:
    get:
      tags: [Buildings]
      summary: The card of one building
      description: |
        Readable by the administrator and by anyone holding a role in this
        building. A staff member of another building gets 403.
      operationId: showBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The building card. The read is recorded in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            No role covering this building — or, for a resident, a residency the
            register shows as ended: FR-05 closes the building-bound routes on the
            stated date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Buildings]
      summary: Edit a dormitory
      description: 'FR-01, first criterion: the administrator alone.'
      operationId: updateBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '200':
          description: The dormitory as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Buildings]
      summary: Delete a dormitory
      description: |
        FR-01, second criterion. A dormitory that still has anything attached
        cannot be deleted, and the refusal states **which** thing: 409 whose
        `blocked_by` carries both counts and whose message names the one that
        actually refused.

        Two foreign keys point at a dormitory and either can block the delete:
        `rooms.building_id` and `role_user.building_id`, both `ON DELETE
        RESTRICT`. It is the database that refuses, so the rule holds against
        code that forgot to ask.

        The way out depends on which it was. A staff grant is revoked through
        `DELETE /buildings/{building}/staff/{user}/{role}`. Rooms are not:
        this API has no route that deletes or moves one, so the message points at
        archiving instead, which keeps the rooms and their residency history
        readable.
      operationId: deleteBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '204':
          description: The dormitory held no rooms and is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Rooms or staff grants are attached. The body states which, and both
            counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionBlocked'

  /buildings/{building}/users:
    get:
      tags: [Buildings]
      summary: The people holding a role in this building
      description: |
        Personal data, so the circle is narrower than for the card: the
        administrator, and the warden, manager or duty officer **of this
        building**. A resident of the building gets 403, and so does the warden of
        any other building. The answer never carries a person attached to a different
        dormitory.
      operationId: listBuildingUsers
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The roll of the building. The read is recorded in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}/staff:
    post:
      tags: [Staff]
      summary: Appoint a member of staff in this dormitory
      description: |
        FR-41. The warden of **this** building grants the manager, duty officer
        or security role inside it. Three refusals are worth telling apart, and
        all three are 403 because all three are a question of who the caller is:

        - the same call against another dormitory — the scope of the caller's own
          grant is what decides, and the path is what it is compared against;
        - a grant of the administrator or the warden role — the chain of
          appointment runs downwards only, and the administrator's grant is
          issued outside the application entirely;
        - any staff grant at all attempted by a manager — the one capability
          revision 2 of the role model withheld from him.

        The grant names the building from the path. A `building_id` in the
        payload is ignored, because a body that could nominate the scope would
        be nominating the scope the caller's own authorisation is checked
        against.

        Appointing twice is one appointment: the answer is 200 rather than 201,
        no second grant is written, and the log keeps one entry per grant.
      operationId: appointStaff
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAppointmentInput'
      responses:
        '200':
          description: The account already held this role here. Nothing changed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoleGrant'
        '201':
          description: The role is granted. The appointment is in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoleGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/staff/{user}/{role}:
    delete:
      tags: [Staff]
      summary: Dismiss a member of staff of this dormitory
      description: |
        FR-41, the revocation half. The same circle of roles as the appointment,
        and deliberately the same: a warden able to revoke another warden could
        remove the one account above him in his own building.

        404 means the account holds no such role here — a revocation that
        revoked nothing must not read as a success.
      operationId: revokeStaff
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/StaffUserId'
        - $ref: '#/components/parameters/StaffRole'
      responses:
        '204':
          description: The role is revoked. The dismissal is in the audit log.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such dormitory or account, or the account holds no such role here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/residents:
    post:
      tags: [Residents]
      summary: Issue an account to an incoming resident
      description: |
        FR-42. The warden or the manager of **this** dormitory creates the
        account of a person moving in: name, contact, study status, citizenship.

        There is no `role` field and no `password` field, and both absences are
        the requirement rather than an omission.

        The grant the account receives is always the resident role, always
        scoped to the building in the path, so no staff role can be issued this
        way — there is no parameter through which one could be asked for.

        The credential does not travel in this response. The account is created
        with a secret that is generated, hashed and forgotten in the same step;
        what reaches the resident is a one-time code, sent to the address on the
        account and spent at `POST /auth/password`. The response describes the
        account and carries `password_change_required: true`, which is how a
        client knows the account is still waiting for its first password.

        Constraint C-03 leaves one delivery channel in this iteration, and it is
        mail. The message is queued rather than sent inline: creating an account
        must not wait on a mail server.
      operationId: issueResidentAccount
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentAccountInput'
      responses:
        '201':
          description: >-
            The account exists, the resident role is granted in this dormitory,
            and the one-time code is on its way to the contact. The issue is in
            the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /audit-logs:
    get:
      tags: [Audit]
      summary: Read the audit log
      description: |
        The administrator alone. Reading the log is itself a recorded event, so
        every call adds one entry of its own. The log has no write route and can
        have none: the database has revoked UPDATE and DELETE on the table from
        the role the application connects as.
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          required: false
          description: Return only the entries of one action.
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the log, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The plain-text token returned by `POST /auth/login`, issued by Laravel Sanctum.

  parameters:
    BuildingId:
      name: building
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RoomId:
      name: room
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResidencyId:
      name: residency
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResidentId:
      name: resident
      in: path
      required: true
      description: The account the card belongs to.
      schema: { type: integer, format: int64, minimum: 1 }
    StaffUserId:
      name: user
      in: path
      required: true
      description: The account whose role is being revoked.
      schema: { type: integer, format: int64, minimum: 1 }
    StaffRole:
      name: role
      in: path
      required: true
      description: >-
        The role being revoked. Only the roles the caller may grant are
        accepted; anything else is 403, and a string naming no role at all is
        422.
      schema:
        $ref: '#/components/schemas/RoleCode'

  responses:
    Unauthenticated:
      description: No token, or a token that has been revoked or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The account is authenticated but holds no role that covers this object.
        The two cases behind it are a role that is wrong for the route and a role
        that is right but held in a different building.

        Every refusal is written to the audit log as `access.denied`, with the
        account, the object and the address it came from (FR-33, §3.9.6).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The payload did not pass validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:

    RoleCode:
      type: string
      description: |
        The six roles of §1.1.4 as revision 2 of the role model leaves them.

        `admin` holds the register of dormitories and is the one role granted
        over the system as a whole. `warden` heads one dormitory: he appoints
        his own staff and does everything `manager` does. `manager` is the
        register work of that dormitory — rooms, places, moving in and out,
        resident cards and accounts — and no appointments at all.
        `duty_officer` approves guest requests, `security` checks the guest at
        the entrance, `student` lives there.

        The colloquial Russian word for a porter-caretaker is used nowhere: the
        entrance function belongs to the security service.
      enum: [admin, duty_officer, warden, manager, security, student]

    UserStatus:
      type: string
      enum: [active, blocked, archived]

    AuditAction:
      type: string
      enum:
        - auth.login_succeeded
        - auth.login_failed
        - auth.login_locked
        - auth.login_blocked
        - auth.logout_succeeded
        - access.denied
        - building.viewed
        - building.users_viewed
        - audit_log.viewed
        - building.created
        - building.updated
        - building.archived
        - building.deleted
        - building.deletion_blocked
        - building.rooms_viewed
        - room.created
        - room.updated
        - room.update_refused
        - bed.created
        - bed.creation_refused
        - residency.assigned
        - residency.assignment_refused
        - residency.terminated
        - resident.card_viewed
        - staff.appointed
        - staff.revoked
        - resident.account_issued
        - auth.password_set

    AuditResult:
      type: string
      enum: [success, failure, denied]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 255
          description: |
            The secret the configured identity provider verifies. With the default
            provider that is the account password; behind a university SSO it is
            whatever that provider accepts, and the field keeps its name.

    IssuedToken:
      type: object
      required: [token, token_type, identity_provider, user]
      properties:
        token:
          type: string
          description: >-
            Send it in the Authorization header as a Bearer token. It is not
            retrievable afterwards.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Null when the token expires only on sign-out.
        identity_provider:
          type: string
          description: Which provider verified the credential.
          examples: [database]
        user:
          $ref: '#/components/schemas/User'

    RoleGrant:
      type: object
      description: |
        One role held in one scope. `building_id` null means the role is held over
        the system as a whole, which in this iteration is the administrator alone.
      required: [role, building_id]
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        role_name:
          type: string
        building_id:
          type: [integer, 'null']
          format: int64
        granted_at:
          type: [string, 'null']
          format: date-time

    User:
      type: object
      required: [id, full_name, email, status, password_change_required]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/UserStatus'
        password_change_required:
          type: boolean
          description: >-
            True while the account is waiting for its first password — an
            account issued under FR-42 whose one-time code has not been spent
            yet. It says that much and carries no secret; setting a password at
            `POST /auth/password` clears it.
        roles:
          type: array
          description: Present when the grants were loaded for this response.
          items:
            $ref: '#/components/schemas/RoleGrant'

    Building:
      type: object
      required: [id, name, address, is_active]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        floors_count: { type: integer, minimum: 1 }
        visiting_from:
          type: string
          description: Start of the visiting window, per building (NFR-09).
          examples: ['08:00:00']
        visiting_to:
          type: string
          examples: ['23:00:00']
        curfew_at:
          type: string
          examples: ['23:00:00']
        is_active: { type: boolean }

    RoomType:
      type: string
      description: |
        The three layouts FR-01 names. The layout belongs to the room and not to
        the dormitory as a whole, because one building routinely mixes them.
      enum: [corridor, block, apartment]

    RoomStatus:
      type: string
      description: |
        A room that is not `in_service` holds no new residency, however many of
        its places are free.
      enum: [in_service, under_repair, withdrawn]

    BedStatus:
      type: string
      description: |
        `free` and `occupied` are a projection of the residency register, which is
        the authority. `blocked` is the one value the register knows nothing
        about: an administrative decision that the place takes nobody, and the
        reason the field is stored rather than computed.

        A place whose occupant leaves at midnight reads `occupied` until the
        nightly settlement runs. It never reads `free` while somebody holds it,
        and a residency written against a place that is in fact held is refused
        by the exclusion constraint whatever this field says.
      enum: [free, occupied, blocked]

    ResidencyStatus:
      type: string
      description: |
        A projection of the period, and of nothing else. A residency is `active`
        while the person is resident and `ended` once the stated departure date
        has arrived — never before it, however long ago the notice was written.
      enum: [active, ended]

    StudyStatus:
      type: string
      enum: [enrolled, academic_leave, graduated, expelled]

    BuildingInput:
      type: object
      description: |
        Fields of a dormitory. All of them are required on creation; on an edit
        send only what changes.
      properties:
        name:
          type: string
          maxLength: 255
          description: >-
            Unique across the register. A collision comes back as a 422 on this
            field, from the form rule or, in a race between two requests, from
            the unique index behind it.
        address: { type: string, maxLength: 255 }
        floors_count: { type: integer, minimum: 1, maximum: 100 }
        visiting_from:
          type: string
          description: Start of the visiting window (NFR-09), as HH:MM:SS.
          examples: ['08:00:00']
        visiting_to:
          type: string
          examples: ['23:00:00']
        curfew_at:
          type: string
          examples: ['23:00:00']
        is_active: { type: boolean }

    RoomInput:
      type: object
      description: |
        Fields of a room. `number`, `floor` and `capacity` are required on
        creation; on an edit send only what changes.
      properties:
        number:
          type: string
          maxLength: 32
          description: Unique inside its building, free across buildings.
          examples: ['305']
        floor: { type: integer, minimum: 0, maximum: 100 }
        capacity:
          type: integer
          minimum: 1
          maximum: 32
          description: How many places the room may hold. The ceiling FR-02 checks against.
        type:
          $ref: '#/components/schemas/RoomType'
        status:
          $ref: '#/components/schemas/RoomStatus'

    Bed:
      type: object
      description: |
        One place. It carries no name: who holds it is a residency, and that is
        personal data travelling under its own policy.
      required: [id, room_id, label, status]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 16 }
        status:
          $ref: '#/components/schemas/BedStatus'
        status_label: { type: string }

    Room:
      type: object
      required: [id, building_id, number, floor, capacity, beds_count, free_places, vacant_beds]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        number: { type: string }
        floor: { type: integer }
        capacity:
          type: integer
          description: How many places the room may hold.
        type:
          $ref: '#/components/schemas/RoomType'
        type_label: { type: string }
        status:
          $ref: '#/components/schemas/RoomStatus'
        status_label: { type: string }
        beds_count:
          type: integer
          description: Places registered. Never greater than `capacity`.
        occupied_beds_count:
          type: integer
          description: Places currently held.
        free_places:
          type: integer
          minimum: 0
          description: >-
            How many further places may still be **registered**: `capacity` minus
            the places registered. This is the figure the capacity rejection
            names, sent so that a client never computes its own. It is not the
            number of places somebody could move into — see `vacant_beds`.
        vacant_beds:
          type: integer
          minimum: 0
          description: >-
            How many registered places are free for somebody to move into today.
            A blocked place counts for neither this nor `occupied_beds_count`.
            A room of four places with one occupant reports `free_places: 0` and
            `vacant_beds: 3`, and the two answer different questions.
        beds:
          type: array
          description: Present when the places were loaded for this response.
          items:
            $ref: '#/components/schemas/Bed'

    ResidencyInput:
      type: object
      required: [user_id, bed_id, contract_number, moved_in_at]
      properties:
        user_id: { type: integer, format: int64 }
        bed_id:
          type: integer
          format: int64
          description: >-
            The place. It also fixes the scope: the warden or manager of the
            building this bed stands in is the one allowed to write the row.
        contract_number: { type: string, maxLength: 64 }
        moved_in_at: { type: string, format: date }
        ground:
          type: [string, 'null']
          maxLength: 255
          description: The ground for the accommodation, recorded verbatim.

    Residency:
      type: object
      description: |
        One residency, past or present. `is_open` says no departure date has been
        written down; `is_current` says the person is resident today. A
        termination dated in the future makes the two differ — `is_open: false`
        with `is_current: true` — which is FR-05's third criterion. `is_current`
        is the one to filter a list of residents on; `status` follows it.
      required: [id, user_id, bed_id, contract_number, moved_in_at, status, is_open, is_current]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        resident_name:
          type: [string, 'null']
          description: Present when the account was loaded for this response.
        bed_id: { type: integer, format: int64 }
        bed_label: { type: [string, 'null'] }
        room_id: { type: [integer, 'null'], format: int64 }
        room_number: { type: [string, 'null'] }
        floor: { type: [integer, 'null'] }
        building_id: { type: [integer, 'null'], format: int64 }
        building_name: { type: [string, 'null'] }
        contract_number: { type: string }
        moved_in_at: { type: string, format: date }
        moved_in_ground: { type: [string, 'null'] }
        moved_out_at: { type: [string, 'null'], format: date }
        moved_out_ground: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/ResidencyStatus'
        is_open: { type: boolean }
        is_current: { type: boolean }

    Placement:
      type: object
      description: Where a residency puts a person — building, room, place.
      properties:
        building_id: { type: [integer, 'null'], format: int64 }
        building_name: { type: [string, 'null'] }
        room_id: { type: [integer, 'null'], format: int64 }
        room_number: { type: [string, 'null'] }
        floor: { type: [integer, 'null'] }
        bed_id: { type: [integer, 'null'], format: int64 }
        bed_label: { type: [string, 'null'] }
        moved_in_at: { type: [string, 'null'], format: date }

    ResidentCard:
      type: object
      description: |
        FR-06. `study_status` and `citizenship` are nullable by design: a staff
        account is not a student and has neither, and the card renders what is
        known rather than a default that looks like a fact.
      required: [id, full_name, contact, residency_history, open_obligations]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        study_status:
          oneOf:
            - $ref: '#/components/schemas/StudyStatus'
            - type: 'null'
        study_status_label: { type: [string, 'null'] }
        citizenship: { type: [string, 'null'] }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
            phone: { type: [string, 'null'] }
        account_status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        current_bed:
          description: The place held right now, or null.
          oneOf:
            - $ref: '#/components/schemas/Placement'
            - type: 'null'
        residency_history:
          type: array
          description: Every residency, newest first. Nothing is removed on move-out.
          items:
            $ref: '#/components/schemas/Residency'
        open_obligations:
          type: array
          description: |
            What the resident still owes the dormitory. The MVP register knows one
            kind: an accommodation contract that has not been terminated.
            Obligations arising from the inventory handover belong to entities
            outside this iteration and are not represented here.
          items:
            type: object
            required: [kind, residency_id, contract_number]
            properties:
              kind:
                type: string
                enum: [accommodation_contract]
              residency_id: { type: integer, format: int64 }
              contract_number: { type: string }
              since: { type: [string, 'null'], format: date }
              placement:
                $ref: '#/components/schemas/Placement'

    StaffAppointmentInput:
      type: object
      description: |
        FR-41. Who, and which role. The dormitory is not here: it comes from the
        path, so the payload cannot nominate the scope the caller's own
        authorisation is checked against.
      required: [user_id, role]
      properties:
        user_id:
          type: integer
          format: int64
          description: The account receiving the role. It need not exist in this dormitory yet.
        role:
          description: >-
            One of the roles the caller may grant. A warden may grant `manager`,
            `duty_officer` and `security`; the administrator may grant `warden`.
            Anything else is 403.
          allOf:
            - $ref: '#/components/schemas/RoleCode'

    ResidentAccountInput:
      type: object
      description: |
        FR-42. The fields of an incoming resident, and nothing else. There is no
        `role` — it is always the resident role in the dormitory named by the
        path — and no `password`: a password the caller could set is a password
        the caller knows.
      required: [full_name, email]
      properties:
        full_name: { type: string, maxLength: 255 }
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            The confirmed contact the one-time code is delivered to, which is
            why it is the one field that can be neither omitted nor duplicated.
        phone: { type: [string, 'null'], maxLength: 32 }
        study_status:
          oneOf:
            - $ref: '#/components/schemas/StudyStatus'
            - type: 'null'
        citizenship: { type: [string, 'null'], maxLength: 64 }

    SetPasswordInput:
      type: object
      description: |
        FR-42. The one-time code, and the password replacing it. The address is
        validated for shape and not for existence: a rule that checked it
        against the table would tell an unauthenticated caller which addresses
        hold an account.
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        token:
          type: string
          description: The one-time code delivered to the account's contact. Works once.
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string, minLength: 8 }

    CapacityExceeded:
      type: object
      description: |
        FR-02, second criterion. `free_places` is the remainder the register
        refused on; zero means the room is full.
      required: [message, capacity, beds, free_places]
      properties:
        message: { type: string }
        room_id: { type: integer, format: int64 }
        room_number: { type: string }
        capacity: { type: integer }
        beds: { type: integer }
        free_places: { type: integer, minimum: 0 }

    ResidencyConflict:
      type: object
      description: |
        FR-03, second criterion: the record standing in the way, so that the
        warden or manager reads which residency must end before this one can begin.
      required: [message]
      properties:
        message: { type: string }
        bed_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        conflict:
          oneOf:
            - $ref: '#/components/schemas/Residency'
            - type: 'null'

    DeletionBlocked:
      type: object
      description: |
        FR-01, second criterion: the deletion is blocked and the reason is stated.
      required: [message, entity, entity_id, blocked_by]
      properties:
        message: { type: string }
        entity: { type: string, examples: [building] }
        entity_id: { type: integer, format: int64 }
        blocked_by:
          type: object
          description: >-
            What is attached, by kind and count. Every known kind is present,
            including the ones that are nought, so that the numbers and the
            message cannot contradict each other.
          additionalProperties: { type: integer }
          examples:
            - { rooms: 12, role_grants: 0 }
            - { rooms: 0, role_grants: 3 }

    AuditEntry:
      type: object
      description: |
        The record format of §3.9.6: who, what, over which object, when, from which
        address, with what result.
      required: [id, action, user, subject, result, created_at]
      properties:
        id: { type: integer, format: int64 }
        action:
          $ref: '#/components/schemas/AuditAction'
        user:
          type: object
          properties:
            id: { type: [integer, 'null'], format: int64 }
            full_name: { type: [string, 'null'] }
        subject:
          type: object
          properties:
            type:
              type: [string, 'null']
              description: The short class name of the object acted on.
              examples: [Building]
            id: { type: [integer, 'null'], format: int64 }
        payload:
          type: [object, 'null']
          additionalProperties: true
        ip_address: { type: [string, 'null'] }
        result:
          $ref: '#/components/schemas/AuditResult'
        created_at: { type: string, format: date-time }

    InvalidCredentials:
      type: object
      required: [message, attempts_left]
      properties:
        message: { type: string }
        attempts_left:
          type: integer
          minimum: 0
          description: Attempts remaining before the block. Zero means the block has just started.

    ThrottleReason:
      type: string
      description: |
        Which limit refused the request. The field is the discriminator of the
        429: the block that follows failed attempts and the request limit of the
        route are different events and must not be reported as one.
      enum: [login_locked, address_locked, rate_limited]

    TooManyRequests:
      type: object
      required: [message, retry_after, reason]
      properties:
        message: { type: string }
        retry_after:
          type: integer
          minimum: 0
          description: Seconds until the request is accepted again. Mirrors the Retry-After header.
        reason:
          $ref: '#/components/schemas/ThrottleReason'

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationLinks:
      type: object
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'] }
        last_page: { type: integer }
        links:
          type: array
          description: |
            One entry per page button, in the order they are drawn, with the
            previous and next arrows first and last. `page` is null on an arrow
            that leads nowhere, and absent on the ellipsis that stands for a gap
            in a long sequence.
          items:
            $ref: '#/components/schemas/PaginationLink'
        path: { type: string }
        per_page: { type: integer }
        to: { type: [integer, 'null'] }
        total: { type: integer }

    PaginationLink:
      type: object
      required: [url, label, active]
      properties:
        url: { type: [string, 'null'] }
        label: { type: string }
        page: { type: [integer, 'null'] }
        active: { type: boolean }
