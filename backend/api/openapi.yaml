openapi: 3.1.0

info:
  title: Dormitory support system — API v1
  version: 0.1.0
  summary: >-
    Role model, authentication, audit log, the housing register, staff, the
    personal account, and the guest module
  description: |
    The implemented part of the REST contract of §3.3.6, in five slices. The
    first is FR-07 (role model), FR-08 (authentication and sessions) and FR-33
    (audit log). The second is the housing register: FR-01 (dormitories), FR-02
    (rooms and places), FR-03 (moving in), FR-05 (moving out) and FR-06 (the
    resident card). The third follows revision 2 of the role model: FR-41 (staff
    appointment inside a building) and FR-42 (issuing a resident account). The
    fourth is the personal account: FR-34 (notifications and the switches that
    decide which of them arrive) and FR-35 (consent to the processing of
    personal data).

    The fifth is the guest module of increment 1, which is what the work is
    built around: FR-16 (the request), FR-17 (the duty officer's decision),
    FR-18 (verification at the security post), FR-19 (entry and exit), FR-21
    (the visitor register) and FR-23 (the foreign-guest flag). FR-20, the
    control of the departure deadline, is in this increment too and has no
    route at all: it is a quarter-hourly sweep that reads each dormitory's own
    control time.

    The sixth is the announcement module of increment 2: FR-09 (publication),
    FR-11 (the feed) and FR-12 (the acknowledgement of reading). FR-10, pinning
    an important announcement, is Could priority and outside the MVP — there is
    no route for it and no column behind one.

    The seventh is the maintenance module of increment 3: FR-36 (the resident
    files a defect), FR-37 (the warden's triage), FR-38 (the status lifecycle),
    FR-39 (confirmation and reopening) and FR-40 (the dormitory's queue and its
    export). Two of its requirements have no route at all and are scheduled
    passes: FR-39's automatic closure of a request nobody confirmed, and FR-40's
    nightly flagging of the requests past the configured threshold.

    The remaining routes of §3.3.6 — lost-and-found — belong to a later increment
    and are deliberately absent from this document rather than described as
    unimplemented: the file is the input for client generation, and a generated
    client should not carry methods that answer 404.

    Nine properties of the contract are worth reading before the paths.

    Authorisation is scoped by building, not only by role. A grant of a role names
    the dormitory it holds in, and every building-addressed route decides on the
    object rather than on the role alone. A warden of one building asking about
    another gets 403, at the API and not merely in the interface.

    There are six roles, and the two in the middle differ in exactly one thing.
    The warden heads the dormitory; the manager beneath him does the register
    work — rooms, places, moving in and out, resident cards and accounts — and
    appoints nobody. Everywhere in this document that says «the warden of this
    building» about operative work, the manager of that building is included.
    Where a route is the warden's alone, it says so.

    The sign-in route has two distinct refusals. 401 means the credential did not
    resolve to an account that may sign in; it never says whether the login exists.
    429 means the login is inside its block window after the configured number of
    failed attempts, and the reply carries the seconds remaining.

    The bed, not the room, is the unit of residency. A room declares a `capacity`
    and holds that many places; a residency names a place. This is what lets
    «three beds in the room, two taken» be said at all, and it is why the refusal
    to exceed a capacity can name the free remainder.

    A residency is historical and is never deleted. Moving out writes
    `moved_out_at` and a ground; the record stays, the place is freed at once, and
    the person's access to building-bound routes ends on the stated date. Two
    residents holding one place over overlapping periods is refused by a partial
    unique index in the database, and the refusal carries the conflicting record.

    Consent to the processing of personal data has routes of its own, and that
    is the requirement rather than an arrangement. Art. 9 part 1 of Federal Law
    No. 152-FZ has consent «executed separately from other documents», so no
    other request in this document carries a field that records one: not the
    sign-in, not the first password, not the account form. `POST /consents`
    names exactly one document and one text revision, and it is the only way a
    consent record comes into being.

    A guest's consent is taken at the security post and not at submission. The
    request is filed by the resident while the personal data belong to the
    guest, so `POST /checkpoint/guest-consent` is a route of its own and
    `POST /checkpoint/check-in` answers 409 until it has been called. The record
    names the guest request as its subject and carries no account, because a
    guest has none.

    The visiting regime is a property of each dormitory and never a constant.
    `visiting_from`, `visiting_to`, `curfew_at` and `guest_lead_time_hours` sit
    on the BUILDING row, and they are what the submission validator, the card at
    the post and the overdue sweep all read. A university whose rules close the
    dormitory at 22:00 changes a column, which is what NFR-09 asks for. The
    defaults reproduce clause 2.2 of the HSE rules of internal order — a guest
    between 08:00 and 23:00 — and are this deployment's values rather than the
    sector's.

    An announcement is addressed by `building_id`, and a null one means every
    dormitory. That single column is the audience: the feed filters on it, the
    fan-out reads it, and there is no recipient list that could disagree with
    it. Leaving it out is the administrator's right and nobody else's — a warden
    who could would be addressing dormitories his grant does not name. The
    validity period is the same kind of thing: `expires_at` is a comparison the
    feed makes and not a status anybody sets, so an announcement leaves the feed
    for the archive by itself and no job has to run for it to happen.

    The system records facts about people's movement and does not restrict it.
    A refusal at the checkpoint is a refusal to *record* an entry as lawful, not
    a barrier: the ground for refusing a person entry to a dormitory is the
    university's local act and the action of the security service. An officer
    may admit a guest against the interval, with a stated reason, and both the
    entry and the exception are recorded.

servers:
  - url: http://localhost:8080/api/v1
    description: Local development — the port docker-compose publishes the web container on
  - url: /api/v1
    description: Same origin as the client

tags:
  - name: Authentication
    description: FR-08. Sign-in, sign-out and the identity of the current session.
  - name: Buildings
    description: >-
      FR-01 and FR-07. The register of dormitories, and the routes the
      role-and-building scope is demonstrated on.
  - name: Rooms
    description: FR-02. The register of rooms and places, kept per building.
  - name: Residencies
    description: FR-03 and FR-05. Moving in, and moving out.
  - name: Residents
    description: FR-06 and FR-42. The resident card, and the account behind it.
  - name: Staff
    description: >-
      FR-41. Appointing and dismissing the staff of one dormitory. The warden's
      route: the manager appoints nobody.
  - name: Notifications
    description: >-
      FR-34. A person's own messages, and the switches that decide which
      categories reach them at all.
  - name: Consent
    description: >-
      FR-35. Consent to the processing of personal data, on routes of its own,
      as art. 9 part 1 of Federal Law No. 152-FZ requires.
  - name: Announcements
    description: >-
      FR-09, FR-11 and FR-12. The warden or the manager of a dormitory
      publishes; the administrator addresses all of them. The resident reads a
      feed with the unread marked, and acknowledges the notices that require it.
  - name: Guest requests
    description: >-
      FR-16, FR-17 and FR-23. The resident invites; the duty officer of that
      dormitory decides. Nobody else does — not the warden, not the manager,
      not the administrator.
  - name: Checkpoint
    description: >-
      FR-18 and FR-19. The security post: find the guest, take their consent,
      record the entry, record the exit. Verification and entry are two
      operations on purpose (§3.5.1).
  - name: Visitor register
    description: >-
      FR-21. The journal clause 2.1.2 of the HSE rules of internal order makes
      the security service keep by hand, with the pen removed. Append-only; a
      correction is a correcting entry.
  - name: Maintenance
    description: >-
      FR-36 … FR-40. The resident reports a defect; the warden or the manager of
      that dormitory triages it and carries it as far as «completed»; the
      resident who reported it is the only person who can close it. A request
      nobody confirms closes itself after a configurable window, marked as
      automatically closed rather than as confirmed.
  - name: Audit
    description: FR-33. Append-only, readable by the administrator alone.

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and receive an API token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The credential was accepted and a token was issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedToken'
        '401':
          description: |
            The login or the password is wrong, or the account is not active. The
            body carries how many attempts remain before the block; zero means this
            attempt was the last one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: |
            The request was refused for a while, and `reason` says by which of the
            three limits. `login_locked`: the account reached the configured number
            of failed attempts — five attempts, fifteen minutes by default.
            `address_locked`: the network address reached its own ceiling, counted
            across every login tried from it. `rate_limited`: the address sent more
            requests to this route than it admits per minute, which says nothing
            about credentials at all — a caller with a correct password and no
            failed attempt can meet it.

            All three carry the same body, so a client reads `retry_after` without
            branching and branches on `reason` only where the wording matters.
          headers:
            Retry-After:
              description: Seconds until the request is accepted again.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'

  /auth/password:
    post:
      tags: [Authentication]
      summary: Set a password with a one-time code
      description: |
        FR-42, third criterion. An account issued to an incoming resident is
        created with a secret nobody holds; what the resident receives, at their
        own contact and never on the screen of the person who created the
        account, is a one-time code. This route spends that code and puts a
        password of the resident's own in its place.

        Unauthenticated, of necessity: the account has no password to sign in
        with yet. The code takes the place of a session, works once, and expires
        an hour after it is issued. Every API token the account already held is
        revoked with the change.

        The refusal says nothing about which of the four causes it was — no such
        address, a code that never existed, one already spent, one expired — for
        the same reason the sign-in route never says whether a login exists.
      operationId: setPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordInput'
      responses:
        '204':
          description: The password is set and the code is spent. The event is in the audit log.
        '422':
          description: |
            Either the payload failed validation, or the code did not resolve.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '429':
          description: >-
            The address sent more requests to this route than it admits per
            minute. A limiter of its own, counted apart from the sign-in route:
            both are keyed by network address and a dormitory is one address, so
            a shared counter meant a handful of guesses at a code locked
            everybody behind that address out of signing in. `reason` is
            `rate_limited`, and the message names this route rather than the
            sign-in one.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the token used for this request
      operationId: logout
      responses:
        '204':
          description: The token is revoked and the sign-out is recorded in the audit log.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Authentication]
      summary: The account behind the current token, with its role grants
      operationId: currentUser
      responses:
        '200':
          description: The authenticated account.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /buildings:
    get:
      tags: [Buildings]
      summary: The register of dormitories, scoped to the caller
      description: |
        The administrator sees every dormitory; every other role sees the ones its
        grants name. This is the «empty scoped result» half of FR-07's criterion:
        the route is not refused, the answer is narrowed.

        A resident the register shows as moved out is narrowed out too, even
        though eviction revokes no role grant. The listing and
        `GET /buildings/{building}` answer the same question, so no row here
        leads to a 403 there.
      operationId: listBuildings
      responses:
        '200':
          description: The dormitories this account may see.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Buildings]
      summary: Register a dormitory
      description: |
        FR-01, first criterion: the administrator and nobody else. A warden's
        token gets 403 here, including a warden of the dormitory the request
        concerns — the refusal is about the role, not about the scope.
      operationId: createBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '201':
          description: >-
            The dormitory was registered. The change is in the audit log. The
            answer carries the regime settings that were defaulted, so it matches
            a subsequent read of the same dormitory field for field.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/archive:
    post:
      tags: [Buildings]
      summary: Archive a dormitory
      description: |
        FR-01, first criterion. The row survives and `is_active` becomes false, so
        that the residency history of a closed dormitory stays readable. The
        administrator alone.
      operationId: archiveBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The dormitory is archived.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}/rooms:
    get:
      tags: [Rooms]
      summary: The register of rooms and places of one dormitory
      description: |
        FR-02. Each entry carries the capacity, the places registered, the places
        occupied, how many further places may be registered (`free_places`) and
        how many registered places are free for somebody to move into
        (`vacant_beds`), so that a client never has to subtract and arrive at a
        figure the server did not refuse on.

        The administrator, and the warden, manager or duty officer **of this
        building**. A resident does not read the occupancy of the whole dormitory.
      operationId: listBuildingRooms
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The rooms, by floor and then by number.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Rooms]
      summary: Register a room
      description: |
        FR-02. The warden or the manager of this building, or the administrator. A
        room number is unique inside its building and free across buildings.
      operationId: createRoom
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: The room was registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /rooms/{room}:
    get:
      tags: [Rooms]
      summary: One room with its places
      operationId: showRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: The room card, places included.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rooms]
      summary: Edit a room
      description: |
        FR-02. Lowering `capacity` below the places already registered is the
        capacity rule approached from the other side and is refused with the same
        422, carrying the same figures.
      operationId: updateRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: The room as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the payload failed validation, or the capacity rule of FR-02 was
            broken. The second case carries `capacity`, `beds` and `free_places`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/CapacityExceeded'

  /rooms/{room}/beds:
    post:
      tags: [Rooms]
      summary: Register a place in a room
      description: |
        FR-02, second criterion. An attempt to take the room past its capacity is
        rejected **and the free remainder is shown**: the 422 carries `capacity`,
        `beds` and `free_places`, and `free_places` is the number the register
        refused on rather than one the client computed.

        A place label is unique inside its room, which the database enforces and
        the form reports.
      operationId: createBed
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 16
                  description: The place identifier inside the room.
                  examples: ['1', '2a']
      responses:
        '201':
          description: The place was registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Bed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the payload failed validation — a duplicate label, for one — or
            the room is full, in which case the body names the free remainder.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/CapacityExceeded'

  /residencies:
    post:
      tags: [Residencies]
      summary: Place a resident in a bed
      description: |
        FR-03. The scope is read off the bed: a residency names no building, and
        the warden or manager of the building the bed stands in is the one allowed
        to write the row.

        Two residents cannot hold one place over overlapping periods. The refusal
        comes from the exclusion constraint `residencies_bed_no_overlap` in the
        database, not from a check in the application, and the 409 it produces
        carries the conflicting record under `conflict`. A resident already
        holding another place is refused the same way, by
        `residencies_user_no_overlap`.

        The rule is about **periods**, not about open records. A `moved_in_at`
        backdated underneath a residency that is already running is refused, and
        so is a place whose termination has been recorded for a date still to
        come. The bounds are closed below and open above, so a move-in on the
        very day the last occupant leaves is admitted: a bed changes hands
        without a night of nobody in it.
      operationId: createResidency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidencyInput'
      responses:
        '201':
          description: The residency was recorded and the place is now occupied.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Residency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The place is held over a period that overlaps the one asked for, or
            the person already holds another place over such a period. The record
            standing in the way is in `conflict` — it may well be one whose
            termination date lies in the future.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidencyConflict'
        '422':
          description: |
            Either the payload failed validation, or the place cannot receive
            anybody — a blocked bed, or a room under repair or withdrawn.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'

  /residencies/{residency}/termination:
    post:
      tags: [Residencies]
      summary: End a residency
      description: |
        FR-05. The row is **not** deleted: the ground and the date are written,
        and the history stays readable on the card of FR-06.

        `moved_out_at` may lie in the future, and then nothing else changes yet.
        The record stays `active`, the place stays `occupied`, and the person's
        access to building-bound routes runs until the stated date and is gone on
        it — «no later than the stated date». `is_open` becomes false because a
        departure date is now written down; `is_current` stays true because the
        person is still living there. The two are the halves of that distinction
        and they are meant to differ.

        On the stated date the record becomes `ended` and the place becomes
        `free`, done by the nightly `housing:settle-residencies` when no request
        happens to be doing it. A termination dated today does all of it at
        once.

        The ground is required. A termination with an empty reason is refused with
        422.
      operationId: terminateResidency
      parameters:
        - $ref: '#/components/parameters/ResidencyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ground]
              properties:
                ground:
                  type: string
                  minLength: 3
                  maxLength: 255
                  description: Why the residency ends. Recorded verbatim.
                  examples: ['Graduation, art. 105 cl. 2 of the Housing Code']
                moved_out_at:
                  type: string
                  format: date
                  description: >-
                    The day the residency ends. Defaults to today; may be set
                    forward, never before the move-in date.
      responses:
        '200':
          description: The residency as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Residency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /residents/{resident}:
    get:
      tags: [Residents]
      summary: The resident card
      description: |
        FR-06. Visible to the warden and the manager **of that dormitory** and to
        the administrator; a resident sees only their own. Nobody else: the duty
        officer's work is the guest request and the security officer's is the
        entrance, and neither needs a citizenship or a telephone number. The
        warden of building 1 requesting a card of building 2 gets 403, at the API
        and not merely in the interface.

        The card carries the name, the study status, the citizenship, the contact,
        the current place, the whole residency history and the open obligations.
        `current_bed` and `open_obligations` are read as «resident today», not as
        «no departure date written»: somebody leaving at the end of December has
        a current place until the end of December. Reading the card is recorded in
        the audit log, because it carries personal data.
      operationId: showResidentCard
      parameters:
        - $ref: '#/components/parameters/ResidentId'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResidentCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}:
    get:
      tags: [Buildings]
      summary: The card of one building
      description: |
        Readable by the administrator and by anyone holding a role in this
        building. A staff member of another building gets 403.
      operationId: showBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The building card. The read is recorded in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            No role covering this building — or, for a resident, a residency the
            register shows as ended: FR-05 closes the building-bound routes on the
            stated date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Buildings]
      summary: Edit a dormitory
      description: 'FR-01, first criterion: the administrator alone.'
      operationId: updateBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '200':
          description: The dormitory as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Buildings]
      summary: Delete a dormitory
      description: |
        FR-01, second criterion. A dormitory that still has anything attached
        cannot be deleted, and the refusal states **which** thing: 409 whose
        `blocked_by` carries both counts and whose message names the one that
        actually refused.

        Two foreign keys point at a dormitory and either can block the delete:
        `rooms.building_id` and `role_user.building_id`, both `ON DELETE
        RESTRICT`. It is the database that refuses, so the rule holds against
        code that forgot to ask.

        The way out depends on which it was. A staff grant is revoked through
        `DELETE /buildings/{building}/staff/{user}/{role}`. Rooms are not:
        this API has no route that deletes or moves one, so the message points at
        archiving instead, which keeps the rooms and their residency history
        readable.
      operationId: deleteBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '204':
          description: The dormitory held no rooms and is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Rooms or staff grants are attached. The body states which, and both
            counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionBlocked'

  /buildings/{building}/users:
    get:
      tags: [Buildings]
      summary: The people holding a role in this building
      description: |
        Personal data, so the circle is narrower than for the card: the
        administrator, and the warden, manager or duty officer **of this
        building**. A resident of the building gets 403, and so does the warden of
        any other building. The answer never carries a person attached to a different
        dormitory.
      operationId: listBuildingUsers
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The roll of the building. The read is recorded in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}/staff:
    post:
      tags: [Staff]
      summary: Appoint a member of staff in this dormitory
      description: |
        FR-41. The warden of **this** building grants the manager, duty officer
        or security role inside it. Three refusals are worth telling apart, and
        all three are 403 because all three are a question of who the caller is:

        - the same call against another dormitory — the scope of the caller's own
          grant is what decides, and the path is what it is compared against;
        - a grant of the administrator or the warden role — the chain of
          appointment runs downwards only, and the administrator's grant is
          issued outside the application entirely;
        - any staff grant at all attempted by a manager — the one capability
          revision 2 of the role model withheld from him.

        The grant names the building from the path. A `building_id` in the
        payload is ignored, because a body that could nominate the scope would
        be nominating the scope the caller's own authorisation is checked
        against.

        `user_id` is judged too, and not only checked for existence: an account
        the register of **another** dormitory answers for cannot be given a role
        here, and the refusal is 422 on that field. An account no dormitory
        answers for — a security officer hired from outside — is the ordinary
        case and is appointed as before, and so is a resident of this same
        dormitory taking a shift in it.

        Appointing twice is one appointment: the answer is 200 rather than 201,
        no second grant is written, and the log keeps one entry per grant.
      operationId: appointStaff
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAppointmentInput'
      responses:
        '200':
          description: The account already held this role here. Nothing changed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoleGrant'
        '201':
          description: The role is granted. The appointment is in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoleGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/staff/{user}/{role}:
    delete:
      tags: [Staff]
      summary: Dismiss a member of staff of this dormitory
      description: |
        FR-41, the revocation half. The same circle of roles as the appointment,
        and deliberately the same: a warden able to revoke another warden could
        remove the one account above him in his own building.

        404 means the account holds no such role here — a revocation that
        revoked nothing must not read as a success.
      operationId: revokeStaff
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/StaffUserId'
        - $ref: '#/components/parameters/StaffRole'
      responses:
        '204':
          description: The role is revoked. The dismissal is in the audit log.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such dormitory or account, or the account holds no such role here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/residents:
    post:
      tags: [Residents]
      summary: Issue an account to an incoming resident
      description: |
        FR-42. The warden or the manager of **this** dormitory creates the
        account of a person moving in: name, contact, study status, citizenship.

        There is no `role` field and no `password` field, and both absences are
        the requirement rather than an omission.

        The grant the account receives is always the resident role, always
        scoped to the building in the path, so no staff role can be issued this
        way — there is no parameter through which one could be asked for.

        The address is typed here and is not confirmed before the first message
        goes to it. What confirms it is the code being spent: the account is
        marked as having a proved address at the moment `POST /auth/password`
        succeeds, and until then nobody has shown that anyone reads it.

        The credential does not travel in this response. The account is created
        with a secret that is generated, hashed and forgotten in the same step;
        what reaches the resident is a one-time code, sent to the address on the
        account and spent at `POST /auth/password`. The response describes the
        account and carries `password_change_required: true`, which is how a
        client knows the account is still waiting for its first password.

        Constraint C-03 leaves one delivery channel in this iteration, and it is
        mail. The message is queued rather than sent inline: creating an account
        must not wait on a mail server.
      operationId: issueResidentAccount
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentAccountInput'
      responses:
        '201':
          description: >-
            The account exists, the resident role is granted in this dormitory,
            and the one-time code is on its way to the contact. The issue is in
            the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/residents/{resident}/credential:
    post:
      tags: [Residents]
      summary: Send a resident a fresh one-time code
      description: |
        FR-42, the way back out of a lost code.

        A code lives an hour. Before this route existed, an account whose code
        expired unspent was finished: the password could not be set, no second
        code could be issued, the account could not be removed, and `users.email`
        is unique — so the address stayed held by a row nobody could use. One
        road in, an hour wide, and no way back.

        The same circle of callers as issuing the account, and for the same
        reason: sending a second code is the same act as sending the first. The
        code goes to the address on the account, never into this response, and
        the person who asks for it never sees it.

        Issuing a second code is also the revocation of the first. The token
        store keeps one code per account, so the replacement is what stops the
        one that went astray, and two live codes for one account never exist.

        Two refusals are particular to this route:

        - **404** — the account is not a resident of the dormitory in the path.
          The caller may work here; there is no such resident here.
        - **409** — the account already carries a password of its own. Sending it
          a fresh code would be a password reset performed by a member of staff,
          which is a far larger power than FR-42 grants: it would let a manager
          take over any resident of his building. Recovery for an account in use
          is a separate requirement and is not in this iteration.

        The event reaches the audit log as `resident.credential_issued` with
        `reissue: true`, so an administrator can see how many codes an account
        was sent and by whom. The record is written after the delivery has been
        accepted and never before.
      operationId: reissueResidentCredential
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/ResidentId'
      responses:
        '202':
          description: >-
            The delivery was accepted and the code is on its way to the address
            on the account. Accepted rather than done: whether a mail server
            takes it is not this application's fact to assert. No body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such dormitory, or no such resident in this dormitory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The account already has a password of its own. A one-time code is
            issued only to an account that has never set one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications:
    get:
      tags: [Notifications]
      summary: The messages of the personal account
      description: |
        FR-34, the in-app half. One person's own messages, newest first. The
        route is scoped to the account the token names and has no parameter for
        any other, which is why it carries no role check: there is nothing here
        to be authorised against.

        `payload` is the body of the message and its shape depends on the
        category — each notification decides its own in `toDatabase()`. `category`
        is lifted out of it into a field of its own, because that is what a
        client groups and filters by.

        The field is called `payload` and not `data` on purpose: a resource
        whose top-level object carried a key called `data` would be taken by the
        framework to have wrapped itself, and this one route would answer
        without the `data` envelope every other route in this document has.
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          required: false
          description: Return only the messages that have not been marked read.
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the person's messages, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      summary: Mark one message read
      description: |
        FR-34. Idempotent: a message already read keeps the moment it was first
        read rather than acquiring a new one.

        A message belonging to another account answers 404 and not 403. The
        difference is deliberate — a 403 would confirm that the identifier
        exists, which is more than a stranger should be told.
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The message, now carrying `read_at`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /notification-settings:
    get:
      tags: [Notifications]
      summary: Which categories of notification reach this person
      description: |
        FR-34, second criterion. Every category is listed, including the ones
        nobody has decided about — those come back `enabled: true`, which is the
        default.

        `mandatory` says whether the switch may be moved at all. It is in the
        answer rather than left to the client to keep a list of its own: which
        categories are mandatory is a matter of the legal ground the message
        rests on, the server decides it, and a client that duplicated the
        decision would eventually draw a switch the server refuses to move.
      operationId: listNotificationSettings
      responses:
        '200':
          description: Every category, with its state for this person.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSetting'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [Notifications]
      summary: Switch notification categories on or off
      description: |
        FR-34, second criterion: «the user can disable non-mandatory
        categories».

        The map may be partial — the screen sends what it changed, and a request
        carrying one category must not switch the rest back on. The answer is
        the whole state all the same, so the client redraws from one response
        and cannot end up showing a switch the server did not accept.

        A mandatory category is refused with 422 rather than ignored. Ignoring
        it would answer «saved» and go on sending, and the person would be left
        believing they had switched something off.

        Turning a category on does not by itself guarantee delivery: the
        categories that rest on consent stop when the consent of FR-35 is
        withdrawn, whatever the switch says.
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsInput'
      responses:
        '200':
          description: The settings as they now stand, in full.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSetting'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Either the payload failed validation — an unknown category among the
            keys, or a value that is not a boolean — or it asked for a mandatory
            category to be switched off, which is the `MandatoryCategory` shape.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/MandatoryCategory'

  /consents/pending:
    get:
      tags: [Consent]
      summary: The consent texts this person has not yet decided on
      description: |
        FR-35, first criterion, the «displayed» half. The wording comes with it:
        art. 9 part 1 of Federal Law No. 152-FZ requires consent to be informed,
        and a title with a checkbox beside it is not that.

        A consent given against a text that has since been superseded counts as
        pending — the person agreed to a wording, and the wording has changed.
        Nothing in the code says so; it falls out of comparing the revision on
        the record with the revision in force.

        The list is empty when nothing is outstanding. Nothing blocks the
        session while it is not: consent has to be free (art. 9 part 1), and a
        system that locked the account until it was given would be extracting
        consent rather than receiving it.
      operationId: listPendingConsents
      responses:
        '200':
          description: The texts awaiting a decision, in full.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentText'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /consents:
    get:
      tags: [Consent]
      summary: This person's history of consent
      description: |
        Given, withdrawn, given again — newest first, withdrawn rows included.
        They are the history of a legal act and are never pruned: art. 9 part 3
        of Federal Law No. 152-FZ puts on the operator the burden of proving
        that consent was given, and the proof has to survive the withdrawal.
      operationId: listConsents
      responses:
        '200':
          description: Every act of consent this person has performed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Consent]
      summary: Give consent to one document
      description: |
        FR-35, first criterion, the «recorded» half, and the second criterion in
        its entirety.

        One document per request, named explicitly. There is no «accept all»,
        no array, and no other route in this document that records a consent as
        a by-product — art. 9 part 1 has consent «executed separately from other
        documents», which is a rule about the act and not about the layout of a
        page.

        `revision` is the text the person actually read, and it is checked
        against the revision in force. A client that held the screen open while
        the operator published a new text is sent back for the current one: a
        record naming a wording this person never saw would prove nothing.

        Consenting again to the revision already in force answers with the
        standing record rather than writing a second one. Consenting to a new
        revision supersedes the old, which is marked withdrawn on the same day.

        `guest_personal_data` is refused here: the guest's consent is taken at
        the security post, in person, before the entry is recorded.
      operationId: giveConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInput'
      responses:
        '201':
          description: >-
            The consent is recorded with the fact, the date, the text revision
            and the address it was given from. The act is in the audit log as
            `consent.granted`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /consents/{document}/withdrawal:
    post:
      tags: [Consent]
      summary: Withdraw consent to one document
      description: |
        FR-35, fourth criterion: withdrawal, from the personal account.

        **What the withdrawal does.** It writes `revoked_at` and stops the
        processing that rested on consent. It does not delete the record — art.
        9 part 3 puts on the operator the burden of proving consent, and the
        proof is needed for the period before the withdrawal as much as after.

        **What it does not do.** For a resident it closes nothing: the housing
        register, the resident card and the notifications the dormitory is
        obliged to send all rest on the accommodation contract (art. 6 part 1
        cl. 5) and continue. What stops is the optional half of FR-34's
        categories, which have no other ground. The person becomes pending
        again and is offered the text at the next sign-in; they are not locked
        out, because consent that could only be withheld at the price of the
        service would not be free.

        For a **guest** the same withdrawal is absolute, and that asymmetry is
        the point of §2.7.1: a guest is not a party to the accommodation
        contract, so consent is the sole ground there is and without it no entry
        can be recorded at the post.

        A withdrawal when nothing stands is 204 rather than 404: the caller
        asked for a state, and the state is what they get.
      operationId: withdrawConsent
      parameters:
        - $ref: '#/components/parameters/ConsentDocumentCode'
      responses:
        '200':
          description: >-
            The consent that stood, now carrying `revoked_at`. The act is in the
            audit log as `consent.withdrawn`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentRecord'
        '204':
          description: There was no consent of this document in force.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit-logs:
    get:
      tags: [Audit]
      summary: Read the audit log
      description: |
        The administrator alone. Reading the log is itself a recorded event, so
        every call adds one entry of its own. The log has no write route and can
        have none: the database has revoked UPDATE and DELETE on the table from
        the role the application connects as.
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          required: false
          description: Return only the entries of one action.
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the log, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /announcements:
    get:
      tags: [Announcements]
      summary: The caller's own announcement feed
      description: |
        FR-11. The announcements addressed to the dormitories this account is
        attached to, plus those addressed to every dormitory, published and not
        yet expired, newest first, with the unread marked.

        **The route carries no building parameter, and that is the boundary.**
        The audience is computed from the grants of the token, so there is no
        way to phrase a request for another dormitory's feed — the horizontal
        boundary of FR-07 is the absence of a parameter here rather than a check
        somebody has to remember. FR-05 applies on top of it: a resident whose
        departure date has passed stops seeing that dormitory's feed.

        `is_unread` is computed per reader by a left join against the
        acknowledgements, so one resident acknowledging a notice does not mark
        it read for the rest of the dormitory.

        `archived=true` returns the other side of the `expires_at` comparison —
        the announcements that have left the feed. Nothing moves them there;
        there is no archiving job and no status column.
      operationId: listAnnouncements
      parameters:
        - name: category
          in: query
          required: false
          description: Return only the announcements of one category. An unknown value is 422, not an empty feed.
          schema:
            $ref: '#/components/schemas/AnnouncementCategory'
        - name: archived
          in: query
          required: false
          description: Return the expired announcements instead of the current ones.
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the feed, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Announcements]
      summary: Publish an announcement
      description: |
        FR-09. The warden or the manager of the dormitory named, and the
        administrator.

        **Omitting `building_id` addresses every dormitory, and it is the
        administrator's alone.** A null building is an audience and not a
        missing field (§3.4.2); a warden permitted to leave it out would be
        addressing buildings his grant does not name, which is FR-07's boundary
        crossed by an omission rather than by a leak. A warden who tries gets
        403.

        `published_at` is not accepted. Publication happens now — a settable
        date would let a notice be back-dated, and FR-12's evidence is that the
        resident was told on a day they can check.

        `expires_at` is the validity period of FR-09 and may be omitted, in
        which case the announcement does not expire. An expiry already past is
        422: it would produce a notice in no feed and in no archive.

        The fan-out to the audience is queued. A resident who has switched the
        routine announcement category off receives nothing; one who has
        switched it off still receives an announcement marked
        `is_mandatory`, because that category cannot be switched off (FR-34).
      operationId: publishAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '201':
          description: >-
            The announcement is published and is in the audit log as
            `announcement.published`, with its addressee — a building identifier
            or null for all of them.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /announcements/{announcement}/ack:
    post:
      tags: [Announcements]
      summary: Acknowledge an announcement
      description: |
        FR-12, first criterion: the fact and the time of the acknowledgement are
        recorded, as a row carrying the reader and the moment.

        **Idempotent, and 200 on the first call as on the twentieth.** A repeat
        returns the acknowledgement already on record rather than writing a
        second one — `UNIQUE (announcement_id, user_id)` in the database, not a
        check in a service — and the moment stored stays the first reading. A
        status that told the first call from a repeat would invite a client to
        treat the repeat as an error, which is the opposite of what idempotence
        is for.

        Only the audience may acknowledge: a row asserting that somebody read a
        notice they could not see would be worse than no row. Any announcement
        may be acknowledged, not only a mandatory one — the same row is what
        clears the unread mark of FR-11.

        The announcement comes back carrying the mark, so a client that
        acknowledges from the feed redraws one row rather than reloading.
      operationId: acknowledgeAnnouncement
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: The announcement, with `acknowledged_at` set.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /announcements/{announcement}/readers:
    get:
      tags: [Announcements]
      summary: Who has acknowledged an announcement, and who has not
      description: |
        FR-12, second criterion: the acknowledged share and a named list of
        those who have not read, **within the caller's own dormitory**.

        The route returns personal data assembled for a purpose — residents who
        have not complied with an instruction — and it is guarded twice over.

        The caller must hold the publishing capability in the dormitory the
        announcement names; a warden of another building gets 403 and the
        refusal is in the audit log as `access.denied`. And for an announcement
        addressed to every dormitory, where a building-scoped warden
        legitimately may look, the names returned are narrowed to his own
        building — `building_ids` in the response says which dormitories the
        figures are about. The administrator, whose grant names none, sees them
        all.

        The audience is the residents of those dormitories by the register, less
        those the register says have moved out (FR-05): a warden is not handed
        the name of somebody who failed to read a notice they could not see.

        Reading this list is itself an event of the audit log
        (`announcement.readers_viewed`). The acknowledgements are not: the row
        already carries who and when.
      operationId: showAnnouncementReaders
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: The share and the two lists.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AnnouncementReaders'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /guest-requests:
    get:
      tags: [Guest requests]
      summary: The duty officer's queue, or the caller's own requests
      description: |
        Two lists behind one route, and the scope decides which.

        With `building_id`, this is the queue of that dormitory and the caller
        needs the capability that reads it — the duty officer, the warden, the
        manager or the administrator. Without it, this is «my own requests» and
        needs nothing beyond a session: the filter is the identifier of the
        token, and there is no parameter through which one resident could ask
        about another's guests.
      operationId: listGuestRequests
      parameters:
        - name: building_id
          in: query
          required: false
          description: The dormitory whose queue is being read. Omit for the caller's own requests.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GuestRequestStatus'
        - name: visit_date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: The requests, newest visit first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Guest requests]
      summary: Submit a guest request
      description: |
        FR-16. The resident of the dormitory named, and only a resident of it:
        the right to invite a guest follows from living there and not from an
        account being scoped there, so a member of staff with no residency is
        refused and so is a resident whose departure date has passed (FR-05).

        **Three rules, and all three read the BUILDING row.** The interval must
        lie inside `visiting_from`–`visiting_to`; it must begin no sooner than
        `guest_lead_time_hours` from now; the visit date must not be in the
        past. A dormitory whose rules close at 22:00 changes a column and this
        route changes with it, which is what NFR-09 asks for — the window is
        never a constant in code.

        `is_foreign_document` is **derived** from `guest_doc_type` and is not
        accepted from the client (FR-23): a client able to set it could clear
        it, and the warning would then be attached at the client's discretion.

        The document number is stored encrypted (NFR-06). It never comes back
        in a response; `guest_doc_number_masked` carries its last four
        characters, and the number in full has a route of its own that records
        the reading.
      operationId: submitGuestRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequestInput'
      responses:
        '201':
          description: >-
            The request is filed in `pending_review` and is in the audit log as
            `guest_request.submitted`. No access code exists yet: it is issued
            only on approval.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guest-requests/{guestRequest}:
    get:
      tags: [Guest requests]
      summary: One guest request
      description: >-
        The resident who submitted it, and the staff of the dormitory whose
        capability covers the queue.
      operationId: showGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      responses:
        '200':
          description: The request, with its visit if one has been recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /guest-requests/{guestRequest}/approve:
    post:
      tags: [Guest requests]
      summary: Approve a guest request
      description: |
        FR-17. **The duty officer of this dormitory**, and nobody else: not the
        warden, not the manager, not the administrator. The capability sits on
        one role (`Permission::DecideGuestRequests`), which is the agreement of
        13.09.2026 stated once rather than repeated in four policies.

        The consequence is deliberate: a dormitory with no duty officer
        appointed cannot approve a guest request, and the remedy is an
        appointment under FR-41.

        On success the access code is drawn and stored, `decided_by` and
        `decided_at` are written, the audit record is written in the same
        transaction, and the applicant is notified after the commit
        (`request_decision`, an optional category the resident may switch off).

        **`responsible_officer_mark` is FR-23's second criterion.** It is
        required — 422 — when the guest carries a foreign document *and* the
        interval runs past midnight. Both halves matter: a foreign document on
        a visit that ends the same evening creates no place of stay under art.
        2 cl. 4 of Federal Law No. 109-FZ, and demanding the mark for it would
        overstate the norm. The mark records that the officer responsible for
        migration registration has been told; the system submits no arrival
        notification of its own (FR-W2).
      operationId: approveGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestApprovalInput'
      responses:
        '200':
          description: Approved, with the access code now on the request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The request is no longer pending — usually because a second officer
            decided it first. The body names the state it is in and the state
            that was asked for (§3.5.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          description: >-
            The daily quota is spent, or FR-23's mark is missing. The two are
            told apart by the fields the body carries.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuotaError'
                  - $ref: '#/components/schemas/OfficerMarkRequiredError'
                  - $ref: '#/components/schemas/ValidationError'

  /guest-requests/{guestRequest}/reject:
    post:
      tags: [Guest requests]
      summary: Refuse a guest request
      description: |
        FR-17, second criterion: «rejection without a reason is impossible». The
        reason is required by this route and is a required argument of the
        service behind it, so there is no path by which a refusal is recorded
        without one.

        The applicant is told the reason.
      operationId: rejectGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRejectionInput'
      responses:
        '200':
          description: Refused, with the reason on the request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guest-requests/{guestRequest}/cancellation:
    post:
      tags: [Guest requests]
      summary: Withdraw one's own guest request
      description: >-
        The author, and nobody else. A member of staff who wants a visit
        stopped refuses it, which leaves a reason and an author on the row; a
        cancellation by staff would close the request with a record saying the
        resident changed their mind.
      operationId: cancelGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request has already run its course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'

  /guest-requests/{guestRequest}/document-number:
    get:
      tags: [Guest requests]
      summary: The guest's document number in full
      description: |
        NFR-06 and §3.9.6. The column is stored encrypted and shown masked
        everywhere else; this route is the only way to the number itself, and
        every call writes `guest_request.document_viewed` to the audit log.

        The circle is narrower than the request's own readers and does not
        include the security post: at the desk the document is in the officer's
        hand, and the last four characters are what a comparison needs. The
        warden of that dormitory and the administrator may ask.

        A route rather than a field on the request, deliberately: a field would
        be sent on every list and every refresh, and the log would fill with
        readings nobody performed.
      operationId: showGuestDocumentNumber
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      responses:
        '200':
          description: The number, once, recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [guest_request_id, guest_doc_type, guest_doc_number]
                    properties:
                      guest_request_id: { type: integer, format: int64 }
                      guest_doc_type:
                        $ref: '#/components/schemas/GuestDocumentType'
                      guest_doc_number: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkpoint/verify:
    post:
      tags: [Checkpoint]
      summary: Find a guest at the security post
      description: |
        FR-18. **This route changes nothing.** §3.5.1 splits verification from
        the entry deliberately: `verify` reads and renders the card for
        comparison with the document in the officer's hand, `check-in` changes
        state. The split lets the officer refuse entry without leaving a false
        record of an entry that never happened.

        **A POST all the same.** A surname and a visit code are personal data
        of somebody standing at the desk; a GET would put them in the query
        string, and a query string is written to every access log between the
        terminal and the application, cached by the browser, and left in the
        address bar of a screen that faces the lobby. `meta.read_only` says in
        the body what this paragraph says here.

        Search is by **code or surname**, never by document number: the column
        is encrypted and cannot be indexed, the QR carries the code, and FR-18
        asks for no more. A surname search is scoped to the current day — the
        post is looking for somebody in front of it, not through the archive.

        The card carries FR-18's five fields — guest, inviting resident, room,
        departure deadline, status — and the verdict on admission beside them,
        so the screen cannot offer a button the server would refuse.
      operationId: verifyGuestAtCheckpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointSearchInput'
      responses:
        '200':
          description: One card per match.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckpointCard'
                  meta:
                    type: object
                    properties:
                      matches: { type: integer }
                      read_only:
                        type: boolean
                        description: Always true. The route records a lookup and changes nothing else.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Nothing in this dormitory answers to that code or surname. A
            distinct answer from an empty list, because a terminal must not
            show «no such code» and «none today» the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /checkpoint/guest-consent:
    post:
      tags: [Checkpoint]
      summary: Record the guest's consent, at the desk
      description: |
        FR-35, first criterion, guest half, and §2.7.1's whole argument.

        The request was filed by the resident while the personal data belong to
        the guest, so consent under art. 9 part 1 of Federal Law No. 152-FZ
        cannot be given «on the guest's behalf» at submission. It is taken from
        the guest, in person, at the post, **before** the entry is recorded —
        and `POST /checkpoint/check-in` answers 409 until it is.

        A route of its own, because art. 9 part 1 has consent «executed
        separately from other documents»: there is no consent field on the
        check-in body, exactly as there is none on the sign-in form.

        The record names the guest request as its subject and carries no
        account — a guest has none. `revision` is the text the guest was shown
        and is checked against the repository.
      operationId: recordGuestConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestConsentInput'
      responses:
        '201':
          description: The consent is recorded, and the entry may now be written.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /checkpoint/check-in:
    post:
      tags: [Checkpoint]
      summary: Record a guest's entry
      description: |
        FR-19. The entry is written, the request moves to `in_progress`, and
        the departure deadline is **frozen** on the visit — the earlier of the
        end of the approved interval and the building's control time. Freezing
        it is what keeps the register's verdict on last week from changing when
        somebody edits a column today.

        **The system restricts nobody's movement.** FR-20 says so and §2.4.2
        explains why: the ground for refusing a person entry to a dormitory is
        the university's local act and the action of the security service, not
        a program. What this route refuses is a *record* — it will not assert
        that an entry was within the rules when the interval says it was not.

        `override_reason` is §2.4.2's «admit on the responsible officer's
        decision». It is required when the refusal is one that may be set aside
        — an entry outside the permitted interval, or on the wrong day — and is
        ignored otherwise. An override is recorded twice: on the visit, and as
        `checkpoint.admitted_on_decision` in the audit log, so that «show me
        every entry admitted against the interval» is one query.

        A refusal writes `checkpoint.entry_refused` to the log. §3.9.6 names it
        among the events the log must hold: a guest turned away leaves no visit
        row, so without it the evening would hold no record of them at all.
      operationId: checkInGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInInput'
      responses:
        '201':
          description: The entry is recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestVisit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            No consent from the guest is on record. Take it at
            `POST /checkpoint/guest-consent` and call again; the body names the
            document and the revision to put on the screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRequiredError'
        '422':
          description: >-
            The rules admit no entry as things stand. `reason_code` says which
            refusal it is and `override_available` whether the officer's
            decision may set it aside.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryNotPermittedError'

  /checkpoint/check-out:
    post:
      tags: [Checkpoint]
      summary: Record a guest's exit
      description: |
        FR-19, and FR-21's immutability behind it.

        The time is the server's and is never taken from the body: an exit time
        a client could name is an exit time a client could choose, and the
        register stands as evidence of what happened rather than of what was
        typed.

        The visit closes as `closed` or `closed_late`, judged against the
        deadline frozen at the entry. The exit is written **once**: the service
        refuses a second one with 409, the database refuses it with a
        write-once trigger, and a mistake is put right by a correcting entry
        (`POST /guest-visits/{guestVisit}/correction`) and never by an
        overwrite.
      operationId: checkOutGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutInput'
      responses:
        '200':
          description: The exit is recorded and the request is completed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestVisit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The exit on this visit is already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitAlreadyClosedError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/visit-register:
    get:
      tags: [Visitor register]
      summary: The visitor register over a period
      description: |
        FR-21 and §3.9.6. The journal clause 2.1.2 of the HSE rules of internal
        order makes the security service keep by hand — guest, time of arrival,
        time of departure, premises, whom they are visiting, details of the
        document — plus the operator who recorded each entry, which a paper
        page carried by existing and an electronic one has to say in words.

        Constraint C-04 makes this export the substitute for the access-control
        integration this iteration does not build. **The format is a
        presentational template and carries no claim to satisfy any particular
        reporting obligation** (§3.9.6).

        Available to the administrator and to the warden of the building
        concerned, and to nobody else. The export is itself an audited action.

        **The document number is exported masked**, which is a departure from
        the paper journal and is deliberate: an export is a file that leaves
        the system and is copied. The type and the last four characters
        identify the entry against the original document, and the number in
        full is available one request at a time on an audited route.

        Corrections travel with the rows they correct: an export that showed
        the entries and hid the corrections would present a record the register
        itself does not stand behind.

        The period is taken against the **entry**: a guest admitted at 23:50 on
        the 30th and recorded leaving at 00:20 belongs to the 30th, which is
        the day the officer would have written them down on.
      operationId: exportVisitRegister
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - name: from
          in: query
          required: false
          description: First day of the period, inclusive. Defaults to the first of the current month.
          schema: { type: string, format: date }
        - name: until
          in: query
          required: false
          description: Last day of the period, inclusive. Defaults to today.
          schema: { type: string, format: date }
        - name: format
          in: query
          required: false
          description: >-
            `json` for the register as data, `csv` for the file. §3.9.6 also
            asks for PDF; this iteration produces the two above.
          schema: { type: string, enum: [json, csv], default: json }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the register.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitRegisterEntry'
                  meta:
                    type: object
                    properties:
                      building_id: { type: integer, format: int64 }
                      from: { type: string, format: date }
                      until: { type: string, format: date }
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      columns:
                        type: object
                        additionalProperties: { type: string }
                        description: The seven columns, in the order clause 2.1.2 lists them.
            text/csv:
              schema:
                type: string
                description: >-
                  The same rows with a header line. Written through `fputcsv`,
                  so a guest's name containing a comma does not break the file.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guest-visits/{guestVisit}/correction:
    post:
      tags: [Visitor register]
      summary: Record a correcting entry against a visit
      description: |
        FR-21, second criterion: «entries are immutable; a correction is made
        as a correcting entry».

        This route writes **nothing** to the visit. It writes a row to the
        audit log naming it, and the register export carries the two side by
        side — which is what a numbered paper journal gives and an editable row
        does not.

        The correction is free text and has to say something. There is no
        structured «change this field to that value», and that is the point: a
        correction that could be applied would be an edit with extra steps.

        Recording the exit and correcting the record are different rights. The
        post records the exit; the correction asks for the register capability,
        so an officer who mistyped a time reports it and the correcting entry
        carries the name of whoever wrote it.
      operationId: correctGuestVisit
      parameters:
        - $ref: '#/components/parameters/GuestVisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correction]
              properties:
                correction:
                  type: string
                  minLength: 3
                  maxLength: 2000
      responses:
        '201':
          description: The correcting entry is recorded; the visit is unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      guest_visit_id: { type: integer, format: int64 }
                      correction: { type: string }
                      note: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'


  /maintenance-requests:
    get:
      tags: [Maintenance]
      summary: The caller's own maintenance requests
      description: |
        FR-36. **The route takes no parameter by which one person could name
        another**, and that absence is the protection: the list is filtered by
        the identifier of the token. The warden's queue is a different route, a
        sub-resource of the building, decided on the building object.

        This is where the module parts company with the guest one, which puts
        both lists behind a single route. There, the two lists are the same rows
        read with a different scope. Here they are not: the queue carries
        filters, an age, an overdue flag and an export, none of which means
        anything on «my own three requests».
      operationId: listMyMaintenanceRequests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MaintenanceRequestStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MaintenanceCategory'
      responses:
        '200':
          description: The caller's own requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Maintenance]
      summary: File a maintenance request
      description: |
        FR-36, `multipart/form-data` because of the photographs.

        **The room is never in the body.** For `location: own_room` the request
        is bound to the room of the submitter's *active residency record*, read
        from the housing register — a client that could name the room could name
        somebody else's. A common area has no row in the register, so it is
        named in words through `location_note`, and `room_id` comes back null.

        **A resident without an active residency record cannot file**, and the
        answer is 403 rather than 422: nothing about the body is wrong. The
        check is a policy question put to the register, and the same 403 answers
        a resident of block A filing against block B.

        Up to three photographs. The ceiling is configuration, is stated by this
        route's validation as a 422 naming `photos`, and is stated again as a
        CHECK constraint in the database.

        On success the request is created in `submitted`, the first row of its
        work log is written in the same transaction with a null `from_status` —
        the request did not move, it came into being — and the staff who triage
        in that dormitory are notified after the commit.
      operationId: fileMaintenanceRequest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestInput'
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Filed, with the room resolved from the register and the history opened.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The account holds no active residency record in that dormitory, so
            it is not a resident of it today (FR-36, second criterion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}:
    get:
      tags: [Maintenance]
      summary: One maintenance request with its history
      description: |
        The resident who filed it always reads it; the staff of that dormitory
        read it if their capability covers the queue. Another resident of the
        same dormitory does not — a defect in somebody's room is not theirs.

        The card carries `work_log`, which is where the reason for a refusal and
        the comment on each move actually live (§3.4.1, decision 6). There is no
        `rejection_reason` on the request itself to disagree with the history.
      operationId: showMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      responses:
        '200':
          description: The request, with the history and the photographs' paths.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /maintenance-requests/{maintenanceRequest}/accept:
    post:
      tags: [Maintenance]
      summary: Accept a request into work, with a planned completion date
      description: |
        FR-37. **The warden or the manager of this dormitory**, and nobody else:
        not the duty officer, who decides on guest requests and has nothing to
        do with these; not the administrator, who reads every queue and promises
        no dates; and never the resident who filed it.

        «Acceptance without a planned completion date is impossible» — so
        `target_date` is required by this route, is a required argument of the
        service behind it, and is a CHECK constraint on the table. A date
        already in the past is refused: the resident is told that date the
        moment this succeeds.

        `assigned_to` and `urgency` are optional. FR-37 names a responsible
        party and a reassignment of priority beside the date; a dormitory whose
        warden does the work himself has nobody else to name, and a required
        field would be filled in with his own name on every row.

        The resident is notified, and the message carries the planned date.
      operationId: acceptMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceAcceptanceInput'
      responses:
        '200':
          description: Accepted, with the planned date on the request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The request is no longer `submitted` — usually because a second
            member of staff moved it first. The body names the state it is in
            and the state that was asked for (FR-38).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/reject:
    post:
      tags: [Maintenance]
      summary: Refuse a request, with a stated reason
      description: |
        FR-37, first criterion: «rejection without a reason is impossible». The
        reason is required by this route and is a required argument of the
        service behind it, so there is no path by which a refusal is recorded
        without one.

        The reason is stored as the comment of the work-log row this transition
        writes, and not as a column on the request (§3.4.1, decision 6).

        Only a `submitted` request can be refused. A request already taken into
        work and then found to be somebody else's business is not withdrawn
        afterwards — FR-38's graph has no such edge.
      operationId: rejectMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRejectionInput'
      responses:
        '200':
          description: Refused, with the reason in the history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is no longer `submitted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/start:
    post:
      tags: [Maintenance]
      summary: Report that the work has begun
      description: |
        FR-38, `accepted → in progress`. The staff who triage in this dormitory.

        FR-38's chain is kept strict: there is no `accepted → completed` edge,
        so work cannot be reported complete on a request nobody started. The
        convenience is real — a dripping tap is mended before anybody would
        press a second button — and it is refused because the graph is the
        requirement's, and because the history would otherwise have no answer to
        «when was it begun».
      operationId: startMaintenanceWork
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: In progress.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/completion:
    post:
      tags: [Maintenance]
      summary: Report the work done — which does not close the request
      description: |
        FR-38, `in progress → completed`, and the line the whole module turns
        on (§3.5.2): **the request is closed by the person who reported it, not
        by the person who fixed it**. A status set by whoever did the work
        proves nothing; confirmation by the resident produces a two-sided
        record.

        So `completed` is a waiting state and not an ending. The only ways out
        of it are the reporter's word — `/confirmation` or `/reopening` — and
        the clock, which closes the request after the configurable window of
        FR-39 and marks it as automatically closed.

        `completed_at` is rewritten on each completion, which is what restarts
        the confirmation window after a reopening.
      operationId: completeMaintenanceWork
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: Completed, and waiting for the reporter.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not `in_progress`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/confirmation:
    post:
      tags: [Maintenance]
      summary: The reporter confirms the work and the request closes
      description: |
        FR-39. **The reporter, and nobody else** — not the warden who accepted
        it, not the manager who marked it complete, not the administrator. This
        is not a capability some role holds over a class of objects; it is the
        fact that one particular person filed one particular request, so the
        policy is an identity comparison.

        A warden who believes a resident unreasonable does not close the request
        over their head: the confirmation window runs out and the request closes
        marked `auto_closed`, which is a different and honest record.

        On success `confirmed_at` is set and `auto_closed` stays false. A CHECK
        constraint refuses a row that claims both.
      operationId: confirmMaintenanceWork
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: Closed, on the reporter's word.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The account is not the person who filed this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not `completed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/reopening:
    post:
      tags: [Maintenance]
      summary: The reporter says the defect is not fixed
      description: |
        FR-39, first criterion: «reopening within the configurable window
        returns the request to accepted and increments a reopen counter».

        Back to `accepted` and not to `submitted`, which is the requirement's
        word and the right one: the dormitory has already agreed the defect is
        theirs and has already named a date. The planned date stays on the row —
        it is now visibly missed, which is what FR-40's overdue flag is for.

        The reason is optional. FR-37 makes a refusal without one impossible and
        FR-39 makes no such demand; the resident who has already waited through
        one repair is the wrong person to put a form in front of. The history
        gets a sentence either way.

        **Two different 409s.** The request is not `completed` at all — the
        state machine refuses it. Or it is completed and the window has run out
        before the nightly pass reached the row: what has expired is the clock
        rather than the state, which no transition table can express, so the
        body carries `confirmation_window_days` and `window_closed_on` instead
        of two statuses.
      operationId: reopenMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: Back to `accepted`, with the reopen counter one higher.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The account is not the person who filed this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Either the request is not `completed`, or the confirmation window
            has closed. The two are told apart by the fields the body carries.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IllegalTransitionError'
                  - $ref: '#/components/schemas/ConfirmationWindowClosedError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/maintenance-queue:
    get:
      tags: [Maintenance]
      summary: The maintenance queue of one dormitory, filtered and exported
      description: |
        FR-40. The warden or the manager of this dormitory, and the
        administrator, who reads every queue — FR-40 names the campus
        directorate among the people the queue is for.

        **A sub-resource of the building, and that is the whole of the
        horizontal boundary.** The dormitory is a path parameter, the policy
        decides on the object, and every query begins from it: there is no code
        path in which a request of another dormitory is in the result set to be
        filtered out afterwards. A warden of block 1 asking for block 2 is 403,
        recorded as `access.denied`.

        With no filter the answer is the **open** requests, because FR-40's
        fourth criterion says the warden sees «all open requests» and a screen
        opening on three years of closed ones would be a different screen.
        Naming a status — `closed` included — says otherwise.

        The order is the one a queue is worked in: most pressing urgency first,
        oldest first inside one urgency. Sorting by age alone would bury an
        emergency reported this morning under a wobbly chair from March.

        **`age_days` is counted from submission and from nothing else**, as the
        Gherkin of §2.4.3 words it. Restarting the clock on acceptance would
        measure the warden rather than the wait.

        **`overdue` is configuration and not code** (FR-40, second criterion).
        A request is overdue when its planned completion date has passed — a
        promise broken to a named resident — or when it is older than
        `meta.overdue_after_days`, which catches the request nobody has triaged
        at all and has no date to be late against. Changing the setting changes
        the flag and the nightly digest together, with no code edit.

        The export is this route with `format=csv` rather than a route of its
        own: two routes would be two queries with the same chance of disagreeing
        about what «open» means. Either format is an audited action — an export
        discloses who reported what and when.
      operationId: showMaintenanceQueue
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - name: status
          in: query
          required: false
          description: Omit for the open requests; name one to see that state alone.
          schema:
            $ref: '#/components/schemas/MaintenanceRequestStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MaintenanceCategory'
        - name: min_age_days
          in: query
          required: false
          description: >-
            «At least this old», in days since submission — the question a
            warden asks, «what has been sitting here more than a week».
          schema: { type: integer, minimum: 0, maximum: 3650 }
        - name: overdue
          in: query
          required: false
          description: Only the requests past their planned date or past the configured threshold.
          schema: { type: boolean }
        - name: from
          in: query
          required: false
          description: Start of the period, measured on the submission. Omit for the whole queue.
          schema: { type: string, format: date }
        - name: until
          in: query
          required: false
          schema: { type: string, format: date }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: |
            One page of the queue. As CSV when `format=csv`, with the header
            line naming the columns `meta.columns` lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceQueuePage'
            text/csv:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The plain-text token returned by `POST /auth/login`, issued by Laravel Sanctum.

  parameters:
    BuildingId:
      name: building
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RoomId:
      name: room
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResidencyId:
      name: residency
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResidentId:
      name: resident
      in: path
      required: true
      description: The account the card belongs to.
      schema: { type: integer, format: int64, minimum: 1 }
    StaffUserId:
      name: user
      in: path
      required: true
      description: The account whose role is being revoked.
      schema: { type: integer, format: int64, minimum: 1 }
    NotificationId:
      name: notification
      in: path
      required: true
      description: >-
        The identifier of one message. A UUID, and not a sequence: the
        identifier travels to the client, and a guessable one would let a
        stranger probe for the existence of other people's messages.
      schema: { type: string, format: uuid }
    ConsentDocumentCode:
      name: document
      in: path
      required: true
      description: The document whose consent is being withdrawn.
      schema:
        $ref: '#/components/schemas/ConsentDocument'
    AnnouncementId:
      name: announcement
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GuestRequestId:
      name: guestRequest
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MaintenanceRequestId:
      name: maintenanceRequest
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GuestVisitId:
      name: guestVisit
      in: path
      required: true
      description: The recorded visit a correcting entry is written against.
      schema: { type: integer, format: int64, minimum: 1 }
    StaffRole:
      name: role
      in: path
      required: true
      description: >-
        The role being revoked. Only the roles the caller may grant are
        accepted; anything else is 403, and a string naming no role at all is
        422.
      schema:
        $ref: '#/components/schemas/RoleCode'

  responses:
    Unauthenticated:
      description: No token, or a token that has been revoked or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The account is authenticated but holds no role that covers this object.
        The two cases behind it are a role that is wrong for the route and a role
        that is right but held in a different building.

        Every refusal is written to the audit log as `access.denied`, with the
        account, the object and the address it came from (FR-33, §3.9.6).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The payload did not pass validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:

    RoleCode:
      type: string
      description: |
        The six roles of §1.1.4 as revision 2 of the role model leaves them.

        `admin` holds the register of dormitories and is the one role granted
        over the system as a whole. `warden` heads one dormitory: he appoints
        his own staff and does everything `manager` does. `manager` is the
        register work of that dormitory — rooms, places, moving in and out,
        resident cards and accounts — and no appointments at all.
        `duty_officer` approves guest requests, `security` checks the guest at
        the entrance, `student` lives there.

        The colloquial Russian word for a porter-caretaker is used nowhere: the
        entrance function belongs to the security service.
      enum: [admin, duty_officer, warden, manager, security, student]

    UserStatus:
      type: string
      enum: [active, blocked, archived]

    AuditAction:
      type: string
      enum:
        - auth.login_succeeded
        - auth.login_failed
        - auth.login_locked
        - auth.login_blocked
        - auth.logout_succeeded
        - access.denied
        - building.viewed
        - building.users_viewed
        - audit_log.viewed
        - building.created
        - building.updated
        - building.archived
        - building.deleted
        - building.deletion_blocked
        - building.rooms_viewed
        - room.created
        - room.updated
        - room.update_refused
        - bed.created
        - bed.creation_refused
        - residency.assigned
        - residency.assignment_refused
        - residency.terminated
        - resident.card_viewed
        - staff.appointed
        - staff.revoked
        - resident.account_issued
        - resident.credential_issued
        - auth.password_set
        - consent.granted
        - consent.withdrawn
        - guest_request.submitted
        - guest_request.approved
        - guest_request.rejected
        - guest_request.cancelled
        - guest_request.expired
        - guest_request.decision_refused
        - guest_request.document_viewed
        - checkpoint.guest_verified
        - checkpoint.entry_recorded
        - checkpoint.entry_refused
        - checkpoint.admitted_on_decision
        - checkpoint.exit_recorded
        - guest_visit.overdue
        - guest_visit.corrected
        - visit_register.viewed
        - visit_register.exported
        - maintenance_request.accepted
        - maintenance_request.rejected
        - maintenance_request.reopened
        - maintenance_request.auto_closed
        - maintenance_request.overdue
        - maintenance_request.reopening_refused
        - maintenance_queue.exported

    AuditResult:
      type: string
      enum: [success, failure, denied]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 255
          description: |
            The secret the configured identity provider verifies. With the default
            provider that is the account password; behind a university SSO it is
            whatever that provider accepts, and the field keeps its name.

    IssuedToken:
      type: object
      required: [token, token_type, identity_provider, user]
      properties:
        token:
          type: string
          description: >-
            Send it in the Authorization header as a Bearer token. It is not
            retrievable afterwards.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Null when the token expires only on sign-out.
        identity_provider:
          type: string
          description: Which provider verified the credential.
          examples: [database]
        user:
          $ref: '#/components/schemas/User'

    RoleGrant:
      type: object
      description: |
        One role held in one scope. `building_id` null means the role is held over
        the system as a whole, which in this iteration is the administrator alone.
      required: [role, building_id]
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        role_name:
          type: string
        building_id:
          type: [integer, 'null']
          format: int64
        granted_at:
          type: [string, 'null']
          format: date-time

    User:
      type: object
      required: [id, full_name, email, status, password_change_required]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/UserStatus'
        password_change_required:
          type: boolean
          description: >-
            True while the account is waiting for its first password — an
            account issued under FR-42 whose one-time code has not been spent
            yet. It says that much and carries no secret; setting a password at
            `POST /auth/password` clears it.
        consent_required:
          type: array
          description: >-
            FR-35. The documents this person has not yet consented to, or has
            consented to under a wording that has since been superseded. Present
            on the sign-in answer and on `GET /auth/me`, and absent everywhere
            else this schema is used — the listings of people would otherwise
            pay a query per person for a field nobody reads there. An empty
            array means nothing is outstanding; the texts themselves are at
            `GET /consents/pending`.
          items:
            $ref: '#/components/schemas/ConsentDocument'
        roles:
          type: array
          description: Present when the grants were loaded for this response.
          items:
            $ref: '#/components/schemas/RoleGrant'

    Building:
      type: object
      required: [id, name, address, is_active]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        floors_count: { type: integer, minimum: 1 }
        visiting_from:
          type: string
          description: Start of the visiting window, per building (NFR-09).
          examples: ['08:00:00']
        visiting_to:
          type: string
          examples: ['23:00:00']
        curfew_at:
          type: string
          examples: ['23:00:00']
        is_active: { type: boolean }

    RoomType:
      type: string
      description: |
        The three layouts FR-01 names. The layout belongs to the room and not to
        the dormitory as a whole, because one building routinely mixes them.
      enum: [corridor, block, apartment]

    RoomStatus:
      type: string
      description: |
        A room that is not `in_service` holds no new residency, however many of
        its places are free.
      enum: [in_service, under_repair, withdrawn]

    BedStatus:
      type: string
      description: |
        `free` and `occupied` are a projection of the residency register, which is
        the authority. `blocked` is the one value the register knows nothing
        about: an administrative decision that the place takes nobody, and the
        reason the field is stored rather than computed.

        A place whose occupant leaves at midnight reads `occupied` until the
        nightly settlement runs. It never reads `free` while somebody holds it,
        and a residency written against a place that is in fact held is refused
        by the exclusion constraint whatever this field says.
      enum: [free, occupied, blocked]

    ResidencyStatus:
      type: string
      description: |
        A projection of the period, and of nothing else. A residency is `active`
        while the person is resident and `ended` once the stated departure date
        has arrived — never before it, however long ago the notice was written.
      enum: [active, ended]

    StudyStatus:
      type: string
      enum: [enrolled, academic_leave, graduated, expelled]

    BuildingInput:
      type: object
      description: |
        Fields of a dormitory. All of them are required on creation; on an edit
        send only what changes.
      properties:
        name:
          type: string
          maxLength: 255
          description: >-
            Unique across the register. A collision comes back as a 422 on this
            field, from the form rule or, in a race between two requests, from
            the unique index behind it.
        address: { type: string, maxLength: 255 }
        floors_count: { type: integer, minimum: 1, maximum: 100 }
        visiting_from:
          type: string
          description: Start of the visiting window (NFR-09), as HH:MM:SS.
          examples: ['08:00:00']
        visiting_to:
          type: string
          examples: ['23:00:00']
        curfew_at:
          type: string
          examples: ['23:00:00']
        is_active: { type: boolean }

    RoomInput:
      type: object
      description: |
        Fields of a room. `number`, `floor` and `capacity` are required on
        creation; on an edit send only what changes.
      properties:
        number:
          type: string
          maxLength: 32
          description: Unique inside its building, free across buildings.
          examples: ['305']
        floor: { type: integer, minimum: 0, maximum: 100 }
        capacity:
          type: integer
          minimum: 1
          maximum: 32
          description: How many places the room may hold. The ceiling FR-02 checks against.
        type:
          $ref: '#/components/schemas/RoomType'
        status:
          $ref: '#/components/schemas/RoomStatus'

    Bed:
      type: object
      description: |
        One place. It carries no name: who holds it is a residency, and that is
        personal data travelling under its own policy.
      required: [id, room_id, label, status]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 16 }
        status:
          $ref: '#/components/schemas/BedStatus'
        status_label: { type: string }

    Room:
      type: object
      required: [id, building_id, number, floor, capacity, beds_count, free_places, vacant_beds]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        number: { type: string }
        floor: { type: integer }
        capacity:
          type: integer
          description: How many places the room may hold.
        type:
          $ref: '#/components/schemas/RoomType'
        type_label: { type: string }
        status:
          $ref: '#/components/schemas/RoomStatus'
        status_label: { type: string }
        beds_count:
          type: integer
          description: Places registered. Never greater than `capacity`.
        occupied_beds_count:
          type: integer
          description: Places currently held.
        free_places:
          type: integer
          minimum: 0
          description: >-
            How many further places may still be **registered**: `capacity` minus
            the places registered. This is the figure the capacity rejection
            names, sent so that a client never computes its own. It is not the
            number of places somebody could move into — see `vacant_beds`.
        vacant_beds:
          type: integer
          minimum: 0
          description: >-
            How many registered places are free for somebody to move into today.
            A blocked place counts for neither this nor `occupied_beds_count`.
            A room of four places with one occupant reports `free_places: 0` and
            `vacant_beds: 3`, and the two answer different questions.
        beds:
          type: array
          description: Present when the places were loaded for this response.
          items:
            $ref: '#/components/schemas/Bed'

    ResidencyInput:
      type: object
      required: [user_id, bed_id, contract_number, moved_in_at]
      properties:
        user_id: { type: integer, format: int64 }
        bed_id:
          type: integer
          format: int64
          description: >-
            The place. It also fixes the scope: the warden or manager of the
            building this bed stands in is the one allowed to write the row.
        contract_number: { type: string, maxLength: 64 }
        moved_in_at: { type: string, format: date }
        ground:
          type: [string, 'null']
          maxLength: 255
          description: The ground for the accommodation, recorded verbatim.

    Residency:
      type: object
      description: |
        One residency, past or present. `is_open` says no departure date has been
        written down; `is_current` says the person is resident today. A
        termination dated in the future makes the two differ — `is_open: false`
        with `is_current: true` — which is FR-05's third criterion. `is_current`
        is the one to filter a list of residents on; `status` follows it.
      required: [id, user_id, bed_id, contract_number, moved_in_at, status, is_open, is_current]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        resident_name:
          type: [string, 'null']
          description: Present when the account was loaded for this response.
        bed_id: { type: integer, format: int64 }
        bed_label: { type: [string, 'null'] }
        room_id: { type: [integer, 'null'], format: int64 }
        room_number: { type: [string, 'null'] }
        floor: { type: [integer, 'null'] }
        building_id: { type: [integer, 'null'], format: int64 }
        building_name: { type: [string, 'null'] }
        contract_number: { type: string }
        moved_in_at: { type: string, format: date }
        moved_in_ground: { type: [string, 'null'] }
        moved_out_at: { type: [string, 'null'], format: date }
        moved_out_ground: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/ResidencyStatus'
        is_open: { type: boolean }
        is_current: { type: boolean }

    Placement:
      type: object
      description: Where a residency puts a person — building, room, place.
      properties:
        building_id: { type: [integer, 'null'], format: int64 }
        building_name: { type: [string, 'null'] }
        room_id: { type: [integer, 'null'], format: int64 }
        room_number: { type: [string, 'null'] }
        floor: { type: [integer, 'null'] }
        bed_id: { type: [integer, 'null'], format: int64 }
        bed_label: { type: [string, 'null'] }
        moved_in_at: { type: [string, 'null'], format: date }

    ResidentCard:
      type: object
      description: |
        FR-06. `study_status` and `citizenship` are nullable by design: a staff
        account is not a student and has neither, and the card renders what is
        known rather than a default that looks like a fact.
      required: [id, full_name, contact, residency_history, open_obligations]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        study_status:
          oneOf:
            - $ref: '#/components/schemas/StudyStatus'
            - type: 'null'
        study_status_label: { type: [string, 'null'] }
        citizenship: { type: [string, 'null'] }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
            phone: { type: [string, 'null'] }
        account_status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        current_bed:
          description: The place held right now, or null.
          oneOf:
            - $ref: '#/components/schemas/Placement'
            - type: 'null'
        residency_history:
          type: array
          description: Every residency, newest first. Nothing is removed on move-out.
          items:
            $ref: '#/components/schemas/Residency'
        open_obligations:
          type: array
          description: |
            What the resident still owes the dormitory. The MVP register knows one
            kind: an accommodation contract that has not been terminated.
            Obligations arising from the inventory handover belong to entities
            outside this iteration and are not represented here.
          items:
            type: object
            required: [kind, residency_id, contract_number]
            properties:
              kind:
                type: string
                enum: [accommodation_contract]
              residency_id: { type: integer, format: int64 }
              contract_number: { type: string }
              since: { type: [string, 'null'], format: date }
              placement:
                $ref: '#/components/schemas/Placement'

    StaffAppointmentInput:
      type: object
      description: |
        FR-41. Who, and which role. The dormitory is not here: it comes from the
        path, so the payload cannot nominate the scope the caller's own
        authorisation is checked against.
      required: [user_id, role]
      properties:
        user_id:
          type: integer
          format: int64
          description: The account receiving the role. It need not exist in this dormitory yet.
        role:
          description: >-
            One of the roles the caller may grant. A warden may grant `manager`,
            `duty_officer` and `security`; the administrator may grant `warden`.
            Anything else is 403.
          allOf:
            - $ref: '#/components/schemas/RoleCode'

    ResidentAccountInput:
      type: object
      description: |
        FR-42. The fields of an incoming resident, and nothing else. There is no
        `role` — it is always the resident role in the dormitory named by the
        path — and no `password`: a password the caller could set is a password
        the caller knows.
      required: [full_name, email]
      properties:
        full_name: { type: string, maxLength: 255 }
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            The confirmed contact the one-time code is delivered to, which is
            why it is the one field that can be neither omitted nor duplicated.
        phone: { type: [string, 'null'], maxLength: 32 }
        study_status:
          oneOf:
            - $ref: '#/components/schemas/StudyStatus'
            - type: 'null'
        citizenship: { type: [string, 'null'], maxLength: 64 }

    SetPasswordInput:
      type: object
      description: |
        FR-42. The one-time code, and the password replacing it. The address is
        validated for shape and not for existence: a rule that checked it
        against the table would tell an unauthenticated caller which addresses
        hold an account.
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        token:
          type: string
          description: The one-time code delivered to the account's contact. Works once.
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string, minLength: 8 }

    CapacityExceeded:
      type: object
      description: |
        FR-02, second criterion. `free_places` is the remainder the register
        refused on; zero means the room is full.
      required: [message, capacity, beds, free_places]
      properties:
        message: { type: string }
        room_id: { type: integer, format: int64 }
        room_number: { type: string }
        capacity: { type: integer }
        beds: { type: integer }
        free_places: { type: integer, minimum: 0 }

    ResidencyConflict:
      type: object
      description: |
        FR-03, second criterion: the record standing in the way, so that the
        warden or manager reads which residency must end before this one can begin.
      required: [message]
      properties:
        message: { type: string }
        bed_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        conflict:
          oneOf:
            - $ref: '#/components/schemas/Residency'
            - type: 'null'

    DeletionBlocked:
      type: object
      description: |
        FR-01, second criterion: the deletion is blocked and the reason is stated.
      required: [message, entity, entity_id, blocked_by]
      properties:
        message: { type: string }
        entity: { type: string, examples: [building] }
        entity_id: { type: integer, format: int64 }
        blocked_by:
          type: object
          description: >-
            What is attached, by kind and count. Every known kind is present,
            including the ones that are nought, so that the numbers and the
            message cannot contradict each other.
          additionalProperties: { type: integer }
          examples:
            - { rooms: 12, role_grants: 0 }
            - { rooms: 0, role_grants: 3 }

    AuditEntry:
      type: object
      description: |
        The record format of §3.9.6: who, what, over which object, when, from which
        address, with what result.
      required: [id, action, user, subject, result, created_at]
      properties:
        id: { type: integer, format: int64 }
        action:
          $ref: '#/components/schemas/AuditAction'
        user:
          type: object
          properties:
            id: { type: [integer, 'null'], format: int64 }
            full_name: { type: [string, 'null'] }
        subject:
          type: object
          properties:
            type:
              type: [string, 'null']
              description: The short class name of the object acted on.
              examples: [Building]
            id: { type: [integer, 'null'], format: int64 }
        payload:
          type: [object, 'null']
          additionalProperties: true
        ip_address: { type: [string, 'null'] }
        result:
          $ref: '#/components/schemas/AuditResult'
        created_at: { type: string, format: date-time }

    InvalidCredentials:
      type: object
      required: [message, attempts_left]
      properties:
        message: { type: string }
        attempts_left:
          type: integer
          minimum: 0
          description: Attempts remaining before the block. Zero means the block has just started.

    ThrottleReason:
      type: string
      description: |
        Which limit refused the request. The field is the discriminator of the
        429: the block that follows failed attempts and the request limit of the
        route are different events and must not be reported as one.
      enum: [login_locked, address_locked, rate_limited]

    TooManyRequests:
      type: object
      required: [message, retry_after, reason]
      properties:
        message: { type: string }
        retry_after:
          type: integer
          minimum: 0
          description: Seconds until the request is accepted again. Mirrors the Retry-After header.
        reason:
          $ref: '#/components/schemas/ThrottleReason'

    NotificationCategory:
      type: string
      description: |
        FR-34's occasions, as the categories delivery is decided against.

        `account_issued` is the one-time credential of FR-42. `request_decision`
        is a decision on a guest request, `visit_overdue` a guest still recorded
        inside after the hour clause 2.2 of the rules of internal order sets,
        `maintenance_status` a movement of a maintenance request, and
        `document_signature` a document waiting to be signed.

        `announcement` and `mandatory_announcement` are FR-09 reaching the
        resident. They are two categories for one kind of object because the
        delivery rule genuinely differs by the announcement: a notice the
        resident is required to acknowledge (FR-12) rests on clause 4.2.7 of the
        rules of internal order and cannot be switched off, while a routine one
        rests on nothing but convenience and can.

        Four of them are mandatory and cannot be switched off — see
        `NotificationSetting.mandatory` for the ground the line is drawn on.
      enum:
        - account_issued
        - request_decision
        - visit_overdue
        - maintenance_status
        - document_signature
        - announcement
        - mandatory_announcement

    Notification:
      type: object
      required: [id, type, payload, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        category:
          oneOf:
            - $ref: '#/components/schemas/NotificationCategory'
            - type: 'null'
        type:
          type: string
          description: The short name of the message class, e.g. `GuestVisitOverdue`.
        payload:
          type: object
          additionalProperties: true
          description: >-
            The body of the message. Its shape depends on the category — each
            notification decides its own — so it is deliberately open here
            rather than enumerated: a category added in a later increment must
            not require this document to change for the existing ones to keep
            working.
        read_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    NotificationSetting:
      type: object
      required: [category, label, description, enabled, mandatory]
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        label: { type: string }
        description:
          type: string
          description: What the person reads beside the switch, so the choice is informed.
        enabled:
          type: boolean
          description: >-
            Whether messages of this category are to reach this person. True for
            a category nobody has decided about, which is the default.
        mandatory:
          type: boolean
          description: |
            Whether the switch may be moved at all.

            The line is drawn by the ground the message rests on. A mandatory
            category carries what the accommodation contract or the rules of
            internal order oblige the dormitory to tell the person — the
            credential without which the account cannot be used, a guest overdue
            at the post, a document with a deadline — and declining it would be
            a refusal of the service rather than a preference. The rest are
            conveniences whose only ground is consent, and they stop when the
            consent of FR-35 is withdrawn even while this flag says `enabled`.

    NotificationSettingsInput:
      type: object
      required: [categories]
      properties:
        categories:
          type: object
          minProperties: 1
          description: >-
            A map of category to whether it is to be received. May be partial:
            the screen sends what it changed, and the categories left out keep
            the state they had.
          additionalProperties:
            type: boolean
          propertyNames:
            $ref: '#/components/schemas/NotificationCategory'

    MandatoryCategory:
      type: object
      required: [message, category, category_label]
      description: >-
        The refusal of an attempt to switch off a category that carries what the
        dormitory is obliged to tell the person.
      properties:
        message: { type: string }
        category:
          $ref: '#/components/schemas/NotificationCategory'
        category_label: { type: string }

    ConsentDocument:
      type: string
      description: |
        The documents a person is asked to consent to, and they are two rather
        than one because the ground behind them differs (§2.7.1).

        `resident_personal_data` covers the processing that goes beyond the
        accommodation contract — the optional notifications, the guest-visiting
        service — and is asked for at first sign-in.

        `guest_personal_data` is the guest's own, taken at the security post
        before the entry is recorded. A guest is not a party to the
        accommodation contract, so consent is the **only** ground there is: with
        none on record the entry cannot be written at all.
      enum: [resident_personal_data, guest_personal_data]

    ConsentText:
      type: object
      required: [document, revision, title, body]
      properties:
        document:
          $ref: '#/components/schemas/ConsentDocument'
        revision:
          type: string
          maxLength: 32
          description: >-
            The identifier of the wording. It names a file under version
            control, which is what makes a record demonstrable afterwards: art.
            9 part 3 of Federal Law No. 152-FZ puts the burden of proving
            consent on the operator, and a revision whose text could not be
            produced would prove nothing.
        title: { type: string }
        body:
          type: string
          description: The wording itself, in Markdown. Shown to the person before they decide.

    ConsentRecord:
      type: object
      required: [id, document, title, revision, accepted_at, revoked_at, in_force]
      properties:
        id: { type: integer, format: int64 }
        user_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The account whose consent this is. Null for a guest's, which names
            the request instead: exactly one of the two is ever set, and the
            database refuses any other shape.
        guest_request_id:
          type: [integer, 'null']
          format: int64
          description: The guest request this consent was taken against, at the post.
        document:
          $ref: '#/components/schemas/ConsentDocument'
        title: { type: string }
        revision: { type: string, maxLength: 32 }
        accepted_at: { type: string, format: date-time }
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the consent was withdrawn, or superseded by a consent to a
            newer wording. The row is never deleted and never rewritten: the
            history is the evidence.
        in_force:
          type: boolean
          description: Whether this consent stands today.
        ip_address:
          type: [string, 'null']
          maxLength: 45

    ConsentInput:
      type: object
      required: [document, revision]
      properties:
        document:
          $ref: '#/components/schemas/ConsentDocument'
        revision:
          type: string
          maxLength: 32
          description: >-
            The revision the person was shown, as it came from
            `GET /consents/pending`. Sending it back is what makes the record
            name the text they actually read; a revision that is not the one in
            force is refused with 422.

    ConsentRequired:
      type: object
      required: [message, document, revision]
      description: >-
        The refusal of an operation that would process personal data with no
        consent on record. 409 rather than 403: the caller's role covers the
        object, and what stands in the way is a missing document. The first
        route to answer with it is the security post's `check-in`, in increment 1.
      properties:
        message: { type: string }
        document:
          $ref: '#/components/schemas/ConsentDocument'
        revision:
          type: string
          description: The revision in force, so the client knows which text to put on the screen.

    AnnouncementCategory:
      type: string
      description: |
        What an announcement is about (FR-09, FR-11), and the closed list the
        feed's filter is drawn from.

        The category is **not** the mandatory flag: the subject of a notice and
        the obligation to read it vary independently, which is why the ER model
        of §3.4.3 carries `category` and `is_mandatory` as two columns. A water
        shutoff is `utilities` and is normally mandatory; a film evening is
        `events` and never is.
      enum:
        - house_rules
        - utilities
        - safety
        - events
        - general

    Announcement:
      type: object
      required: [id, author_id, title, body, category, is_mandatory, published_at, is_unread]
      properties:
        id: { type: integer, format: int64 }
        building_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The dormitory addressed. Null means every dormitory (§3.4.2), which
            only the administrator may write.
        building_name: { type: string }
        addresses_every_building:
          type: boolean
          description: >-
            The meaning of a null `building_id`, carried explicitly so that each
            interface does not have to infer «all dormitories» from an absent
            field.
        author_id: { type: integer, format: int64 }
        author_name: { type: string }
        title: { type: string, maxLength: 255 }
        body: { type: string }
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        category_label: { type: string }
        is_mandatory:
          type: boolean
          description: >-
            FR-12 turns on this flag: the reader is asked to acknowledge, the
            notification cannot be switched off, and the readers report is
            meaningful.
        published_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            The validity period of FR-09. Null means the announcement does not
            expire; otherwise this is the moment it leaves the feed for the
            archive, by comparison and not by anybody moving it.
        acknowledged_at:
          type: [string, 'null']
          format: date-time
          description: When this reader acknowledged it, null if they have not.
        is_unread:
          type: boolean
          description: >-
            FR-11's mark, computed per reader by a left join against the
            acknowledgements.
        created_at: { type: string, format: date-time }

    AnnouncementInput:
      type: object
      required: [title, body, category]
      properties:
        building_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The dormitory addressed. Omit it, or send null, to address every
            dormitory — the administrator's right and nobody else's.
        title: { type: string, maxLength: 255 }
        body: { type: string, maxLength: 20000 }
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        is_mandatory:
          type: boolean
          default: false
          description: >-
            Whether the reader is required to acknowledge the notice (FR-12).
            A mandatory announcement is also delivered as a notification the
            resident cannot switch off.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the announcement leaves the feed. Must be in the future; omit
            for an announcement that does not expire.

    AnnouncementReader:
      type: object
      required: [user_id, full_name]
      properties:
        user_id: { type: integer, format: int64 }
        full_name: { type: string }
        acknowledged_at:
          type: string
          format: date-time
          description: Present on the acknowledged list only.

    AnnouncementReaders:
      type: object
      required: [announcement_id, audience_size, acknowledged_count, acknowledged_share, acknowledged, not_acknowledged]
      properties:
        announcement_id: { type: integer, format: int64 }
        title: { type: string }
        is_mandatory: { type: boolean }
        building_ids:
          type: array
          description: >-
            The dormitories the figures below are about. For an announcement
            addressed to every dormitory this is the caller's own scope and not
            the whole register; for the administrator it is empty, meaning all
            of them.
          items: { type: integer, format: int64 }
        audience_size:
          type: integer
          description: >-
            The residents of those dormitories by the register, less those it
            says have moved out (FR-05).
        acknowledged_count: { type: integer }
        acknowledged_share:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: >-
            The acknowledged fraction of the audience. An empty audience gives
            1, not 0: a share of zero over zero people would put a red figure in
            front of a warden with nobody to chase.
        acknowledged:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementReader'
        not_acknowledged:
          type: array
          description: FR-12's named list, which is why the acknowledgement is a row and not a counter.
          items:
            $ref: '#/components/schemas/AnnouncementReader'

    GuestRequestStatus:
      type: string
      description: |
        The states of §3.5.4. `pending_review` is the only one that appears in
        the duty officer's queue; `in_progress` and `overdue` mean a guest is
        recorded inside the building; the last four are final.

        `draft` is absent: no route writes one, because the form lives in the
        browser until it is sent.
      enum:
        - pending_review
        - approved
        - in_progress
        - overdue
        - rejected
        - cancelled
        - expired
        - completed

    GuestVisitStatus:
      type: string
      description: >-
        `closed_late` is a fact about the evening and not about anybody's
        decision: the guest left, after the control time.
      enum: [in_building, closed, overdue, closed_late]

    GuestDocumentType:
      type: string
      description: >-
        `foreign_passport` and `residence_permit` mark the guest as a foreign
        national and raise FR-23's warning. Both, because a residence permit is
        issued to a foreign national as well and the warning is about the
        procedure rather than about the booklet.
      enum:
        - internal_passport
        - foreign_passport
        - residence_permit
        - student_card
        - driving_licence

    GuestRequestInput:
      type: object
      required: [building_id, guest_full_name, guest_doc_type, guest_doc_number, visit_date, planned_from, planned_to]
      properties:
        building_id: { type: integer, format: int64, minimum: 1 }
        guest_full_name: { type: string, minLength: 2, maxLength: 255 }
        guest_doc_type:
          $ref: '#/components/schemas/GuestDocumentType'
        guest_doc_number:
          type: string
          minLength: 4
          maxLength: 64
          description: >-
            Stored encrypted and never returned. Deliberately shapeless: §2.7.1's
            minimisation means the type and the number and no scan of the page,
            and the formats of five kinds of document across as many countries
            are not something a dormitory's validator should claim to know.
        visit_date: { type: string, format: date }
        planned_from: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '14:00' }
        planned_to: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '18:00' }
        purpose: { type: string, maxLength: 255, nullable: true }

    GuestApprovalInput:
      type: object
      properties:
        comment: { type: string, maxLength: 1000, nullable: true }
        responsible_officer_mark:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            FR-23. Required when the guest carries a foreign document and the
            interval runs past midnight; ignored otherwise.

    GuestRejectionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: FR-17, second criterion. A refusal without one is impossible.

    GuestRequest:
      type: object
      required: [id, building_id, student_id, guest_full_name, status]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        building_name: { type: string }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        guest_full_name: { type: string }
        guest_doc_type:
          $ref: '#/components/schemas/GuestDocumentType'
        guest_doc_type_label: { type: string }
        guest_doc_number_masked:
          type: string
          description: >-
            The last four characters, everything before them hidden (NFR-06).
            The number itself is on an audited route of its own.
          example: '•••••••3456'
        is_foreign_document:
          type: boolean
          description: Derived from the document type, never accepted from the client.
        foreign_guest_warning:
          type: string
          nullable: true
          description: >-
            FR-23, first criterion. Attached by the server when the document is
            a foreign one, null otherwise. The text is configuration, because
            the procedure is the university's and §2.7.4 leaves open which of
            two deadlines under art. 20 of Federal Law No. 109-FZ applies.
        purpose: { type: string, nullable: true }
        visit_date: { type: string, format: date }
        planned_from: { type: string, example: '14:00' }
        planned_to: { type: string, example: '23:00' }
        spans_more_than_one_day:
          type: boolean
          description: >-
            True when the interval runs past midnight, which is only possible
            where the dormitory's own regime admits it. FR-23's second
            criterion turns on this.
        due_at:
          type: string
          format: date-time
          description: >-
            The departure deadline: the earlier of the end of the interval and
            the building's control time.
        status:
          $ref: '#/components/schemas/GuestRequestStatus'
        status_label: { type: string }
        access_code:
          type: string
          nullable: true
          description: >-
            Null until approval. Issued only on the duty officer's decision, so
            that before it there is nothing to present at the post (§3.5.1).
            Eight characters from an alphabet with the confusable ones removed,
            because it is read aloud and typed in at a desk.
          example: 'K7QMR4TZ'
        decided_by:
          type: integer
          format: int64
          nullable: true
          description: >-
            Null on a request the scheduler closed. FR-17's fourth criterion
            treats an undecided request as rejected, and nobody decided it — so
            the row does not claim an officer did.
        decided_at: { type: string, format: date-time, nullable: true }
        decision_comment: { type: string, nullable: true }
        responsible_officer_mark: { type: string, nullable: true }
        responsible_officer_mark_at: { type: string, format: date-time, nullable: true }
        visit:
          allOf:
            - $ref: '#/components/schemas/GuestVisit'
          nullable: true
        created_at: { type: string, format: date-time }

    GuestVisit:
      type: object
      required: [id, guest_request_id, checked_in_at, status]
      properties:
        id: { type: integer, format: int64 }
        guest_request_id: { type: integer, format: int64 }
        checked_in_at: { type: string, format: date-time }
        checked_in_by: { type: integer, format: int64 }
        checked_out_at: { type: string, format: date-time, nullable: true }
        checked_out_by: { type: integer, format: int64, nullable: true }
        due_at:
          type: string
          format: date-time
          description: >-
            Frozen at the entry. Carried beside `checked_out_at` so that
            `closed_late` is legible without recomputing the deadline from a
            setting that may since have changed.
        status:
          $ref: '#/components/schemas/GuestVisitStatus'
        status_label: { type: string }
        overdue_notified_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Written once, by the quarter-hourly sweep, and refused a second
            time by the database. It is what keeps a repeat run from sending a
            second notification.
        admitted_on_decision: { type: boolean }
        admission_note: { type: string, nullable: true }

    CheckpointSearchInput:
      type: object
      required: [building_id]
      properties:
        building_id: { type: integer, format: int64, minimum: 1 }
        code:
          type: string
          maxLength: 32
          nullable: true
          description: >-
            The visit code, as printed or as carried by the QR. Case and
            punctuation are normalised: a code read back over a telephone is
            the same code.
        surname:
          type: string
          minLength: 2
          maxLength: 255
          nullable: true
          description: >-
            The fallback when the guest has lost the code. Scoped to the
            current day.

    CheckpointCard:
      type: object
      description: >-
        FR-18's five fields — guest, inviting resident, room, departure
        deadline, status — with the verdict on admission beside them.
      properties:
        guest_request_id: { type: integer, format: int64 }
        access_code: { type: string, nullable: true }
        guest:
          type: object
          properties:
            full_name: { type: string }
            document_type:
              $ref: '#/components/schemas/GuestDocumentType'
            document_type_label: { type: string }
            document_number_masked: { type: string }
            is_foreign_document: { type: boolean }
        inviting_resident:
          type: object
          properties:
            id: { type: integer, format: int64, nullable: true }
            full_name: { type: string, nullable: true }
        room:
          type: string
          nullable: true
          description: >-
            Null when the housing register holds no bed for the host — an
            account issued before a place was assigned. Shown as absent rather
            than guessed at.
        due_at: { type: string, format: date-time }
        permitted_interval: { type: string, example: '14:00–23:00' }
        status:
          $ref: '#/components/schemas/GuestRequestStatus'
        status_label: { type: string }
        visit:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            checked_in_at: { type: string, format: date-time }
            checked_out_at: { type: string, format: date-time, nullable: true }
            status:
              $ref: '#/components/schemas/GuestVisitStatus'
        consent_on_record:
          type: boolean
          description: >-
            Whether the guest has consented at this post. False means the entry
            cannot yet be written (§2.7.1).
        admission:
          type: object
          properties:
            allowed: { type: boolean }
            reason_code:
              type: string
              nullable: true
              enum: [outside_permitted_interval, request_not_approved, guest_already_inside, wrong_visit_date]
            reason: { type: string, nullable: true }
            override_available:
              type: boolean
              description: >-
                Whether the officer on duty may set the refusal aside. True for
                an entry outside the interval or on the wrong day; false for a
                request that was never approved.
            override_requires_reason: { type: boolean }
        checked_at: { type: string, format: date-time }

    GuestConsentInput:
      type: object
      required: [guest_request_id, revision]
      properties:
        guest_request_id: { type: integer, format: int64, minimum: 1 }
        revision:
          type: string
          maxLength: 32
          description: The revision of the text the guest was actually shown.

    CheckInInput:
      type: object
      required: [guest_request_id]
      properties:
        guest_request_id: { type: integer, format: int64, minimum: 1 }
        override_reason:
          type: string
          minLength: 3
          maxLength: 1000
          nullable: true
          description: >-
            §2.4.2's «admit on the responsible officer's decision». Required
            when the refusal is one that may be set aside.

    CheckOutInput:
      type: object
      required: [guest_visit_id]
      properties:
        guest_visit_id: { type: integer, format: int64, minimum: 1 }

    VisitRegisterEntry:
      type: object
      description: One row of the journal of clause 2.1.2, plus the operator.
      properties:
        guest_visit_id: { type: integer, format: int64 }
        guest_full_name: { type: string }
        guest_document:
          type: string
          description: The type and the masked number, as one column.
          example: 'Internal passport •••••••3456'
        guest_doc_type:
          $ref: '#/components/schemas/GuestDocumentType'
        is_foreign_document: { type: boolean }
        inviting_resident: { type: string }
        inviting_resident_id: { type: integer, format: int64, nullable: true }
        room:
          type: string
          description: >-
            The room the host held **on the day of the visit**, not today: a
            resident who has since moved did not receive their guest in the
            room they live in now.
        checked_in_at: { type: string, format: date-time }
        checked_out_at: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/GuestVisitStatus'
        operator:
          type: string
          description: >-
            The officer who recorded the entry, and the one who recorded the
            exit when it was a different shift.
        recorded_by: { type: string, nullable: true }
        closed_by: { type: string, nullable: true }
        admitted_on_decision: { type: boolean }
        admission_note: { type: string, nullable: true }
        corrections:
          type: array
          description: >-
            FR-21's correcting entries, shown beside the row they correct. The
            row itself is never rewritten.
          items:
            type: object
            properties:
              recorded_at: { type: string, format: date-time }
              by: { type: integer, format: int64, nullable: true }
              correction: { type: string }

    IllegalTransitionError:
      type: object
      description: §3.5.4. The move asked for is not one the state machine has.
      required: [message]
      properties:
        message: { type: string }
        status:
          $ref: '#/components/schemas/GuestRequestStatus'
        attempted_status:
          $ref: '#/components/schemas/GuestRequestStatus'

    QuotaError:
      type: object
      description: §3.3.4. The daily ceiling for the resident or for the dormitory.
      required: [message]
      properties:
        message: { type: string }
        quota_scope: { type: string, enum: [resident, building] }
        quota_limit: { type: integer }
        approved_today: { type: integer }
        visit_date: { type: string, format: date }

    OfficerMarkRequiredError:
      type: object
      description: FR-23, second criterion.
      required: [message]
      properties:
        message: { type: string }
        guest_request_id: { type: integer, format: int64 }
        guest_doc_type:
          $ref: '#/components/schemas/GuestDocumentType'
        required_field: { type: string, enum: [responsible_officer_mark] }

    EntryNotPermittedError:
      type: object
      description: >-
        FR-18 and FR-19. The record is refused, not the person: the system does
        not restrict the physical movement of people.
      required: [message]
      properties:
        message: { type: string }
        reason_code:
          type: string
          enum: [outside_permitted_interval, request_not_approved, guest_already_inside, wrong_visit_date]
        override_available: { type: boolean }
        override_requires_reason: { type: boolean }

    ConsentRequiredError:
      type: object
      description: >-
        FR-35 at the point it bites. 409 and not 403: the caller's role covers
        the object perfectly well, and what stands in the way is the state of
        the world.
      required: [message]
      properties:
        message: { type: string }
        document:
          $ref: '#/components/schemas/ConsentDocument'
        revision: { type: string }

    VisitAlreadyClosedError:
      type: object
      description: FR-21. The register is append-only; a mistake is a correcting entry.
      required: [message]
      properties:
        message: { type: string }
        guest_visit_id: { type: integer, format: int64 }
        checked_out_at: { type: string, format: date-time }

    MaintenanceRequestStatus:
      type: string
      description: |
        FR-38's six states: «submitted → accepted → in progress → completed →
        closed; and submitted → rejected», plus FR-39's one edge back from
        `completed` to `accepted`.

        The values are FR-38's words and not §3.5.2's. That sequence diagram
        was drawn before the requirement was worded this way and labels the
        same states `new`, `assigned` and `done`; the requirement is what the
        module is accepted against and a client reads the stored value, so the
        requirement wins.

        `closed` carries both endings and does not split them: which of the two
        it was is the difference between `confirmed_at` being set and
        `auto_closed` being true. A seventh state would have to be handled by
        every reader of the queue and would tell the reporter nothing those two
        columns do not.
      enum: [submitted, accepted, in_progress, completed, closed, rejected]

    MaintenanceCategory:
      type: string
      description: |
        FR-36's categories. Six values fixed by the requirement, not a lookup
        table: nobody administers the list from a screen and a category carries
        no attributes of its own.

        `other` is present on purpose. A resident who cannot find their defect
        in five words abandons the form, and the queue then holds a tidy
        taxonomy of the defects that were easy to classify.
      enum: [plumbing, electrical, furniture, heating, network, other]

    MaintenanceLocation:
      type: string
      description: |
        FR-36's location: «own room or a named common area».

        The two behave differently at the moment the request is written.
        `own_room` binds to the room of the submitter's active residency
        record, read from the register; `common_area` names the place in
        `location_note`, because the register holds rooms and beds and knows
        nothing about the kitchen on the fourth floor. `room_id` is null for a
        common area.
      enum: [own_room, common_area]

    MaintenanceUrgency:
      type: string
      description: |
        FR-36's urgency, in the three values §3.4.3 gives
        `MAINTENANCE_REQUEST.priority`.

        The resident sets it and the warden may change it on triage. A scale
        nobody can move is a scale everybody maximises: the resident's choice
        is what they know — water on the floor now, a wobbly chair whenever —
        and the warden's is what the queue is ordered by. The change is a row
        in the work log like any other.
      enum: [routine, urgent, emergency]

    MaintenanceRequest:
      type: object
      description: |
        One maintenance request as the resident and the warden read it.

        Three fields are computed and none of them stored: `age_days`,
        `overdue` and `confirmation_window_open` are questions about the clock,
        and a column holding the answer would be wrong between two runs of
        whatever updated it. The threshold and the window arrive from
        configuration, so moving either changes what the client reads on the
        next request.

        `photo_paths` carries paths and not URLs. A signed URL expires, so one
        embedded in a list is stale by the time somebody scrolls to it; the
        client asks for a link when it is about to show the image, and a path
        is meaningless without the object store's credentials.

        `work_log` is where the reason for a refusal and the comment on every
        move actually live (§3.4.1, decision 6). There is deliberately no
        `rejection_reason` on the request to disagree with the history.
      required: [id, building_id, reporter_id, category, location, description, status]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        building_name: { type: string }
        room_id:
          type: [integer, 'null']
          format: int64
          description: Null for a common area (§3.4.3, «NULL for common areas»).
        room_number: { type: [string, 'null'] }
        reporter_id: { type: integer, format: int64 }
        reporter_name: { type: string }
        category:
          $ref: '#/components/schemas/MaintenanceCategory'
        category_label: { type: string }
        location:
          $ref: '#/components/schemas/MaintenanceLocation'
        location_note: { type: [string, 'null'] }
        place:
          type: string
          description: Where the defect is, in words — «Room 412», or the named common area.
        title: { type: [string, 'null'] }
        description: { type: string }
        urgency:
          $ref: '#/components/schemas/MaintenanceUrgency'
        urgency_label: { type: string }
        photo_paths:
          type: array
          maxItems: 3
          items: { type: string }
        photo_count: { type: integer, minimum: 0, maximum: 3 }
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        status_label: { type: string }
        assigned_to: { type: [integer, 'null'], format: int64 }
        assignee_name: { type: [string, 'null'] }
        assigned_at: { type: [string, 'null'], format: date-time }
        target_date:
          type: [string, 'null']
          format: date
          description: >-
            The planned completion date. Never null past `submitted` and
            outside `rejected` — FR-37's second criterion, kept by a CHECK
            constraint as well as by the form rule.
        completed_at: { type: [string, 'null'], format: date-time }
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: Set only when the reporter closed it themselves.
        closed_at: { type: [string, 'null'], format: date-time }
        auto_closed:
          type: boolean
          description: >-
            FR-39. True when the confirmation window ran out with no answer. A
            request the resident confirmed is evidence the defect was fixed; one
            that closed for want of an answer is evidence of nothing but that
            the dormitory stopped waiting, and the two must not be confused.
        reopen_count: { type: integer, minimum: 0 }
        age_days:
          type: integer
          minimum: 0
          description: FR-40's «age since submission», in whole days.
        overdue: { type: boolean }
        overdue_after_days: { type: integer }
        confirmation_window_days: { type: integer }
        confirmation_window_open:
          type: boolean
          description: >-
            Whether the reporter may still confirm or dispute. The screen reads
            it so as to offer the two buttons only while they would work.
        work_log:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceWorkLogEntry'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MaintenanceWorkLogEntry:
      type: object
      description: |
        One entry of the append-only work log (§3.4.1, decision 6; §4.4.4).

        `from_status` null means the row records a submission rather than a
        move: the request did not change state, it came into being.
        `actor_id` null means nobody decided — the scheduled closure of FR-39 —
        and `by_the_scheduler` says so plainly, so that no client fills the gap
        with an author the record deliberately does not have.
      required: [id, to_status, recorded_at]
      properties:
        id: { type: integer, format: int64 }
        from_status:
          oneOf:
            - $ref: '#/components/schemas/MaintenanceRequestStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        summary: { type: string }
        comment: { type: [string, 'null'] }
        actor_id: { type: [integer, 'null'], format: int64 }
        actor_name: { type: [string, 'null'] }
        by_the_scheduler: { type: boolean }
        recorded_at: { type: string, format: date-time }

    MaintenanceRequestInput:
      type: object
      description: |
        FR-36's submission. Multipart, because of the photographs.

        There is no `room_id` and that is the design: an «own room» request is
        bound to the room of the submitter's active residency record, read from
        the housing register. A client that could name the room could name
        somebody else's.
      required: [building_id, category, location, description]
      properties:
        building_id: { type: integer, format: int64, minimum: 1 }
        category:
          $ref: '#/components/schemas/MaintenanceCategory'
        location:
          $ref: '#/components/schemas/MaintenanceLocation'
        location_note:
          type: string
          maxLength: 255
          description: >-
            Required when `location` is `common_area` and ignored otherwise —
            a note beside a room resolved from the register would be a second,
            unreliable answer to «where».
        title: { type: string, maxLength: 255 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        urgency:
          $ref: '#/components/schemas/MaintenanceUrgency'
        photos:
          type: array
          maxItems: 3
          description: >-
            Up to three. The ceiling is configuration, is refused here as a 422
            naming `photos`, and is refused again by a CHECK constraint.
          items: { type: string, format: binary }

    MaintenanceAcceptanceInput:
      type: object
      required: [target_date]
      properties:
        target_date:
          type: string
          format: date
          description: >-
            The planned completion date, and mandatory: FR-37 makes acceptance
            without one impossible. A date in the past is refused — the resident
            is told this date the moment the acceptance succeeds.
        assigned_to:
          type: integer
          format: int64
          description: The responsible party FR-37 names beside the date. Optional.
        urgency:
          $ref: '#/components/schemas/MaintenanceUrgency'
        comment: { type: string, maxLength: 1000 }

    MaintenanceRejectionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: >-
            FR-37, first criterion: «rejection without a reason is impossible».
            Stored as the comment of the work-log row the transition writes.

    MaintenanceCommentInput:
      type: object
      description: >-
        The optional sentence a transition carries into the work log. On
        `/reopening` it is the resident's «what is still wrong»; FR-39 does not
        demand one, and the history gets a sentence of its own when it is empty.
      properties:
        comment: { type: string, maxLength: 1000 }

    MaintenanceQueuePage:
      type: object
      description: FR-40. One page of a dormitory's queue, as rows of scalars.
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceQueueRow'
        meta:
          type: object
          properties:
            building_id: { type: integer, format: int64 }
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            overdue_after_days:
              type: integer
              description: >-
                The configured threshold this page's `overdue` column was
                measured against (FR-40, second criterion).
            columns:
              type: object
              description: The column keys and their headings, in the order the CSV writes them.
              additionalProperties: { type: string }

    MaintenanceQueueRow:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        submitted_at: { type: string, format: date-time }
        age_days: { type: integer, minimum: 0 }
        category: { type: string }
        urgency: { type: string }
        place: { type: string }
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        target_date: { type: [string, 'null'], format: date }
        overdue: { type: boolean }
        reporter: { type: string }
        assignee: { type: [string, 'null'] }
        reopen_count: { type: integer, minimum: 0 }

    ConfirmationWindowClosedError:
      type: object
      description: |
        FR-39, and the one refusal of this module a transition table cannot
        express. Once the nightly pass has run, the request is `closed` and the
        state machine refuses the reopening on its own; between the window
        closing and that run the request is still `completed` and
        `completed → accepted` is a move the table admits — correctly, because
        that is the move FR-39 is about. What has run out is the clock.

        409 rather than 422: the body is well formed and the caller is the right
        person, and the same call a day earlier would have succeeded.
      required: [message]
      properties:
        message: { type: string }
        maintenance_request_id: { type: integer, format: int64 }
        confirmation_window_days: { type: integer }
        window_closed_on: { type: [string, 'null'], format: date }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationLinks:
      type: object
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'] }
        last_page: { type: integer }
        links:
          type: array
          description: |
            One entry per page button, in the order they are drawn, with the
            previous and next arrows first and last. `page` is null on an arrow
            that leads nowhere, and absent on the ellipsis that stands for a gap
            in a long sequence.
          items:
            $ref: '#/components/schemas/PaginationLink'
        path: { type: string }
        per_page: { type: integer }
        to: { type: [integer, 'null'] }
        total: { type: integer }

    PaginationLink:
      type: object
      required: [url, label, active]
      properties:
        url: { type: [string, 'null'] }
        label: { type: string }
        page: { type: [integer, 'null'] }
        active: { type: boolean }
