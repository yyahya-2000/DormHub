openapi: 3.1.0

info:
  title: HSE DormHub — API v1
  version: 0.1.0
  summary: >-
    Role model, authentication, audit log, the housing register, staff, the
    personal account, and the guest, announcement, maintenance and
    lost-and-found modules
  description: |
    The implemented part of the REST contract of §3.3.6, in five slices. The
    first is FR-07 (role model), FR-08 (authentication and sessions) and FR-33
    (audit log). The second is the housing register: FR-01 (dormitories), FR-02
    (rooms and places), FR-03 (moving in), FR-05 (moving out) and FR-06 (the
    resident card). The third follows revision 2 of the role model: FR-41 (staff
    appointment inside a building) and FR-42 (issuing a resident account). The
    fourth is the personal account: FR-34 (notifications).

    The fifth is the guest module of increment 1, which is what the work is
    built around: FR-16 (the request), FR-17 (the duty officer's decision),
    FR-18 (verification at the security post), FR-19 (entry and exit) and
    FR-21 (the visitor register). FR-20, the control of the departure deadline,
    is in this increment too and has no route at all: it is a quarter-hourly
    sweep that reads the deadline frozen on each visit.

    The sixth is the announcement module of increment 2: FR-09 (publication) and
    FR-11 (the feed). FR-10, pinning an important announcement, is Could
    priority and outside the MVP — there is no route for it and no column behind
    one — and FR-12, the acknowledgement of reading, has been withdrawn from the
    MVP together with the table it rested on.

    The seventh is the maintenance module of increment 3: FR-36 (the resident
    files a defect), FR-37 (the warden's triage), FR-38 (the status lifecycle),
    FR-39 (confirmation and reopening) and FR-40 (the dormitory's queue and its
    export). Two of its requirements have no route at all and are scheduled
    passes: FR-39's automatic closure of a request nobody confirmed, and FR-40's
    nightly flagging of the requests past the configured threshold.

    The eighth is the lost-and-found module of increment 4: FR-24 (publishing a
    find), FR-25 (the list of finds for one's own dormitory) and FR-26 (the
    claim, the holder's answer, the referral of a disagreement and the warden's
    decision). Two properties of it are worth reading before the paths, because
    both are refusals rather than features. **Publication passes through no
    staff approval step** — the module is peer-to-peer, the finder keeps the
    object and decides on claims, and a moderation queue would cost the module
    its only advantage over a message board. And **the find card carries
    neither the name nor the contacts of the person who published it** — the
    exchange runs through claims inside the system, otherwise a dormitory's
    feed becomes an open list of residents' telephone numbers. A member of
    staff enters in two cases only: an object deposited with the administration
    for safekeeping, and a claim the two sides could not settle.

    FR-27, the control of the six-month retention period of Civil Code art. 228
    cl. 1, is Could priority and outside the MVP. There is no route for it and
    no scheduled pass behind one; the two dates it will be counted from —
    `happened_on` and `declared_on` — are in the model all the same, because a
    declaration date cannot be retrofitted onto records created without one.

    Nine properties of the contract are worth reading before the paths.

    Authorisation is scoped by building, not only by role. A grant of a role names
    the dormitory it holds in, and every building-addressed route decides on the
    object rather than on the role alone. A warden of one building asking about
    another gets 403, at the API and not merely in the interface.

    There are six roles, and the two in the middle differ in exactly one thing.
    The warden heads the dormitory; the manager beneath him does the register
    work — rooms, places, moving in and out, resident cards and accounts — and
    appoints nobody. Everywhere in this document that says «the warden of this
    building» about operative work, the manager of that building is included.
    Where a route is the warden's alone, it says so.

    The sign-in route has two distinct refusals. 401 means the credential did not
    resolve to an account that may sign in; it never says whether the login exists.
    429 means the login is inside its block window after the configured number of
    failed attempts, and the reply carries the seconds remaining.

    The bed, not the room, is the unit of residency. A room declares a `capacity`
    and holds that many places; a residency names a place. This is what lets
    «three beds in the room, two taken» be said at all, and it is why the refusal
    to exceed a capacity can name the free remainder.

    A residency is historical and is never deleted. Moving out writes
    `moved_out_at` and a ground; the record stays, the place is freed at once, and
    the person's access to building-bound routes ends on the stated date. Two
    residents holding one place over overlapping periods is refused by a partial
    unique index in the database, and the refusal carries the conflicting record.

    The visiting regime is a property of each dormitory and never a constant.
    `visiting_from`, `visiting_to` and `guest_lead_time_hours` sit
    on the BUILDING row, and they are what the submission validator, the card at
    the post and the overdue sweep all read. A university whose rules close the
    dormitory at 22:00 changes a column, which is what NFR-09 asks for. The
    defaults reproduce clause 2.2 of the HSE rules of internal order — a guest
    between 08:00 and 23:00 — and are this deployment's values rather than the
    sector's.

    An announcement is addressed by `building_id`, and a null one means every
    dormitory. That single column is the whole of the audience: the feed filters
    on it, the fan-out reads it, and there is no second field and no recipient
    list that could disagree with it. The administrator names a dormitory or
    leaves the field out; leaving it out is his right and nobody else's — a
    warden who could would be addressing dormitories his grant does not name. The
    validity period is the same kind of thing: `expires_at` is a comparison the
    feed makes and not a status anybody sets, so an announcement leaves the feed
    for the archive by itself and no job has to run for it to happen.

    Dates and times are the dormitory's own. The application runs in the
    building's timezone — a setting, `APP_TIMEZONE`, standing at `Europe/Moscow`
    for this deployment — so `visit_date`, `happened_on` and `target_date` are
    the days a person in the building would name, and `planned_from` and
    `planned_to` are its wall-clock hours. Every `date-time` in a response
    carries an explicit offset. Until the acceptance of 15.09.2026 the server
    kept UTC while the dormitory kept Moscow time, and after nine in the evening
    the two disagreed about what day it was: a find picked up that evening was
    refused as «later than today» and a guest approved for that evening was
    turned away at the post as «for another day».

    The system records facts about people's movement and does not restrict it.
    A refusal at the checkpoint is a refusal to *record* an entry as lawful, not
    a barrier: the ground for refusing a person entry to a dormitory is the
    university's local act and the action of the security service. An officer
    may admit a guest against the interval, with a stated reason, and both the
    entry and the exception are recorded.

servers:
  - url: http://localhost:8080/api/v1
    description: Local development — the port docker-compose publishes the web container on
  - url: /api/v1
    description: Same origin as the client

tags:
  - name: Authentication
    description: FR-08. Sign-in, sign-out and the identity of the current session.
  - name: Buildings
    description: >-
      FR-01 and FR-07. The register of dormitories, and the routes the
      role-and-building scope is demonstrated on.
  - name: Rooms
    description: FR-02. The register of rooms and places, kept per building.
  - name: Residencies
    description: FR-03 and FR-05. Moving in, and moving out.
  - name: Residents
    description: FR-06 and FR-42. The resident card, and the account behind it.
  - name: Staff
    description: >-
      FR-41. Appointing and dismissing the staff of one dormitory. The warden's
      route: the manager appoints nobody.
  - name: Notifications
    description: >-
      FR-34. A person's own messages.
  - name: Announcements
    description: >-
      FR-09 and FR-11. The warden or the manager of a dormitory publishes; the
      administrator publishes into any of them or into all of them at once. The
      resident reads a feed of their own dormitory, newest first, filterable by
      category.
  - name: Guest requests
    description: >-
      FR-16, FR-17 and FR-23. The resident invites; the duty officer of that
      dormitory decides. Nobody else does — not the warden, not the manager,
      not the administrator.
  - name: Checkpoint
    description: >-
      FR-18 and FR-19. The security post: find the guest, record the entry,
      record the exit. Verification and entry are two operations on purpose
      (§3.5.1).
  - name: Visitor register
    description: >-
      FR-21. The journal clause 2.1.2 of the HSE rules of internal order makes
      the security service keep by hand, with the pen removed. Append-only; a
      correction is a correcting entry.
  - name: Maintenance
    description: >-
      FR-36 … FR-40. The resident reports a defect; the warden or the manager of
      that dormitory triages it and carries it as far as «completed»; the
      resident who reported it is the only person who can close it. A request
      nobody confirms closes itself after a configurable window, marked as
      automatically closed rather than as confirmed.
  - name: Lost and found
    description: >-
      FR-24, FR-25 and FR-26. Peer-to-peer by default: the resident who found
      something publishes it with no approval step in the way, keeps it, and
      accepts or declines the claims made against it. The card shows neither the
      name nor the contacts of whoever published it. A member of staff enters in
      two cases only — an object deposited with the administration for
      safekeeping, and a claim the two sides could not settle.
  - name: Audit
    description: FR-33. Append-only, readable by the administrator alone.

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and receive an API token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The credential was accepted and a token was issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedToken'
        '401':
          description: |
            The login or the password is wrong, or the account is not active. The
            body carries how many attempts remain before the block; zero means this
            attempt was the last one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: |
            The request was refused for a while, and `reason` says by which of the
            three limits. `login_locked`: the account reached the configured number
            of failed attempts — five attempts, fifteen minutes by default.
            `address_locked`: the network address reached its own ceiling, counted
            across every login tried from it. `rate_limited`: the address sent more
            requests to this route than it admits per minute, which says nothing
            about credentials at all — a caller with a correct password and no
            failed attempt can meet it.

            All three carry the same body, so a client reads `retry_after` without
            branching and branches on `reason` only where the wording matters.
          headers:
            Retry-After:
              description: Seconds until the request is accepted again.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'

  /auth/password:
    post:
      tags: [Authentication]
      summary: Replace the password of the signed-in account
      description: |
        FR-42, third criterion. An account issued to an incoming resident is
        created with a password the server generates; the office reads it once,
        out of the answer that created the account, prints it and hands it over.
        This route is the other end: the resident signs in with what they were
        given and puts a password of their own in its place.

        Behind the session, and the old password is presented with the new one —
        a stolen token must not be enough to take an account over. Every API
        token the account holds is revoked with the change, the one making it
        included, so the client signs in again afterwards.

        `password_change_required` on the account says the change is still owed.
        It is cleared here and nowhere else.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '204':
          description: The password is replaced. The event is in the audit log, the value is not.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            The payload failed validation — `current_password` did not match the
            account's own, the confirmation did not match, or the new password
            is too short.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: >-
            The address sent more requests to this route than it admits per
            minute. A limiter of its own, counted apart from the sign-in route:
            both are keyed by network address and a dormitory is one address, so
            a shared counter meant a handful of guesses at a password locked
            everybody behind that address out of signing in. `reason` is
            `rate_limited`, and the message names this route rather than the
            sign-in one.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the token used for this request
      operationId: logout
      responses:
        '204':
          description: The token is revoked and the sign-out is recorded in the audit log.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Authentication]
      summary: The account behind the current token, with its role grants
      operationId: currentUser
      responses:
        '200':
          description: The authenticated account.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /buildings:
    get:
      tags: [Buildings]
      summary: The register of dormitories, scoped to the caller
      description: |
        The administrator sees every dormitory; every other role sees the ones its
        grants name. This is the «empty scoped result» half of FR-07's criterion:
        the route is not refused, the answer is narrowed.

        A resident the register shows as moved out is narrowed out too, even
        though eviction revokes no role grant. The listing and
        `GET /buildings/{building}` answer the same question, so no row here
        leads to a 403 there.
      operationId: listBuildings
      responses:
        '200':
          description: The dormitories this account may see.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Buildings]
      summary: Register a dormitory
      description: |
        FR-01, first criterion: the administrator and nobody else. A warden's
        token gets 403 here, including a warden of the dormitory the request
        concerns — the refusal is about the role, not about the scope.
      operationId: createBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '201':
          description: >-
            The dormitory was registered. The change is in the audit log. The
            answer carries the regime settings that were defaulted, so it matches
            a subsequent read of the same dormitory field for field.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/rooms:
    get:
      tags: [Rooms]
      summary: The register of rooms and places of one dormitory
      description: |
        FR-02. Each entry carries the capacity, the places registered, the places
        occupied, how many further places may be registered (`free_places`) and
        how many registered places are free for somebody to move into
        (`vacant_beds`), so that a client never has to subtract and arrive at a
        figure the server did not refuse on.

        The administrator, and the warden, manager or duty officer **of this
        building**. A resident does not read the occupancy of the whole dormitory.
        The list is paged, and all three filters are applied by the database
        rather than by the client: `free=1` narrows it to the rooms holding a
        place somebody could move into today, `q` matches part of a room
        number, and `floor` keeps one storey. `floor` is what the floor card of
        FR-02 reads a storey with — without it the card had to page through the
        whole register and discard everything on the other floors.
      operationId: listBuildingRooms
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - name: q
          in: query
          required: false
          description: Part of a room number.
          schema: { type: string, maxLength: 32 }
        - name: free
          in: query
          required: false
          description: Keep only the rooms with at least one free place.
          schema: { type: boolean }
        - name: floor
          in: query
          required: false
          description: >-
            Keep only the rooms on this storey. An empty value is the same as
            omitting it. A storey the dormitory has no rooms on is an empty
            page and not an error; a value outside the bounds a room may be
            created with is 422.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: The rooms, by floor and then by number.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Rooms]
      summary: Register a room
      description: |
        FR-02. The warden or the manager of this building, or the administrator. A
        room number is unique inside its building and free across buildings.
      operationId: createRoom
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: The room was registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/floors:
    get:
      tags: [Rooms]
      summary: The floors of one dormitory, with the occupancy of each
      description: |
        FR-02, the register added up. Per floor: how many rooms stand on it, how
        many of those still hold a free place, how many places are registered and
        how many of them nobody holds.

        One aggregate over rooms and places, grouped by floor, so a twelve-storey
        block costs what a single floor does. The same circle as the room
        register — the summary cannot be readable by anybody the register is not.
      operationId: listBuildingFloors
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The floors, lowest first. A floor with no rooms is absent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Floor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{room}:
    get:
      tags: [Rooms]
      summary: One room with its places
      operationId: showRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: The room card, places included.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rooms]
      summary: Edit a room
      description: |
        FR-02. Lowering `capacity` below the places already registered is the
        capacity rule approached from the other side and is refused with the same
        422, carrying the same figures.
      operationId: updateRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: The room as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the payload failed validation, or the capacity rule of FR-02 was
            broken. The second case carries `capacity`, `beds` and `free_places`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/CapacityExceeded'

  /rooms/{room}/beds:
    post:
      tags: [Rooms]
      summary: Register a place in a room
      description: |
        FR-02, second criterion. An attempt to take the room past its capacity is
        rejected **and the free remainder is shown**: the 422 carries `capacity`,
        `beds` and `free_places`, and `free_places` is the number the register
        refused on rather than one the client computed.

        A place label is unique inside its room, which the database enforces and
        the form reports.
      operationId: createBed
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 16
                  description: The place identifier inside the room.
                  examples: ['1', '2a']
      responses:
        '201':
          description: The place was registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Bed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the payload failed validation — a duplicate label, for one — or
            the room is full, in which case the body names the free remainder.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/CapacityExceeded'

  /residencies:
    post:
      tags: [Residencies]
      summary: Place a resident in a bed
      description: |
        FR-03. The scope is read off the bed: a residency names no building, and
        the warden or manager of the building the bed stands in is the one allowed
        to write the row.

        Two residents cannot hold one place over overlapping periods. The refusal
        comes from the exclusion constraint `residencies_bed_no_overlap` in the
        database, not from a check in the application, and the 409 it produces
        carries the conflicting record under `conflict`. A resident already
        holding another place is refused the same way, by
        `residencies_user_no_overlap`.

        The rule is about **periods**, not about open records. A `moved_in_at`
        backdated underneath a residency that is already running is refused, and
        so is a place whose termination has been recorded for a date still to
        come. The bounds are closed below and open above, so a move-in on the
        very day the last occupant leaves is admitted: a bed changes hands
        without a night of nobody in it.
      operationId: createResidency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidencyInput'
      responses:
        '201':
          description: The residency was recorded and the place is now occupied.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Residency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The place is held over a period that overlaps the one asked for, or
            the person already holds another place over such a period. The record
            standing in the way is in `conflict` — it may well be one whose
            termination date lies in the future.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidencyConflict'
        '422':
          description: |
            Either the payload failed validation, or the place cannot receive
            anybody — a place the warden has withdrawn from use.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'

  /residencies/{residency}/termination:
    post:
      tags: [Residencies]
      summary: End a residency
      description: |
        FR-05. The row is **not** deleted: the ground and the date are written,
        and the history stays readable on the card of FR-06.

        `moved_out_at` may lie in the future, and then nothing else changes yet.
        The record stays `active`, the place stays `occupied`, and the person's
        access to building-bound routes runs until the stated date and is gone on
        it — «no later than the stated date». `is_open` becomes false because a
        departure date is now written down; `is_current` stays true because the
        person is still living there. The two are the halves of that distinction
        and they are meant to differ.

        On the stated date the record becomes `ended` and the place becomes
        `free`, done by the nightly `housing:settle-residencies` when no request
        happens to be doing it. A termination dated today does all of it at
        once.

        The ground is required. A termination with an empty reason is refused with
        422.
      operationId: terminateResidency
      parameters:
        - $ref: '#/components/parameters/ResidencyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ground]
              properties:
                ground:
                  type: string
                  minLength: 3
                  maxLength: 255
                  description: Why the residency ends. Recorded verbatim.
                  examples: ['Graduation, art. 105 cl. 2 of the Housing Code']
                moved_out_at:
                  type: string
                  format: date
                  description: >-
                    The day the residency ends. Defaults to today; may be set
                    forward, never before the move-in date.
      responses:
        '200':
          description: The residency as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Residency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /residents/{resident}:
    get:
      tags: [Residents]
      summary: The resident card
      description: |
        FR-06. Visible to the warden and the manager **of that dormitory** and to
        the administrator; a resident sees only their own. Nobody else: the duty
        officer's work is the guest request and the security officer's is the
        entrance, and neither needs a citizenship or a telephone number. The
        warden of building 1 requesting a card of building 2 gets 403, at the API
        and not merely in the interface.

        The card carries the name, the citizenship, the contact, the current
        place, the whole residency history and the guest visits of this person
        that ran past their deadline. `current_bed` is read as «resident today»,
        not as «no departure date written»: somebody leaving at the end of
        December has a current place until the end of December. Reading the card
        is recorded in the audit log, because it carries personal data.
      operationId: showResidentCard
      parameters:
        - $ref: '#/components/parameters/ResidentId'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResidentCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{building}:
    get:
      tags: [Buildings]
      summary: The card of one building
      description: |
        Readable by the administrator and by anyone holding a role in this
        building. A staff member of another building gets 403.
      operationId: showBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: The building card. The read is recorded in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            No role covering this building — or, for a resident, a residency the
            register shows as ended: FR-05 closes the building-bound routes on the
            stated date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Buildings]
      summary: Edit a dormitory
      description: 'FR-01, first criterion: the administrator alone.'
      operationId: updateBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '200':
          description: The dormitory as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Buildings]
      summary: Delete a dormitory
      description: |
        FR-01, second criterion. A dormitory that still has anything attached
        cannot be deleted, and the refusal states **which** thing: 409 whose
        `blocked_by` carries both counts and whose message names the one that
        actually refused.

        Two foreign keys point at a dormitory and either can block the delete:
        `rooms.building_id` and `role_user.building_id`, both `ON DELETE
        RESTRICT`. It is the database that refuses, so the rule holds against
        code that forgot to ask.

        The way out depends on which it was. A staff grant is revoked through
        `DELETE /buildings/{building}/staff/{user}/{role}`. Rooms are not: this
        API has no route that deletes or moves one, so the message names them and
        advises nothing.
      operationId: deleteBuilding
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '204':
          description: The dormitory held no rooms and is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Rooms or staff grants are attached. The body states which, and both
            counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionBlocked'

  /buildings/{building}/users:
    get:
      tags: [Buildings]
      summary: The people holding a role in this building
      description: |
        Personal data, so the circle is narrower than for the card: the
        administrator, and the warden, manager or duty officer **of this
        building**. A resident of the building gets 403, and so does the warden of
        any other building. The answer never carries a person attached to a different
        dormitory.
        The list is paged, and `q` searches it by part of a name — which is how
        the accommodation form of FR-03 finds a candidate, rather than by
        fetching the roll and filtering it in the browser. `role` keeps one kind
        of grant: `student` for the residents, the staff codes for the staff.
        Neither parameter widens the answer, because the query starts from the
        grants naming **this** building whatever they say.
      operationId: listBuildingUsers
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - name: q
          in: query
          required: false
          description: Part of a name.
          schema: { type: string, maxLength: 120 }
        - name: role
          in: query
          required: false
          description: Keep only the people holding this role in this building.
          schema:
            $ref: '#/components/schemas/RoleCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: The roll of the building. The read is recorded in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/staff:
    post:
      tags: [Staff]
      summary: Appoint a member of staff in this dormitory
      description: |
        FR-41. The warden of **this** building grants the manager, duty officer
        or security role inside it.

        **The chain is one level deep at each step.** The administrator grants
        the warden and stops there; the staff beneath the warden are the
        warden's own appointments, made inside the building he answers for. An
        administrator asking for `security` directly is refused — otherwise
        there would be a road into a dormitory's staff that goes past the person
        who answers for it. The same list decides revocation, so a grant the
        administrator may not write he may not take back either: a dormitory
        that has lost its warden gets a new one appointed first.

        Four refusals are worth telling apart, and all four are 403 because all
        four are a question of who the caller is:

        - the same call against another dormitory — the scope of the caller's own
          grant is what decides, and the path is what it is compared against;
        - a grant of the administrator role — nobody grants it, and the
          administrator's own is issued outside the application entirely;
        - a grant of the warden role by anyone but the administrator;
        - any staff grant at all attempted by a manager — the one capability
          revision 2 of the role model withheld from him.

        The grant names the building from the path. A `building_id` in the
        payload is ignored, because a body that could nominate the scope would
        be nominating the scope the caller's own authorisation is checked
        against.

        `user_id` is judged too, and not only checked for existence: an account
        the register of **another** dormitory answers for cannot be given a role
        here, and the refusal is 422 on that field. An account no dormitory
        answers for — a security officer hired from outside — is the ordinary
        case and is appointed as before, and so is a resident of this same
        dormitory taking a shift in it.

        Appointing twice is one appointment: the answer is 200 rather than 201,
        no second grant is written, and the log keeps one entry per grant.
      operationId: appointStaff
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAppointmentInput'
      responses:
        '200':
          description: The account already held this role here. Nothing changed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoleGrant'
        '201':
          description: The role is granted. The appointment is in the audit log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoleGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/staff/{user}/{role}:
    delete:
      tags: [Staff]
      summary: Dismiss a member of staff of this dormitory
      description: |
        FR-41, the revocation half. The same circle of roles as the appointment,
        and deliberately the same: a warden able to revoke another warden could
        remove the one account above him in his own building.

        404 means the account holds no such role here — a revocation that
        revoked nothing must not read as a success.
      operationId: revokeStaff
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/StaffUserId'
        - $ref: '#/components/parameters/StaffRole'
      responses:
        '204':
          description: The role is revoked. The dismissal is in the audit log.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such dormitory or account, or the account holds no such role here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/residents:
    post:
      tags: [Residents]
      summary: Issue an account to an incoming resident
      description: |
        FR-42. The warden or the manager of **this** dormitory creates the
        account of a person moving in: name, contact, citizenship.

        There is no `role` field and no `password` field, and both absences are
        the requirement rather than an omission.

        The grant the account receives is always the resident role, always
        scoped to the building in the path, so no staff role can be issued this
        way — there is no parameter through which one could be asked for.

        **The password is generated by the server and returned once.** It is in
        `data.password` of this answer and in no other response of the API: the
        account is read back through `User`, which has no such field. Nothing is
        sent anywhere — no mail, no queue, no audit entry carries the value. The
        office prints this answer and hands the sheet to the person it belongs
        to, which is what `data.user`, `data.building` and the role grant are
        there for.

        The account is created with `password_change_required: true`, so the
        resident replaces the printed password at `POST /auth/password` on first
        sign-in.
      operationId: issueResidentAccount
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentAccountInput'
      responses:
        '201':
          description: >-
            The account exists, the resident role is granted in this dormitory,
            and the generated password is in the body — for the only time. The
            issue is in the audit log; the password is not.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /citizenships:
    get:
      tags: [Residents]
      summary: The closed list of citizenships
      description: |
        The values `citizenship` is validated against, with the name beside each
        code, so that the form draws its dropdown from the same source the rule
        decides on. The order is the order the list is meant to be shown in.
      operationId: listCitizenships
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: { $ref: '#/components/schemas/Citizenship' }
                        label: { type: string, example: Russia }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications:
    get:
      tags: [Notifications]
      summary: The messages of the personal account
      description: |
        FR-34, the in-app half. One person's own messages, newest first. The
        route is scoped to the account the token names and has no parameter for
        any other, which is why it carries no role check: there is nothing here
        to be authorised against.

        `payload` is the body of the message and its shape depends on the
        category — each notification decides its own in `toDatabase()`. `category`
        is lifted out of it into a field of its own, because that is what a
        client draws the icon and the caption from.

        The field is called `payload` and not `data` on purpose: a resource
        whose top-level object carried a key called `data` would be taken by the
        framework to have wrapped itself, and this one route would answer
        without the `data` envelope every other route in this document has.

        **There is no filter.** The route used to take an `unread` parameter and
        it is gone with the settings screen: a person with a dozen messages does
        not sort them, they read down the page. Unread is a colour on the row,
        and `POST /notifications/{notification}/read` clears it.

        `meta.unread_count` is the number behind the badge in the menu, which is
        drawn on every screen and is a different question from «what is on this
        page». It is one count over the rows this listing already scopes itself
        to, answered in the same request.
      operationId: listNotifications
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the person's messages, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/NotificationsMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      summary: Mark one message read
      description: |
        FR-34. Idempotent: a message already read keeps the moment it was first
        read rather than acquiring a new one.

        A message belonging to another account answers 404 and not 403. The
        difference is deliberate — a 403 would confirm that the identifier
        exists, which is more than a stranger should be told.
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The message, now carrying `read_at`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit-logs:
    get:
      tags: [Audit]
      summary: Read the audit log
      description: |
        The administrator alone. Reading the log is itself a recorded event, so
        every call adds one entry of its own. The log has no write route and can
        have none: the database has revoked UPDATE and DELETE on the table from
        the role the application connects as.
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          required: false
          description: Return only the entries of one action.
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the log, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /announcements:
    get:
      tags: [Announcements]
      summary: The caller's own announcement feed
      description: |
        FR-11. The announcements addressed to the dormitories this account is
        attached to, plus those addressed to every dormitory, published and not
        yet expired, newest first.

        **The route carries no building parameter, and that is the boundary.**
        The audience is computed from the grants of the token, so there is no
        way to phrase a request for another dormitory's feed — the horizontal
        boundary of FR-07 is the absence of a parameter here rather than a check
        somebody has to remember. FR-05 applies on top of it: a resident whose
        departure date has passed stops seeing that dormitory's feed.

        `archived=true` returns the other side of the `expires_at` comparison —
        the announcements that have left the feed. Nothing moves them there;
        there is no archiving job and no status column.
      operationId: listAnnouncements
      parameters:
        - name: category
          in: query
          required: false
          description: >-
            Return only the announcements stored under this exact label. The
            category is a free string, so a label nobody has posted under is an
            empty page rather than a 422.
          schema: { type: string, maxLength: 32 }
        - name: archived
          in: query
          required: false
          description: >-
            Return the expired announcements instead of the current ones. Sent
            as a query string, so `true`, `false`, `1` and `0` are all read —
            which is what a generated client produces from a boolean. Anything
            else is 422 naming the field.
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: One page of the feed, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Announcements]
      summary: Publish an announcement
      description: |
        FR-09. The warden or the manager of the dormitory named, and the
        administrator.

        **`building_id` is the whole of the addressee: an identifier, or null
        for every dormitory.** There is no separate «all buildings» flag and
        there must not be one — two fields could disagree, and the
        disagreement would be a notice addressed to nobody. The administrator
        picks a dormitory by naming it or addresses all of them by leaving the
        field out; a null building is an audience and not a missing field
        (§3.4.2), and a warden permitted to leave it out would be addressing
        buildings his grant does not name. A warden who tries gets 403.

        `category` is a free label of at most 32 characters, trimmed. The
        client offers the catalogue of `GET /announcement-categories` first and
        lets the author type something else; the server stores what it is
        given.

        `published_at` is not accepted. Publication happens now — a settable
        date would let a notice be back-dated, and the audit record of the
        publication would then carry a date the author chose.

        `expires_at` is the validity period of FR-09 and may be omitted, in
        which case the announcement does not expire. An expiry already past is
        422: it would produce a notice in no feed and in no archive.

        The fan-out to the audience is queued: the warden's request returns
        once the announcement is written, and the messages of FR-34 are put on
        the queue by a job behind it.
      operationId: publishAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '201':
          description: >-
            The announcement is published and is in the audit log as
            `announcement.published`, with its addressee — a building identifier
            or null for all of them.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /announcement-categories:
    get:
      tags: [Announcements]
      summary: The catalogue of announcement categories
      description: |
        The headings the publishing form offers before it lets the author type
        one of their own, with the name to show beside each.

        **A catalogue and not a closed list.** `announcements.category` is a
        free string of at most 32 characters and nothing validates against
        these five; they exist so that five wardens announcing a water shutoff
        agree on the heading without being forced to. `max_length` is the bound
        the form should enforce, and it is the width of the column.

        The shape is `GET /citizenships`'s, deliberately: both answer «what may
        this field hold», and a client that reads one should not have to learn
        a second shape for the other.
      operationId: listAnnouncementCategories
      responses:
        '200':
          description: The suggested headings, in the order to draw them.
          content:
            application/json:
              schema:
                type: object
                required: [data, max_length]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: { $ref: '#/components/schemas/AnnouncementCategory' }
                        label: { type: string }
                  max_length:
                    type: integer
                    description: The longest category the column and the form request accept.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /guest-requests:
    get:
      tags: [Guest requests]
      summary: The duty officer's queue, or the caller's own requests
      description: |
        Two lists behind one route, and the scope decides which.

        With `building_id`, this is the queue of that dormitory and the caller
        needs the capability that reads it — the duty officer, the warden, the
        manager or the administrator. Without it, this is «my own requests» and
        needs nothing beyond a session: the filter is the identifier of the
        token, and there is no parameter through which one resident could ask
        about another's guests.
      operationId: listGuestRequests
      parameters:
        - name: building_id
          in: query
          required: false
          description: The dormitory whose queue is being read. Omit for the caller's own requests.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GuestRequestStatus'
        - name: visit_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          description: Rows per page. Capped at 100; a larger value is a 422.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: One page of the requests, newest visit first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuestRequest'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Guest requests]
      summary: Submit a guest request
      description: |
        FR-16. The resident of the dormitory named, and only a resident of it:
        the right to invite a guest follows from living there and not from an
        account being scoped there, so a member of staff with no residency is
        refused and so is a resident whose departure date has passed (FR-05).

        **Three rules, and all three read the BUILDING row.** The interval must
        lie inside `visiting_from`–`visiting_to`; it must begin no sooner than
        `guest_lead_time_hours` from now; the visit date must not be in the
        past. A dormitory whose rules close at 22:00 changes a column and this
        route changes with it, which is what NFR-09 asks for — the window is
        never a constant in code.

        The request carries the guest's name and nothing else about them. No
        document, no purpose of the visit: the paper is compared with the
        person at the desk and the register keeps no copy of it (§2.7.1).
      operationId: submitGuestRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequestInput'
      responses:
        '201':
          description: >-
            The request is filed in `pending_review` and is in the audit log as
            `guest_request.submitted`. No access code exists yet: it is issued
            only on approval.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guest-requests/{guestRequest}:
    get:
      tags: [Guest requests]
      summary: One guest request
      description: >-
        The resident who submitted it, and the staff of the dormitory whose
        capability covers the queue.
      operationId: showGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      responses:
        '200':
          description: The request, with its visit if one has been recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /guest-requests/{guestRequest}/approve:
    post:
      tags: [Guest requests]
      summary: Approve a guest request
      description: |
        FR-17. **The duty officer of this dormitory**, and nobody else: not the
        warden, not the manager, not the administrator. The capability sits on
        one role (`Permission::DecideGuestRequests`), which is the agreement of
        13.09.2026 stated once rather than repeated in four policies.

        The consequence is deliberate: a dormitory with no duty officer
        appointed cannot approve a guest request, and the remedy is an
        appointment under FR-41.

        On success the access code is drawn and stored, `decided_by` and
        `decided_at` are written, the audit record is written in the same
        transaction, and the applicant is notified after the commit
        (`request_decision`, an optional category the resident may switch off).
      operationId: approveGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestApprovalInput'
      responses:
        '200':
          description: Approved, with the access code now on the request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The request is no longer pending — usually because a second officer
            decided it first. The body names the state it is in and the state
            that was asked for (§3.5.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          description: The daily quota is spent.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuotaError'
                  - $ref: '#/components/schemas/ValidationError'

  /guest-requests/{guestRequest}/reject:
    post:
      tags: [Guest requests]
      summary: Refuse a guest request
      description: |
        FR-17, second criterion: «rejection without a reason is impossible». The
        reason is required by this route and is a required argument of the
        service behind it, so there is no path by which a refusal is recorded
        without one.

        The applicant is told the reason.
      operationId: rejectGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRejectionInput'
      responses:
        '200':
          description: Refused, with the reason on the request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guest-requests/{guestRequest}/cancellation:
    post:
      tags: [Guest requests]
      summary: Withdraw one's own guest request
      description: >-
        The author, and nobody else. A member of staff who wants a visit
        stopped refuses it, which leaves a reason and an author on the row; a
        cancellation by staff would close the request with a record saying the
        resident changed their mind.
      operationId: cancelGuestRequest
      parameters:
        - $ref: '#/components/parameters/GuestRequestId'
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request has already run its course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'

  /checkpoint/verify:
    post:
      tags: [Checkpoint]
      summary: Find a guest at the security post
      description: |
        FR-18. **This route changes nothing.** §3.5.1 splits verification from
        the entry deliberately: `verify` reads and renders the card for
        comparison with the document in the officer's hand, `check-in` changes
        state. The split lets the officer refuse entry without leaving a false
        record of an entry that never happened.

        **A POST all the same.** A surname and a visit code are personal data
        of somebody standing at the desk; a GET would put them in the query
        string, and a query string is written to every access log between the
        terminal and the application, cached by the browser, and left in the
        address bar of a screen that faces the lobby. `meta.read_only` says in
        the body what this paragraph says here.

        Search is by **code or surname**, never by document number: the column
        is encrypted and cannot be indexed, the QR carries the code, and FR-18
        asks for no more. A surname search is scoped to the current day — the
        post is looking for somebody in front of it, not through the archive.

        The card carries FR-18's five fields — guest, inviting resident, room,
        departure deadline, status — and the verdict on admission beside them,
        so the screen cannot offer a button the server would refuse.
      operationId: verifyGuestAtCheckpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointSearchInput'
      responses:
        '200':
          description: One card per match.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckpointCard'
                  meta:
                    type: object
                    properties:
                      matches: { type: integer }
                      read_only:
                        type: boolean
                        description: Always true. The route records a lookup and changes nothing else.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Nothing in this dormitory answers to that code or surname. A
            distinct answer from an empty list, because a terminal must not
            show «no such code» and «none today» the same way — and the two
            misses are told apart in `message`, since they are not the same
            news at the desk.
          content:
            application/json:
              schema:
                type: object
                required: [message, data, meta]
                description: >-
                  The shape of the 200 with a `message` added, so that one
                  parser reads both answers and the officer has a sentence to
                  read off the screen.
                properties:
                  message: { type: string }
                  data:
                    type: array
                    maxItems: 0
                    items:
                      $ref: '#/components/schemas/CheckpointCard'
                  meta:
                    type: object
                    properties:
                      matches: { type: integer, enum: [0] }
                      read_only: { type: boolean }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /checkpoint/check-in:
    post:
      tags: [Checkpoint]
      summary: Record a guest's entry
      description: |
        FR-19. The entry is written, the request moves to `in_progress`, and
        the departure deadline is **frozen** on the visit — the earlier of the
        end of the approved interval and the building's control time. Freezing
        it is what keeps the register's verdict on last week from changing when
        somebody edits a column today.

        **The system restricts nobody's movement.** FR-20 says so and §2.4.2
        explains why: the ground for refusing a person entry to a dormitory is
        the university's local act and the action of the security service, not
        a program. What this route refuses is a *record* — it will not assert
        that an entry was within the rules when the interval says it was not.

        `override_reason` is §2.4.2's «admit on the responsible officer's
        decision». It is required when the refusal is one that may be set aside
        — an entry outside the permitted interval, or on the wrong day — and is
        ignored otherwise. An override is recorded twice: on the visit, and as
        `checkpoint.admitted_on_decision` in the audit log, so that «show me
        every entry admitted against the interval» is one query.

        A refusal writes `checkpoint.entry_refused` to the log. §3.9.6 names it
        among the events the log must hold: a guest turned away leaves no visit
        row, so without it the evening would hold no record of them at all.
      operationId: checkInGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInInput'
      responses:
        '201':
          description: The entry is recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestVisit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: >-
            The rules admit no entry as things stand. `reason_code` says which
            refusal it is and `override_available` whether the officer's
            decision may set it aside.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryNotPermittedError'

  /checkpoint/check-out:
    post:
      tags: [Checkpoint]
      summary: Record a guest's exit
      description: |
        FR-19, and FR-21's immutability behind it.

        The time is the server's and is never taken from the body: an exit time
        a client could name is an exit time a client could choose, and the
        register stands as evidence of what happened rather than of what was
        typed.

        The visit closes as `closed` or `closed_late`, judged against the
        deadline frozen at the entry. The exit is written **once**: the service
        refuses a second one with 409, the database refuses it with a
        write-once trigger, and a mistake is put right by a correcting entry
        (`POST /guest-visits/{guestVisit}/correction`) and never by an
        overwrite.
      operationId: checkOutGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutInput'
      responses:
        '200':
          description: The exit is recorded and the request is completed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GuestVisit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The exit on this visit is already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitAlreadyClosedError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/visit-register:
    get:
      tags: [Visitor register]
      summary: The visitor register over a period
      description: |
        FR-21 and §3.9.6. The journal clause 2.1.2 of the HSE rules of internal
        order makes the security service keep by hand — guest, time of arrival,
        time of departure, premises, whom they are visiting — plus the officers
        who recorded the entry and the exit, which a paper page carried by
        existing and an electronic one has to say in words. The details of the
        document are the one thing the clause asks for that the register no
        longer keeps.

        Available to the administrator and to the warden of the building
        concerned, and to nobody else. Reading it is itself an audited action.
        There is no file to download: the register is read where it lives.

        Corrections travel with the rows they correct: a register that showed
        the entries and hid the corrections would present a record it does not
        itself stand behind.

        The period is taken against the **entry**: a guest admitted at 23:50 on
        the 30th and recorded leaving at 00:20 belongs to the 30th, which is
        the day the officer would have written them down on.
      operationId: listVisitRegister
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - name: from
          in: query
          required: false
          description: First day of the period, inclusive. Defaults to the first of the current month.
          schema: { type: string, format: date }
        - name: until
          in: query
          required: false
          description: Last day of the period, inclusive. Defaults to today.
          schema: { type: string, format: date }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          description: Rows per page. Capped at 100; a larger value is a 422.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: One page of the register.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitRegisterEntry'
                  meta:
                    type: object
                    properties:
                      building_id: { type: integer, format: int64 }
                      from: { type: string, format: date }
                      until: { type: string, format: date }
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guest-visits/{guestVisit}/correction:
    post:
      tags: [Visitor register]
      summary: Record a correcting entry against a visit
      description: |
        FR-21, second criterion: «entries are immutable; a correction is made
        as a correcting entry».

        This route writes **nothing** to the visit. It writes a row to the
        audit log naming it, and the register carries the two side by side —
        which is what a numbered paper journal gives and an editable row does
        not.

        The correction is free text and has to say something. There is no
        structured «change this field to that value», and that is the point: a
        correction that could be applied would be an edit with extra steps.

        Recording the exit and correcting the record are different rights. The
        post records the exit; the correction asks for the register capability,
        so an officer who mistyped a time reports it and the correcting entry
        carries the name of whoever wrote it.
      operationId: correctGuestVisit
      parameters:
        - $ref: '#/components/parameters/GuestVisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correction]
              properties:
                correction:
                  type: string
                  minLength: 3
                  maxLength: 2000
      responses:
        '201':
          description: The correcting entry is recorded; the visit is unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      guest_visit_id: { type: integer, format: int64 }
                      correction: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'


  /maintenance-requests:
    get:
      tags: [Maintenance]
      summary: The caller's own maintenance requests
      description: |
        FR-36. **The route takes no parameter by which one person could name
        another**, and that absence is the protection: the list is filtered by
        the identifier of the token. The warden's queue is a different route, a
        sub-resource of the building, decided on the building object.

        Two lists and one parameter to choose between them, the same division
        the warden's queue has: the open requests, and the archive of the ones
        that are finished with.
      operationId: listMyMaintenanceRequests
      parameters:
        - name: scope
          in: query
          required: false
          description: >-
            `open` (the default) for the requests still somebody's work,
            `archive` for the closed and rejected ones.
          schema: { type: string, enum: [open, archive], default: open }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of the caller's own requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceRequest'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Maintenance]
      summary: File a maintenance request
      description: |
        FR-36, `multipart/form-data` because of the photographs.

        **The room is never in the body.** For `location: own_room` the request
        is bound to the room of the submitter's *active residency record*, read
        from the housing register — a client that could name the room could name
        somebody else's. A common area has no row in the register, so it is
        named in words through `location_note`, and `room_id` comes back null.

        **A resident without an active residency record cannot file**, and the
        answer is 403 rather than 422: nothing about the body is wrong. The
        check is a policy question put to the register, and the same 403 answers
        a resident of block A filing against block B.

        Up to three photographs. The ceiling is configuration, is stated by this
        route's validation as a 422 naming `photos`, and is stated again as a
        CHECK constraint in the database.

        On success the request is created in `submitted`, the first row of its
        work log is written in the same transaction with a null `from_status` —
        the request did not move, it came into being — and the staff who triage
        in that dormitory are notified after the commit.
      operationId: fileMaintenanceRequest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestInput'
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Filed, with the room resolved from the register and the history opened.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The account holds no active residency record in that dormitory, so
            it is not a resident of it today (FR-36, second criterion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/PhotographNotStored'

  /maintenance-requests/{maintenanceRequest}/photos/{index}:
    get:
      tags: [Maintenance]
      summary: One photograph of a maintenance request
      description: |
        FR-36's photographs, read back one at a time — **the route the schema of
        `MaintenanceRequest` has always described and that did not exist until
        the acceptance of 15.09.2026**. `photo_paths` carries paths and not URLs
        because a signed URL is stale by the time somebody scrolls to it; the
        client asks for a link when it is about to draw the image, and this is
        where it asks.

        **The answer is the image itself**, streamed, with the photograph's own
        content type. It is not a signed link, which is what an earlier reading
        of this schema had in mind: the object store is signed for under a name
        that exists only inside the deployment's own network, and SigV4 covers
        the Host header, so a link cannot be followed from a browser and cannot
        be rewritten for one either. Streaming works unchanged on every disk,
        and it keeps the photograph behind the same token as the record.

        The authorisation is `view` on the request itself: whoever may read the
        card may see the picture on it, and a request of another dormitory is
        403. `index` is the position in `photo_paths`; a path in the URL would
        be a path a client could edit.
      operationId: showMaintenanceRequestPhoto
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
        - name: index
          in: path
          required: true
          description: Position of the photograph in `photo_paths`, counted from zero.
          schema: { type: integer, minimum: 0, maximum: 2 }
      responses:
        '200':
          description: The photograph, streamed with its own content type.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            No such request, no photograph under that index, or a path on the
            record with no object behind it in the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /maintenance-requests/{maintenanceRequest}:
    get:
      tags: [Maintenance]
      summary: One maintenance request with its history
      description: |
        The resident who filed it always reads it; the staff of that dormitory
        read it if their capability covers the queue. Another resident of the
        same dormitory does not — a defect in somebody's room is not theirs.

        The card carries `work_log`, which is where the reason for a refusal and
        the comment on each move actually live (§3.4.1, decision 6). There is no
        `rejection_reason` on the request itself to disagree with the history.
      operationId: showMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      responses:
        '200':
          description: The request, with the history and the photographs' paths.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /maintenance-requests/{maintenanceRequest}/accept:
    post:
      tags: [Maintenance]
      summary: Accept a request into work, with a planned completion date
      description: |
        FR-37. **The warden or the manager of this dormitory**, and nobody else:
        not the duty officer, who decides on guest requests and has nothing to
        do with these; not the administrator, who reads every queue and promises
        no dates; and never the resident who filed it.

        «Acceptance without a planned completion date is impossible» — so
        `target_date` is required by this route, is a required argument of the
        service behind it, and is a CHECK constraint on the table. A date
        already in the past is refused: the resident is told that date the
        moment this succeeds.

        `assigned_to` and `urgency` are optional. FR-37 names a responsible
        party and a reassignment of priority beside the date; a dormitory whose
        warden does the work himself has nobody else to name, and a required
        field would be filled in with his own name on every row.

        The resident is notified, and the message carries the planned date.
      operationId: acceptMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceAcceptanceInput'
      responses:
        '200':
          description: Accepted, with the planned date on the request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The request is no longer `submitted` — usually because a second
            member of staff moved it first. The body names the state it is in
            and the state that was asked for (FR-38).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/reject:
    post:
      tags: [Maintenance]
      summary: Refuse a request, with a stated reason
      description: |
        FR-37, first criterion: «rejection without a reason is impossible». The
        reason is required by this route and is a required argument of the
        service behind it, so there is no path by which a refusal is recorded
        without one.

        The reason is stored as the comment of the work-log row this transition
        writes, and not as a column on the request (§3.4.1, decision 6).

        Only a `submitted` request can be refused. A request already taken into
        work and then found to be somebody else's business is not withdrawn
        afterwards — FR-38's graph has no such edge.
      operationId: rejectMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRejectionInput'
      responses:
        '200':
          description: Refused, with the reason in the history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is no longer `submitted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/start:
    post:
      tags: [Maintenance]
      summary: Report that the work has begun
      description: |
        FR-38, `accepted → in progress`. The staff who triage in this dormitory.

        FR-38's chain is kept strict: there is no `accepted → completed` edge,
        so work cannot be reported complete on a request nobody started. The
        convenience is real — a dripping tap is mended before anybody would
        press a second button — and it is refused because the graph is the
        requirement's, and because the history would otherwise have no answer to
        «when was it begun».
      operationId: startMaintenanceWork
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: In progress.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/completion:
    post:
      tags: [Maintenance]
      summary: Report the work done — which does not close the request
      description: |
        FR-38, `in progress → completed`, and the line the whole module turns
        on (§3.5.2): **the request is closed by the person who reported it, not
        by the person who fixed it**. A status set by whoever did the work
        proves nothing; confirmation by the resident produces a two-sided
        record.

        So `completed` is a waiting state and not an ending. The only ways out
        of it are the reporter's word — `/confirmation` or `/reopening` — and
        the clock, which closes the request after the configurable window of
        FR-39 and marks it as automatically closed.

        `completed_at` is rewritten on each completion, which is what restarts
        the confirmation window after a reopening.
      operationId: completeMaintenanceWork
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: Completed, and waiting for the reporter.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not `in_progress`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/confirmation:
    post:
      tags: [Maintenance]
      summary: The reporter confirms the work and the request closes
      description: |
        FR-39. **The reporter, and nobody else** — not the warden who accepted
        it, not the manager who marked it complete, not the administrator. This
        is not a capability some role holds over a class of objects; it is the
        fact that one particular person filed one particular request, so the
        policy is an identity comparison.

        A warden who believes a resident unreasonable does not close the request
        over their head: the confirmation window runs out and the request closes
        marked `auto_closed`, which is a different and honest record.

        On success `confirmed_at` is set and `auto_closed` stays false. A CHECK
        constraint refuses a row that claims both.
      operationId: confirmMaintenanceWork
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: Closed, on the reporter's word.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The account is not the person who filed this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not `completed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /maintenance-requests/{maintenanceRequest}/reopening:
    post:
      tags: [Maintenance]
      summary: The reporter says the defect is not fixed
      description: |
        FR-39, first criterion: «reopening within the configurable window
        returns the request to accepted and increments a reopen counter».

        Back to `accepted` and not to `submitted`, which is the requirement's
        word and the right one: the dormitory has already agreed the defect is
        theirs and has already named a date. The planned date stays on the row —
        it is now visibly missed, which is what FR-40's overdue flag is for.

        The reason is optional. FR-37 makes a refusal without one impossible and
        FR-39 makes no such demand; the resident who has already waited through
        one repair is the wrong person to put a form in front of. The history
        gets a sentence either way.

        **Two different 409s.** The request is not `completed` at all — the
        state machine refuses it. Or it is completed and the window has run out
        before the nightly pass reached the row: what has expired is the clock
        rather than the state, which no transition table can express, so the
        body carries `confirmation_window_days` and `window_closed_on` instead
        of two statuses.
      operationId: reopenMaintenanceRequest
      parameters:
        - $ref: '#/components/parameters/MaintenanceRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCommentInput'
      responses:
        '200':
          description: Back to `accepted`, with the reopen counter one higher.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The account is not the person who filed this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Either the request is not `completed`, or the confirmation window
            has closed. The two are told apart by the fields the body carries.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IllegalTransitionError'
                  - $ref: '#/components/schemas/ConfirmationWindowClosedError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /buildings/{building}/maintenance-queue:
    get:
      tags: [Maintenance]
      summary: The maintenance queue of one dormitory, and its archive
      description: |
        FR-40. The warden or the manager of this dormitory, and the
        administrator, who reads every queue — FR-40 names the campus
        directorate among the people the queue is for.

        **A sub-resource of the building, and that is the whole of the
        horizontal boundary.** The dormitory is a path parameter, the policy
        decides on the object, and every query begins from it: there is no code
        path in which a request of another dormitory is in the result set to be
        filtered out afterwards. A warden of block 1 asking for block 2 is 403,
        recorded as `access.denied`.

        **Two lists and one parameter to choose between them.** The default is
        the open requests, because FR-40's fourth criterion says the warden sees
        «all open requests» and a screen opening on three years of closed ones
        would be a different screen; `scope=archive` is that other screen. Every
        request is in exactly one of the two, so none can be lost between them.

        The status, category, age, overdue and period filters are gone, and so
        is the CSV export they were read by. None of them was the question a
        warden asks of a queue.

        The queue is ordered the way a queue is worked — most pressing urgency
        first, oldest first inside one urgency. Sorting by age alone would bury
        an emergency reported this morning under a wobbly chair from March. The
        archive is ordered newest first: nobody works an archive.

        **`age_days` is counted from submission and from nothing else**, as the
        Gherkin of §2.4.3 words it. Restarting the clock on acceptance would
        measure the warden rather than the wait.

        **`overdue` is configuration and not code** (FR-40, second criterion).
        A request is overdue when its planned completion date has passed — a
        promise broken to a named resident — or when it is older than the
        configured threshold, which catches the request nobody has triaged at
        all and has no date to be late against. Changing the setting changes the
        flag and the nightly digest together, with no code edit.
      operationId: showMaintenanceQueue
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - name: scope
          in: query
          required: false
          description: >-
            `open` (the default) for the requests still somebody's work,
            `archive` for the closed and rejected ones.
          schema: { type: string, enum: [open, archive], default: open }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of the queue, or of the archive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceQueuePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /lost-found:
    get:
      tags: [Lost and found]
      summary: The finds of the caller's own dormitory
      description: |
        FR-25. **The route takes no building parameter**, and that absence is
        the first acceptance criterion: the dormitories are computed from the
        grants of the token, so there is no way to phrase a request for another
        one. The boundary is a missing parameter rather than a policy somebody
        has to remember to call — the same arrangement the announcement feed
        and the notification routes are built on. The administrator's grant
        names no dormitory and is therefore not confined to one.

        **The default is `published` alone, which is what «the published list»
        means.** FR-26's second criterion — «a declined claim returns the find
        to the published list» — only says something if a claimed entry is not
        in that list, so it is not; a claimed entry is read by asking for it
        with `status=claimed`.

        **`resolved` is not a value this route takes.** FR-26's third criterion
        is «after closure the record disappears from the public list», so the
        value is refused as a 422 naming the field rather than accepted and
        answered with an empty page a client would have to interpret. The
        person who published an entry still reads it at
        `GET /lost-found/{id}` after it has closed: it has left the feed and
        not the application.

        A resident whose residency record has ended stops reading that
        dormitory's feed on the stated date (FR-05).
      operationId: listLostFound
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            `published` (the default) or `claimed`. Any other value is 422,
            including `resolved`.
          schema:
            type: string
            enum: [published, claimed]
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LostFoundItemKind'
        - name: search
          in: query
          required: false
          description: A substring of the object or of the place it turned up.
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: >-
            One page of the feed, newest find first — by the day of the finding
            rather than by the day of the entry, which is the date the reader is
            shown.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LostFoundItem'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Lost and found]
      summary: Publish a find
      description: |
        FR-24, `multipart/form-data` because of the photograph.

        **The entry is in the feed the moment this answers 201.** FR-24's
        fourth criterion is «publication passes through no staff approval
        step», and §2.5.4 gives the reason: routing every find through a member
        of staff would put back the delay the module exists to remove. There is
        no moderation state in the vocabulary for an entry to wait in, and no
        field on this form by which one could be asked for.

        **The reporter is never in the body.** The record is bound to the
        publishing account as the finder (FR-24, second criterion); a client
        that could name a reporter could publish in somebody else's name. The
        identifier is not in the response either — see `LostFoundItem`.

        **`custody` says which of §2.5.4's two paths the find took.** The
        default is `finder`: the object stays with the resident who found it,
        who hands it over in person and decides on claims. `administration` is
        an object handed in at the security post or deposited for safekeeping —
        the case Civil Code art. 227 cl. 1 para. 2 addresses, in which the
        person representing the owner of the premises acquires the rights and
        bears the duties of the finder — and only an account holding the
        capability in that dormitory may assert it. A resident sending it gets
        403: nothing about the value is malformed, and it is the account that
        may not make that statement about the university.

        **`declared_on` is offered and required on neither path.** It is the day
        the find was declared to the police or to a local self-government body
        (art. 227 cl. 2), null while nothing has been declared. The six-month
        period of art. 228 cl. 1 runs from it and never from the registration.
        FR-27 counts those days and is outside the MVP; the field is here
        because a declaration date cannot be retrofitted onto records created
        without one.

        Who may publish: anybody whose residency record in that dormitory is
        current, and any account holding the safekeeping capability there. A
        resident of block A publishing into block B gets 403.
      operationId: publishLostFoundItem
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LostFoundItemInput'
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: >-
            Published, in status `published`, and in the feed of that dormitory
            straight away. Recorded in the audit log as
            `lost_found_item.published`, with the path the find took and the
            declaration date in the payload.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The account neither lives in that dormitory nor holds the
            safekeeping capability there — or it sent `custody=administration`
            without holding that capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/PhotographNotStored'

  /lost-found/{lostFoundItem}/photo:
    get:
      tags: [Lost and found]
      summary: The photograph of one find
      description: |
        FR-24's photograph, read back — **the route the schema of
        `LostFoundItem` has always described and that did not exist until the
        acceptance of 15.09.2026**. `photo_path` carries a path and not a URL
        because a signed URL is stale by the time somebody scrolls to it; the
        client asks for a link when it is about to draw the image, and this is
        where it asks.

        **The answer is the image itself**, streamed, as it is for a maintenance
        request's photographs and for the same reason: a presigned link cannot
        be followed from a browser on a deployment whose object store is signed
        for under an internal name.

        No index, unlike the maintenance module's: FR-24 says «the photograph»
        in the singular and the column holds one path. An entry published
        without one is 404 rather than an empty answer a client would have to
        tell apart from a link.

        The authorisation is `view` on the entry — FR-25's own question, so a
        find of another dormitory is 403. The picture carries no more than the
        card does, and the card has never said who published it.
      operationId: showLostFoundItemPhoto
      parameters:
        - $ref: '#/components/parameters/LostFoundItemId'
      responses:
        '200':
          description: The photograph, streamed with its own content type.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            No such entry, no photograph on it, or a path on the record with no
            object behind it in the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lost-found/{lostFoundItem}:
    get:
      tags: [Lost and found]
      summary: One find, without the person who published it
      description: |
        FR-25, second criterion: **the card displays neither the name nor the
        contacts of the registering user**. There is no `reporter_id`, no
        `reporter_name`, no telephone and no e-mail anywhere in this response.

        The omission lives in the API Resource and not in the query. The
        service needs `reporter_id` to answer «whose decision is this» and the
        policy needs it to let the publisher read their own closed entry, so a
        query that did not select it would break the module; a Resource that
        never serialises the column cannot leak it through a later change to
        the query. §3.5.3 gives the reason it matters: a feed read by several
        hundred people with a name beside every entry is a directory of who
        found what and lives where.

        Who reads it: anybody attached to that dormitory, the person who
        published it — in any state, including after closure — and anybody
        whose claim is on it.

        `claim_count` says how many claims the entry carries and never what any
        of them says; the marks are read at
        `GET /lost-found/{id}/claims` by the three people party to them.
      operationId: showLostFoundItem
      parameters:
        - $ref: '#/components/parameters/LostFoundItemId'
      responses:
        '200':
          description: The card, with no registering user in it.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lost-found/{lostFoundItem}/claims:
    get:
      tags: [Lost and found]
      summary: The claims made against one find
      description: |
        FR-26. The person who has to answer them — the finder on the ordinary
        path, the staff of the dormitory for an object deposited with them —
        and the warden or manager who may be asked to review a refusal. Another
        resident of the same dormitory gets 403: the identifying marks are the
        one thing that makes a claim checkable, and a list of them readable by
        everybody would tell the next claimant exactly what to write.
      operationId: listLostFoundClaims
      parameters:
        - $ref: '#/components/parameters/LostFoundItemId'
      responses:
        '200':
          description: The claims of this entry, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LostFoundClaim'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Lost and found]
      summary: Claim a find
      description: |
        FR-26: «the resident submits a claim describing identifying features».

        **A claim on one's own entry is 422 and not 403**, and the difference is
        deliberate: the account may claim any number of other finds, so nothing
        about its rights is in question — what is wrong is the object the
        request names, and the body says which. A 403 would also be written to
        the audit log as an access denial, which this is not. A notice of a
        loss is refused the same way: a claim is «that is mine», and the author
        of a loss is holding nothing.

        One person holds one outstanding claim per entry. A second attempt
        while the first is unanswered is 422; a claim that has been settled
        does not block a later one.

        The first claim moves the entry from `published` to `claimed`; a second
        leaves it where it is, because several claims may coexist (§3.5.5). A
        claim on an entry that has gone home is 403.

        The person holding the object is notified, with the marks and without
        the claimant's contacts.
      operationId: claimLostFoundItem
      parameters:
        - $ref: '#/components/parameters/LostFoundItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LostFoundClaimInput'
      responses:
        '201':
          description: Filed, in status `new`, and the entry is now `claimed`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundClaim'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The entry has been closed as returned since the page was drawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /lost-found/claims/{lostFoundClaim}/accept:
    post:
      tags: [Lost and found]
      summary: Accept a claim, naming where the object changes hands
      description: |
        FR-26, §2.4.4, first scenario. **The person holding the object, and
        nobody else** — the finder on the ordinary path, the staff of the
        dormitory for an object deposited with them. Not another resident, not
        the claimant, and not the warden, whose one way into a claim is a
        referral. §2.5.4: the module is peer-to-peer and a member of staff
        deciding an ordinary claim would be the moderation step it was built to
        do without.

        «The claimant is notified with the handover point» — so
        `handover_point` is required, is a required argument of the service
        behind it, and is a CHECK constraint on the table. It is the one piece
        of location this module ever publishes, and it is a place the person
        holding the object chose.

        **The entry is not closed by this.** It stays `claimed` until the object
        actually changes hands and somebody says so at
        `POST /lost-found/{id}/resolve`. An acceptance that closed the entry
        would be the system recording a handover that had not happened.
      operationId: acceptLostFoundClaim
      parameters:
        - $ref: '#/components/parameters/LostFoundClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LostFoundAcceptanceInput'
      responses:
        '200':
          description: Accepted, with the handover point on the claim and in the notification.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundClaim'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The claim has already been answered, or **the entry has been
            closed** — the object went home on somebody else's claim while this
            page was open. The second of those used to answer 200 (acceptance
            of 15.09.2026), and the claimant was told where to collect an
            umbrella that had left the building two days earlier. The body then
            names the entry's states (`resolved`, `claimed`) rather than the
            claim's, because what has moved on is the find.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /lost-found/claims/{lostFoundClaim}/decline:
    post:
      tags: [Lost and found]
      summary: Decline a claim
      description: |
        FR-26, §2.4.4, second scenario. The same circle as the acceptance: the
        person holding the object.

        «The find returns to the published list» — and §3.5.5 says when: «the
        entry returns to Published if none of them is confirmed». So with two
        claims on the table the first refusal changes nothing about the entry
        and the second puts it back.

        **The reason is optional, and that is a decision.** FR-37 makes a
        refusal without a reason impossible for a maintenance request; FR-26
        makes no such demand of a claim, and a required field here would be a
        rule the requirement does not carry, put in front of a resident who is
        doing the dormitory a favour by answering at all. What the requirement
        puts in its place is the offer below.

        The claimant is notified, and `may_be_referred` comes back true: FR-26
        gives them the option of putting the refusal to the warden.
      operationId: declineLostFoundClaim
      parameters:
        - $ref: '#/components/parameters/LostFoundClaimId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LostFoundDeclineInput'
      responses:
        '200':
          description: >-
            Declined. The entry is back in the published list if nothing else is
            outstanding on it.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundClaim'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The claim has already been answered, or the entry has been closed —
            an entry that has gone home admits no decision on any claim against
            it, in either direction. The body then names the entry's states
            rather than the claim's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /lost-found/claims/{lostFoundClaim}/referral:
    post:
      tags: [Lost and found]
      summary: Refer a refused claim to the warden
      description: |
        FR-26: «a claim the two sides cannot settle is referred to the warden,
        who decides». **The claimant's own route**, and the first of §2.5.4's
        two occasions for a member of staff. Nobody refers on somebody else's
        behalf — not the person whose refusal is under review, and not the
        warden, who would then be handing themselves a case.

        A claim may be referred once. A second attempt is 409, and so is a
        referral of a claim nobody has answered: the warden gets «a claim the
        two sides cannot settle», and two sides that have not spoken have not
        failed to settle anything.

        **The referral moves the entry back to `claimed`.** The refusal that
        has to precede it already returned the find to the published list —
        FR-26's second criterion — and the referral makes that claim
        outstanding again, so the entry leaves the feed for the length of the
        disagreement: offering the object to somebody else while the warden is
        still looking at it is what the status prevents. The entry stays in
        `claimed` if the warden upholds the claim, for the holder to close, and
        returns to `published` if the warden does not.
      operationId: referLostFoundClaim
      parameters:
        - $ref: '#/components/parameters/LostFoundClaimId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LostFoundReferralInput'
      responses:
        '200':
          description: Referred. The warden and the manager of that dormitory are notified.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundClaim'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The claim is not one that can go to the warden: it has not been
            refused, or it has already been referred once, or the find has
            already gone home on somebody else's claim — a closed entry cannot
            be taken out of the feed again, and there is nothing left to
            dispute. In that last case `status` and `attempted_status` carry
            the entry's states (`resolved`, `claimed`) rather than the claim's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /lost-found/claims/{lostFoundClaim}/decision:
    post:
      tags: [Lost and found]
      summary: The warden's decision on a referred claim
      description: |
        FR-26, first criterion: «a warden's decision on a referred claim». The
        second of §2.5.4's two occasions for a member of staff, and the only
        decision in the module taken over the head of the person holding the
        object.

        **The warden or the manager of that dormitory, and nobody else** — not
        the security officer, who keeps objects and settles nothing; not the
        administrator, for the reason they are outside `guest-requests/approve`;
        not the person whose refusal is under review; not the claimant.

        The last of those was asserted here and enforced nowhere until the
        acceptance of 15.09.2026: a manager could claim a find, wait to be
        refused, refer his own refusal and uphold it, leaving
        `claimant_id == decided_by` on the row. A claimant asking for this now
        gets 403 — the claim is perfectly decidable, by somebody who is not a
        party to it.

        **Only a referred claim.** A claim nobody referred is 409, not 403: the
        caller holds the capability perfectly well and what is missing is the
        referral that would have put the decision in their hands. There is no
        route by which a member of staff reaches an ordinary claim at all.

        **`upheld` is a boolean and not two routes**, which is where this module
        departs from the shape the guest and maintenance modules use. There,
        approve and reject are separate acts with separate bodies; here it is
        one act — the warden read the claim, the refusal and the marks, and says
        which of the two residents is right — and the body is the same either
        way. `note` is required in both directions, because a decision that
        overrides a person entitled to make it is one nobody can answer if
        nobody explained it.

        **Upholding does not close the entry either.** It makes the claim
        `accepted`, which is the ground FR-26's first criterion admits for a
        closure; the closure itself is still the act of the person handing the
        object over.
      operationId: decideLostFoundClaim
      parameters:
        - $ref: '#/components/parameters/LostFoundClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LostFoundDecisionInput'
      responses:
        '200':
          description: >-
            Decided, and in the audit log as
            `lost_found_claim.decided_by_staff`. Both the claimant and the
            person holding the object are told.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundClaim'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The claim was never referred, it has already been decided, or the
            entry has been closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllegalTransitionError'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /lost-found/{lostFoundItem}/resolve:
    post:
      tags: [Lost and found]
      summary: Mark a find returned to its owner
      description: |
        FR-26, §2.4.4: «when the finder then marks the item returned, the status
        becomes resolved with the time and the record no longer appears in the
        public list of available finds».

        **The «only» of FR-26's first criterion lives here.** A find closes as
        returned on a claim the finder accepted or on a warden's decision on a
        referred one, and both of those arrive at one place — a claim in status
        `accepted`. An entry nobody has claimed, or one whose claims are all
        outstanding, is 409 with the number of claims still waiting.

        The route belongs to the person holding the object and to nobody wider.
        A warden who upheld a referred claim has made the closure *admissible*
        and has not performed it: the closure records that an object changed
        hands, and the only person who can know that it did is the person who
        handed it over.
      operationId: resolveLostFoundItem
      parameters:
        - $ref: '#/components/parameters/LostFoundItemId'
      responses:
        '200':
          description: >-
            Closed, with `resolved_at` set, and out of the public list. In the
            audit log as `lost_found_item.resolved`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LostFoundItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            No claim on the entry has been accepted, so there is no ground on
            which FR-26 admits the closure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoAcceptedClaimError'


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The plain-text token returned by `POST /auth/login`, issued by Laravel Sanctum.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: The page of a paged list, counted from one.
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      description: >-
        Rows per page. The default is twenty and the ceiling a hundred; a larger
        figure is refused rather than silently lowered.
      schema: { type: integer, minimum: 1, maximum: 100 }
    BuildingId:
      name: building
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RoomId:
      name: room
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResidencyId:
      name: residency
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResidentId:
      name: resident
      in: path
      required: true
      description: The account the card belongs to.
      schema: { type: integer, format: int64, minimum: 1 }
    StaffUserId:
      name: user
      in: path
      required: true
      description: The account whose role is being revoked.
      schema: { type: integer, format: int64, minimum: 1 }
    NotificationId:
      name: notification
      in: path
      required: true
      description: >-
        The identifier of one message. A UUID, and not a sequence: the
        identifier travels to the client, and a guessable one would let a
        stranger probe for the existence of other people's messages.
      schema: { type: string, format: uuid }
    GuestRequestId:
      name: guestRequest
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MaintenanceRequestId:
      name: maintenanceRequest
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    LostFoundItemId:
      name: lostFoundItem
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    LostFoundClaimId:
      name: lostFoundClaim
      in: path
      required: true
      description: >-
        The claim identifier alone: it is enough to find the entry, and a path
        that repeated the entry too would invite a client to send a pair that
        does not match.
      schema: { type: integer, format: int64, minimum: 1 }
    GuestVisitId:
      name: guestVisit
      in: path
      required: true
      description: The recorded visit a correcting entry is written against.
      schema: { type: integer, format: int64, minimum: 1 }
    StaffRole:
      name: role
      in: path
      required: true
      description: >-
        The role being revoked. Only the roles the caller may grant are
        accepted; anything else is 403, and a string naming no role at all is
        422.
      schema:
        $ref: '#/components/schemas/RoleCode'

  responses:
    Unauthenticated:
      description: No token, or a token that has been revoked or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The account is authenticated but holds no role that covers this object.
        The two cases behind it are a role that is wrong for the route and a role
        that is right but held in a different building.

        Every refusal is written to the audit log as `access.denied`, with the
        account, the object and the address it came from (FR-33, §3.9.6).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The payload did not pass validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    PhotographNotStored:
      description: |
        The object store would not take a photograph the request carried, so
        the request was refused and nothing was written.

        **The route used to answer 201 here** (acceptance of 15.09.2026), with
        the record created and the photographs missing from it. A refused write
        came back from the driver as a `false`, the store dropped the path and
        nobody noticed; a resident could not tell that answer from a submission
        they had forgotten to attach anything to. A photograph is evidence — the
        warden triages on it — so a submission that loses one is not a
        submission that succeeded.

        503 and not 500 or 422: the body was well formed, the caller was
        entitled to send it, and the same call succeeds unchanged once the store
        is back. There is nothing to undo before retrying — no record was
        created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    RoleCode:
      type: string
      description: |
        The six roles of §1.1.4 as revision 2 of the role model leaves them.

        `admin` holds the register of dormitories and is the one role granted
        over the system as a whole. `warden` heads one dormitory: he appoints
        his own staff and does everything `manager` does. `manager` is the
        register work of that dormitory — rooms, places, moving in and out,
        resident cards and accounts — and no appointments at all.
        `duty_officer` approves guest requests, `security` checks the guest at
        the entrance, `student` lives there.

        The colloquial Russian word for a porter-caretaker is used nowhere: the
        entrance function belongs to the security service.
      enum: [admin, duty_officer, warden, manager, security, student]

    UserStatus:
      type: string
      enum: [active, blocked, archived]

    AuditAction:
      type: string
      enum:
        - auth.login_succeeded
        - auth.login_failed
        - auth.login_locked
        - auth.login_blocked
        - auth.logout_succeeded
        - access.denied
        - building.viewed
        - building.users_viewed
        - audit_log.viewed
        - building.created
        - building.updated
        - building.deleted
        - building.deletion_blocked
        - building.rooms_viewed
        - room.created
        - room.updated
        - room.update_refused
        - bed.created
        - bed.creation_refused
        - residency.assigned
        - residency.assignment_refused
        - residency.terminated
        - resident.card_viewed
        - staff.appointed
        - staff.revoked
        - resident.account_issued
        - auth.password_set
        - guest_request.submitted
        - guest_request.approved
        - guest_request.rejected
        - guest_request.cancelled
        - guest_request.expired
        - guest_request.decision_refused
        - checkpoint.guest_verified
        - checkpoint.entry_recorded
        - checkpoint.entry_refused
        - checkpoint.admitted_on_decision
        - checkpoint.exit_recorded
        - guest_visit.overdue
        - guest_visit.corrected
        - visit_register.viewed
        - maintenance_request.accepted
        - maintenance_request.rejected
        - maintenance_request.reopened
        - maintenance_request.auto_closed
        - maintenance_request.overdue
        - maintenance_request.reopening_refused
        - announcement.published
        - lost_found_item.published
        - lost_found_claim.filed
        - lost_found_claim.accepted
        - lost_found_claim.declined
        - lost_found_claim.referred
        - lost_found_claim.decided_by_staff
        - lost_found_item.resolved

    AuditResult:
      type: string
      enum: [success, failure, denied]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 255
          description: |
            The secret the configured identity provider verifies. With the default
            provider that is the account password; behind a university SSO it is
            whatever that provider accepts, and the field keeps its name.

    IssuedToken:
      type: object
      required: [token, token_type, identity_provider, user]
      properties:
        token:
          type: string
          description: >-
            Send it in the Authorization header as a Bearer token. It is not
            retrievable afterwards.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Null when the token expires only on sign-out.
        identity_provider:
          type: string
          description: Which provider verified the credential.
          examples: [database]
        user:
          $ref: '#/components/schemas/User'

    RoleGrant:
      type: object
      description: |
        One role held in one scope. `building_id` null means the role is held over
        the system as a whole, which in this iteration is the administrator alone.
      required: [role, building_id]
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        role_name:
          type: string
        building_id:
          type: [integer, 'null']
          format: int64
        granted_at:
          type: [string, 'null']
          format: date-time

    User:
      type: object
      required: [id, full_name, email, status, password_change_required]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/UserStatus'
        password_change_required:
          type: boolean
          description: >-
            True while the account still owes a change — an account issued under
            FR-42 whose resident is still signing in with the password the
            office printed for them. It says that much and carries no secret;
            replacing the password at `POST /auth/password` clears it.
        roles:
          type: array
          description: Present when the grants were loaded for this response.
          items:
            $ref: '#/components/schemas/RoleGrant'

    Building:
      type: object
      required: [id, name, address]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        floors_count: { type: integer, minimum: 1 }
        visiting_from:
          type: string
          description: Start of the visiting window, per building (NFR-09).
          examples: ['08:00:00']
        visiting_to:
          type: string
          examples: ['23:00:00']
        guest_lead_time_hours:
          type: integer
          minimum: 0
          maximum: 720
          description: >-
            FR-16, first criterion: the notice this dormitory wants before a
            guest arrives. Zero — the default — means none, which is what the
            HSE rules of internal order say; clause 2.2 fixes the hours and is
            silent about how far ahead a resident must ask.
          examples: [0]

    RoomType:
      type: string
      description: |
        The three layouts FR-01 names. The layout belongs to the room and not to
        the dormitory as a whole, because one building routinely mixes them.
      enum: [corridor, block, apartment]

    BedStatus:
      type: string
      description: |
        `free` and `occupied` are a projection of the residency register, which is
        the authority. `blocked` is the one value the register knows nothing
        about: an administrative decision that the place takes nobody, and the
        reason the field is stored rather than computed.

        A place whose occupant leaves at midnight reads `occupied` until the
        nightly settlement runs. It never reads `free` while somebody holds it,
        and a residency written against a place that is in fact held is refused
        by the exclusion constraint whatever this field says.
      enum: [free, occupied, blocked]

    ResidencyStatus:
      type: string
      description: |
        A projection of the period, and of nothing else. A residency is `active`
        while the person is resident and `ended` once the stated departure date
        has arrived — never before it, however long ago the notice was written.
      enum: [active, ended]

    Citizenship:
      type: string
      description: |
        The closed list `citizenship` is validated against. It was a free
        string, which made «RU», «Россия» and «russian» three citizenships as
        far as any query was concerned.

        The Russian Federation, the CIS states the university admits from, and
        one bucket for everybody else. The codes are ISO 3166-1 alpha-2. The
        names to show beside them are at `GET /citizenships`.
      enum: [RU, BY, KZ, UZ, KG, TJ, AM, AZ, MD, TM, OTHER]

    BuildingInput:
      type: object
      description: |
        Fields of a dormitory. All of them are required on creation; on an edit
        send only what changes.
      properties:
        name:
          type: string
          maxLength: 255
          description: >-
            Unique across the register. A collision comes back as a 422 on this
            field, from the form rule or, in a race between two requests, from
            the unique index behind it.
        address: { type: string, maxLength: 255 }
        floors_count: { type: integer, minimum: 1, maximum: 100 }
        visiting_from:
          type: string
          description: Start of the visiting window (NFR-09), as HH:MM:SS.
          examples: ['08:00:00']
        visiting_to:
          type: string
          examples: ['23:00:00']
        guest_lead_time_hours:
          type: integer
          minimum: 0
          maximum: 720
          description: >-
            FR-16, first criterion. Hours of notice required before a visit may
            begin; zero means none. The cap is a month, past which the setting
            stops being a notice period and becomes a refusal to admit guests.
          examples: [0]

    RoomInput:
      type: object
      description: |
        Fields of a room. `number`, `floor` and `capacity` are required on
        creation; on an edit send only what changes.
      properties:
        number:
          type: string
          maxLength: 32
          description: Unique inside its building, free across buildings.
          examples: ['305']
        floor: { type: integer, minimum: 0, maximum: 100 }
        capacity:
          type: integer
          minimum: 1
          maximum: 32
          description: How many places the room may hold. The ceiling FR-02 checks against.
        type:
          $ref: '#/components/schemas/RoomType'

    Bed:
      type: object
      description: |
        One place. It carries no name: who holds it is a residency, and that is
        personal data travelling under its own policy.
      required: [id, room_id, label, status]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 16 }
        status:
          $ref: '#/components/schemas/BedStatus'
        status_label: { type: string }

    Room:
      type: object
      required: [id, building_id, number, floor, capacity, beds_count, free_places, vacant_beds]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        number: { type: string }
        floor: { type: integer }
        capacity:
          type: integer
          description: How many places the room may hold.
        type:
          $ref: '#/components/schemas/RoomType'
        type_label: { type: string }
        beds_count:
          type: integer
          description: Places registered. Never greater than `capacity`.
        occupied_beds_count:
          type: integer
          description: Places currently held.
        free_places:
          type: integer
          minimum: 0
          description: >-
            How many further places may still be **registered**: `capacity` minus
            the places registered. This is the figure the capacity rejection
            names, sent so that a client never computes its own. It is not the
            number of places somebody could move into — see `vacant_beds`.
        vacant_beds:
          type: integer
          minimum: 0
          description: >-
            How many registered places are free for somebody to move into today.
            A blocked place counts for neither this nor `occupied_beds_count`.
            A room of four places with one occupant reports `free_places: 0` and
            `vacant_beds: 3`, and the two answer different questions.
        beds:
          type: array
          description: Present when the places were loaded for this response.
          items:
            $ref: '#/components/schemas/Bed'

    Floor:
      type: object
      description: |
        One floor of a dormitory, counted. `rooms_with_free_beds` and `free_beds`
        answer different questions — a floor may have one room with four free
        places, or four rooms with one each — and a floor card shows both.
      required: [floor, rooms_count, rooms_with_free_beds, beds_count, free_beds]
      properties:
        floor: { type: integer }
        rooms_count: { type: integer, minimum: 0 }
        rooms_with_free_beds: { type: integer, minimum: 0 }
        beds_count: { type: integer, minimum: 0 }
        free_beds: { type: integer, minimum: 0 }

    ResidencyInput:
      type: object
      required: [user_id, bed_id, contract_number, moved_in_at]
      properties:
        user_id: { type: integer, format: int64 }
        bed_id:
          type: integer
          format: int64
          description: >-
            The place. It also fixes the scope: the warden or manager of the
            building this bed stands in is the one allowed to write the row.
        contract_number: { type: string, maxLength: 64 }
        moved_in_at: { type: string, format: date }

    Residency:
      type: object
      description: |
        One residency, past or present. `is_open` says no departure date has been
        written down; `is_current` says the person is resident today. A
        termination dated in the future makes the two differ — `is_open: false`
        with `is_current: true` — which is FR-05's third criterion. `is_current`
        is the one to filter a list of residents on; `status` follows it.
      required: [id, user_id, bed_id, contract_number, moved_in_at, status, is_open, is_current]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        resident_name:
          type: [string, 'null']
          description: Present when the account was loaded for this response.
        bed_id: { type: integer, format: int64 }
        bed_label: { type: [string, 'null'] }
        room_id: { type: [integer, 'null'], format: int64 }
        room_number: { type: [string, 'null'] }
        floor: { type: [integer, 'null'] }
        building_id: { type: [integer, 'null'], format: int64 }
        building_name: { type: [string, 'null'] }
        contract_number: { type: string }
        moved_in_at: { type: string, format: date }
        moved_out_at: { type: [string, 'null'], format: date }
        moved_out_ground: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/ResidencyStatus'
        is_open: { type: boolean }
        is_current: { type: boolean }

    Placement:
      type: object
      description: Where a residency puts a person — building, room, place.
      properties:
        building_id: { type: [integer, 'null'], format: int64 }
        building_name: { type: [string, 'null'] }
        room_id: { type: [integer, 'null'], format: int64 }
        room_number: { type: [string, 'null'] }
        floor: { type: [integer, 'null'] }
        bed_id: { type: [integer, 'null'], format: int64 }
        bed_label: { type: [string, 'null'] }
        moved_in_at: { type: [string, 'null'], format: date }

    ResidentCard:
      type: object
      description: |
        FR-06. `citizenship` is nullable by design: a staff account was not
        created through the resident route and may have none, and the card
        renders what is known rather than a default that looks like a fact.
      required: [id, full_name, contact, residency_history, overdue_guest_visits]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        citizenship:
          oneOf:
            - $ref: '#/components/schemas/Citizenship'
            - type: 'null'
        citizenship_label: { type: [string, 'null'] }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
            phone: { type: [string, 'null'] }
        account_status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        current_bed:
          description: The place held right now, or null.
          oneOf:
            - $ref: '#/components/schemas/Placement'
            - type: 'null'
        residency_history:
          type: array
          description: Every residency, newest first. Nothing is removed on move-out.
          items:
            $ref: '#/components/schemas/Residency'
        overdue_guest_visits:
          type: array
          description: |
            FR-20, third criterion: «the fact is visible on the inviting
            resident's card». Every visit of a guest this person invited that
            was still open when its deadline passed.

            A key of its own rather than an entry among the residency rows: a
            residency is what the register says the person holds, and an overdue
            visit is something that happened — clause 2.2 of the rules of
            internal order makes the inviting resident answerable for the
            departure, and clause 3.4 of the Model Rules says the same. Folding
            the two together would have made «holds a place» and «has never been
            late» one statement.

            The entry stays after the guest has left: the mark is
            `reported_overdue_at`, so a visit since closed as `closed_late`
            still appears. The card records that a deadline was passed, not
            whether somebody is at this moment still inside.
          items:
            type: object
            required: [guest_visit_id, guest_request_id, status]
            properties:
              guest_visit_id: { type: integer, format: int64 }
              guest_request_id: { type: integer, format: int64 }
              guest_full_name: { type: [string, 'null'] }
              due_at: { type: [string, 'null'], format: date-time }
              checked_in_at: { type: [string, 'null'], format: date-time }
              checked_out_at: { type: [string, 'null'], format: date-time }
              reported_overdue_at: { type: [string, 'null'], format: date-time }
              status:
                $ref: '#/components/schemas/GuestVisitStatus'

    StaffAppointmentInput:
      type: object
      description: |
        FR-41. Who, and which role. The dormitory is not here: it comes from the
        path, so the payload cannot nominate the scope the caller's own
        authorisation is checked against.
      required: [user_id, role]
      properties:
        user_id:
          type: integer
          format: int64
          description: The account receiving the role. It need not exist in this dormitory yet.
        role:
          description: >-
            One of the roles the caller may grant, and the chain is one level
            deep at each step: the administrator grants `warden` and nothing
            below it, the warden grants `manager`, `duty_officer` and
            `security` inside his own dormitory, and the manager grants
            nothing. Anything else is 403 — an administrator asking for
            `security` directly included.
          allOf:
            - $ref: '#/components/schemas/RoleCode'

    ResidentAccountInput:
      type: object
      description: |
        FR-42. The fields of an incoming resident, and nothing else. There is no
        `role` — it is always the resident role in the dormitory named by the
        path — and no `password`: the server generates one and returns it once.

        All four are required. The telephone is how the office reaches the
        resident and there is no confirmation of it; the citizenship comes from
        a closed list.
      required: [full_name, email, phone, citizenship]
      properties:
        full_name: { type: string, maxLength: 255 }
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            The address the account signs in with, which is why it is the one
            field that can be neither omitted nor duplicated.
        phone: { type: string, maxLength: 32 }
        citizenship:
          $ref: '#/components/schemas/Citizenship'

    IssuedAccount:
      type: object
      description: |
        FR-42. The account that has just been created and the password that was
        generated for it — the one place in the API where a password is
        readable.

        Everything the office has to print is here: the person, the address they
        sign in with, the password, the dormitory and the role. The client draws
        the sheet; the server renders nothing. The room is not among the fields
        because the account does not have one yet — a place is assigned by
        `POST /residencies`, which is a later step.
      required: [password, user, building]
      properties:
        password:
          type: string
          description: >-
            The generated password, in plain text, for the only time it is ever
            returned. Twelve characters, letters and digits, so it can be read
            off a printed sheet and typed by hand.
        user:
          $ref: '#/components/schemas/User'
        building:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }

    ChangePasswordInput:
      type: object
      description: |
        FR-42. The password being replaced, and the one replacing it.
        `current_password` is checked against the signed-in account's own hash:
        a stolen token must not be enough to take an account over.
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          description: The password the account signs in with today.
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string, minLength: 8 }

    CapacityExceeded:
      type: object
      description: |
        FR-02, second criterion. `free_places` is the remainder the register
        refused on; zero means the room is full.
      required: [message, capacity, beds, free_places]
      properties:
        message: { type: string }
        room_id: { type: integer, format: int64 }
        room_number: { type: string }
        capacity: { type: integer }
        beds: { type: integer }
        free_places: { type: integer, minimum: 0 }

    ResidencyConflict:
      type: object
      description: |
        FR-03, second criterion: the record standing in the way, so that the
        warden or manager reads which residency must end before this one can begin.
      required: [message]
      properties:
        message: { type: string }
        bed_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        conflict:
          oneOf:
            - $ref: '#/components/schemas/Residency'
            - type: 'null'

    DeletionBlocked:
      type: object
      description: |
        FR-01, second criterion: the deletion is blocked and the reason is stated.
      required: [message, entity, entity_id, blocked_by]
      properties:
        message: { type: string }
        entity: { type: string, examples: [building] }
        entity_id: { type: integer, format: int64 }
        blocked_by:
          type: object
          description: >-
            What is attached, by kind and count. Every known kind is present,
            including the ones that are nought, so that the numbers and the
            message cannot contradict each other.
          additionalProperties: { type: integer }
          examples:
            - { rooms: 12, role_grants: 0 }
            - { rooms: 0, role_grants: 3 }

    AuditEntry:
      type: object
      description: |
        The record format of §3.9.6: who, what, over which object, when, from which
        address, with what result.
      required: [id, action, user, subject, result, created_at]
      properties:
        id: { type: integer, format: int64 }
        action:
          $ref: '#/components/schemas/AuditAction'
        user:
          type: object
          properties:
            id: { type: [integer, 'null'], format: int64 }
            full_name: { type: [string, 'null'] }
        subject:
          type: object
          properties:
            type:
              type: [string, 'null']
              description: The short class name of the object acted on.
              examples: [Building]
            id: { type: [integer, 'null'], format: int64 }
        payload:
          type: [object, 'null']
          additionalProperties: true
        ip_address: { type: [string, 'null'] }
        result:
          $ref: '#/components/schemas/AuditResult'
        created_at: { type: string, format: date-time }

    InvalidCredentials:
      type: object
      required: [message, attempts_left]
      properties:
        message: { type: string }
        attempts_left:
          type: integer
          minimum: 0
          description: Attempts remaining before the block. Zero means the block has just started.

    ThrottleReason:
      type: string
      description: |
        Which limit refused the request. The field is the discriminator of the
        429: the block that follows failed attempts and the request limit of the
        route are different events and must not be reported as one.
      enum: [login_locked, address_locked, rate_limited]

    TooManyRequests:
      type: object
      required: [message, retry_after, reason]
      properties:
        message: { type: string }
        retry_after:
          type: integer
          minimum: 0
          description: Seconds until the request is accepted again. Mirrors the Retry-After header.
        reason:
          $ref: '#/components/schemas/ThrottleReason'

    NotificationCategory:
      type: string
      description: |
        FR-34's occasions, as the label a message is drawn under. It is what the
        client picks an icon and a caption by; nothing about delivery is decided
        from it on the client's side.

        `request_decision` is a decision on a guest request, `visit_overdue` a
        guest still recorded inside after the hour clause 2.2 of the rules of
        internal order sets, and `maintenance_status` a movement of a
        maintenance request.

        `announcement` is FR-09 reaching the resident: the feed is on screen
        either way and the message only saves the person from opening it.

        `lost_found_claim` is the whole of FR-26's exchange under one label:
        somebody has claimed a find, a claim has been accepted with a handover
        point, one has been declined, one has been referred to the warden, or
        the warden has decided it. The two directions are two ends of one
        exchange and share a label. It is the one category whose messages name
        another resident: no telephone number, no address and no e-mail travels
        in either direction.

        There is no per-category switch and nothing else stands between a
        message and the person it names: a category is the label the personal
        account draws it under and not a condition on its delivery.
      enum:
        - request_decision
        - visit_overdue
        - maintenance_status
        - announcement
        - lost_found_claim

    NotificationsMeta:
      description: >-
        The page envelope every listing in this document has, plus the one
        figure the personal account needs on every screen rather than on this
        one.
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [unread_count]
          properties:
            unread_count:
              type: integer
              minimum: 0
              description: >-
                How many of this person's messages are unread, counted over the
                whole table and not over this page. It is what the badge in the
                menu shows.

    Notification:
      type: object
      required: [id, type, payload, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        category:
          oneOf:
            - $ref: '#/components/schemas/NotificationCategory'
            - type: 'null'
        type:
          type: string
          description: The short name of the message class, e.g. `GuestVisitOverdue`.
        payload:
          type: object
          additionalProperties: true
          description: >-
            The body of the message. Its shape depends on the category — each
            notification decides its own — so it is deliberately open here
            rather than enumerated: a category added in a later increment must
            not require this document to change for the existing ones to keep
            working.
        read_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    AnnouncementCategory:
      type: string
      description: |
        The five headings the publishing form suggests (FR-09, FR-11).

        **A catalogue and not a constraint.** The column is a free string of at
        most 32 characters: any value outside this list is accepted and stored
        as it stands, so a client must render an unknown category rather than
        treat it as an error. The list is served with its display names at
        `GET /announcement-categories`.

        It was a closed enumeration with a CHECK constraint behind it. Closing
        the list kept two wardens from writing «Ремонт» and «ремонт» and getting
        two headings, and it also forced every subject the five did not foresee
        into `general` — a residual heading collecting half the feed is a filter
        that filters nothing.
      enum:
        - house_rules
        - utilities
        - safety
        - events
        - general

    Announcement:
      type: object
      required: [id, author_id, title, body, category, category_label, published_at]
      properties:
        id: { type: integer, format: int64 }
        building_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The dormitory addressed. Null means every dormitory (§3.4.2), which
            only the administrator may write.
        building_name: { type: string }
        addresses_every_building:
          type: boolean
          description: >-
            The meaning of a null `building_id`, carried explicitly so that each
            interface does not have to infer «all dormitories» from an absent
            field.
        author_id: { type: integer, format: int64 }
        author_name: { type: string }
        title: { type: string, maxLength: 255 }
        body: { type: string }
        category:
          type: string
          maxLength: 32
          description: >-
            The heading as it was stored. Often one of
            `AnnouncementCategory`'s, but any label up to 32 characters is
            admissible.
        category_label:
          type: string
          description: >-
            What to show beside the notice: the catalogue's name when the value
            is one of its five, and the value itself when the author typed
            their own.
        published_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            The validity period of FR-09. Null means the announcement does not
            expire; otherwise this is the moment it leaves the feed for the
            archive, by comparison and not by anybody moving it.
        created_at: { type: string, format: date-time }

    AnnouncementInput:
      type: object
      required: [title, body, category]
      properties:
        building_id:
          type: [integer, 'null']
          format: int64
          description: >-
            The dormitory addressed, and the only field that says so. Omit it,
            or send null, to address every dormitory — the administrator's
            right and nobody else's. He addresses one dormitory by naming its
            identifier here.
        title: { type: string, maxLength: 255 }
        body: { type: string, maxLength: 20000 }
        category:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            The heading, trimmed of surrounding space. The form draws
            `GET /announcement-categories` as suggestions and admits anything
            else up to 32 characters; the value is stored as it is given.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the announcement leaves the feed. Must be in the future; omit
            for an announcement that does not expire.

    GuestRequestStatus:
      type: string
      description: |
        The states of §3.5.4. `pending_review` is the only one that appears in
        the duty officer's queue; `in_progress` and `overdue` mean a guest is
        recorded inside the building; the last four are final.

        `draft` is absent: no route writes one, because the form lives in the
        browser until it is sent.
      enum:
        - pending_review
        - approved
        - in_progress
        - overdue
        - rejected
        - cancelled
        - expired
        - completed

    GuestVisitStatus:
      type: string
      description: >-
        `closed_late` is a fact about the evening and not about anybody's
        decision: the guest left, after the control time.
      enum: [in_building, closed, overdue, closed_late]

    GuestRequestInput:
      type: object
      required: [building_id, guest_full_name, visit_date, planned_from, planned_to]
      properties:
        building_id: { type: integer, format: int64, minimum: 1 }
        guest_full_name: { type: string, minLength: 2, maxLength: 255 }
        visit_date: { type: string, format: date }
        planned_from: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '14:00' }
        planned_to: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '18:00' }

    GuestApprovalInput:
      type: object
      properties:
        comment: { type: string, maxLength: 1000, nullable: true }

    GuestRejectionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: FR-17, second criterion. A refusal without one is impossible.

    GuestRequest:
      type: object
      required: [id, building_id, student_id, guest_full_name, status]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        building_name: { type: string }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        inviting_resident:
          type: object
          description: >-
            The resident who invited, as the client draws them: a link to their
            card and the room beside it. Present when the request was loaded
            with its student, which every route that returns one does.
          properties:
            id: { type: integer, format: int64, nullable: true }
            full_name: { type: string, nullable: true }
            room:
              type: string
              nullable: true
              description: >-
                The room they held on the day of the visit. Null when the
                housing register holds no bed for them.
        guest_full_name: { type: string }
        visit_date: { type: string, format: date }
        planned_from: { type: string, example: '14:00' }
        planned_to: { type: string, example: '23:00' }
        due_at:
          type: string
          format: date-time
          description: >-
            The departure deadline: the earlier of the end of the interval and
            the hour the dormitory stops admitting guests (`visiting_to`).
        status:
          $ref: '#/components/schemas/GuestRequestStatus'
        status_label: { type: string }
        access_code:
          type: string
          nullable: true
          description: >-
            Null until approval. Issued only on the duty officer's decision, so
            that before it there is nothing to present at the post (§3.5.1).
            Eight characters from an alphabet with the confusable ones removed,
            because it is read aloud and typed in at a desk.
          example: 'K7QMR4TZ'
        decided_by:
          type: integer
          format: int64
          nullable: true
          description: >-
            Null on a request the scheduler closed. FR-17's fourth criterion
            treats an undecided request as rejected, and nobody decided it — so
            the row does not claim an officer did.
        decided_by_name:
          type: string
          nullable: true
          description: >-
            The officer who approved or refused, by name. Null on a request the
            scheduler closed, for the same reason `decided_by` is.
        decided_at: { type: string, format: date-time, nullable: true }
        decision_comment: { type: string, nullable: true }
        visit:
          allOf:
            - $ref: '#/components/schemas/GuestVisit'
          nullable: true
        created_at: { type: string, format: date-time }

    GuestVisit:
      type: object
      required: [id, guest_request_id, checked_in_at, status]
      properties:
        id: { type: integer, format: int64 }
        guest_request_id: { type: integer, format: int64 }
        checked_in_at: { type: string, format: date-time }
        checked_in_by: { type: integer, format: int64 }
        checked_in_by_name: { type: string, nullable: true }
        checked_out_at: { type: string, format: date-time, nullable: true }
        checked_out_by: { type: integer, format: int64, nullable: true }
        checked_out_by_name:
          type: string
          nullable: true
          description: The officer who recorded the exit — often a later shift.
        due_at:
          type: string
          format: date-time
          description: >-
            Frozen at the entry. Carried beside `checked_out_at` so that
            `closed_late` is legible without recomputing the deadline from a
            setting that may since have changed.
        status:
          $ref: '#/components/schemas/GuestVisitStatus'
        status_label: { type: string }
        admitted_on_decision: { type: boolean }
        admission_note: { type: string, nullable: true }

    CheckpointSearchInput:
      type: object
      required: [building_id]
      properties:
        building_id: { type: integer, format: int64, minimum: 1 }
        code:
          type: string
          maxLength: 32
          nullable: true
          description: >-
            The visit code, as printed or as carried by the QR. Case and
            punctuation are normalised: a code read back over a telephone is
            the same code.
        surname:
          type: string
          minLength: 2
          maxLength: 255
          nullable: true
          description: >-
            The fallback when the guest has lost the code. Scoped to the
            current day.

    CheckpointCard:
      type: object
      description: |
        FR-18's five fields — guest, inviting resident, room, departure
        deadline, status — with the verdict on admission beside them.

        **A card does not always name anybody.** A withdrawn, refused or
        expired request still answers to its access code, deliberately: a guest
        who turns up anyway is told the visit was cancelled rather than that no
        such code exists. But there is then no visit about to be recorded and
        therefore no ground for showing the guest's name, the host's name or
        the host's room (§2.7.1). `disclosed` is false on such a card
        and `guest`, `inviting_resident`, `room`, `due_at`,
        `permitted_interval` and `access_code` are all null; `status`,
        `status_label` and `admission` still say what the officer has to tell
        the person at the desk.
      required: [guest_request_id, disclosed, status, status_label, admission, checked_at]
      properties:
        guest_request_id: { type: integer, format: int64 }
        disclosed:
          type: boolean
          description: >-
            Whether this card names anybody. False for a request that can no
            longer lead to an entry and never led to one.
        access_code: { type: string, nullable: true }
        guest:
          type: object
          nullable: true
          description: >-
            A name and no more. The document itself is in the officer's hand
            and the register keeps no copy of it.
          properties:
            full_name: { type: string }
        inviting_resident:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64, nullable: true }
            full_name: { type: string, nullable: true }
        room:
          type: string
          nullable: true
          description: >-
            Null when the housing register holds no bed for the host — an
            account issued before a place was assigned — and on a card that
            names nobody. Shown as absent rather than guessed at.
        due_at: { type: string, format: date-time, nullable: true }
        permitted_interval: { type: string, nullable: true, example: '14:00–23:00' }
        status:
          $ref: '#/components/schemas/GuestRequestStatus'
        status_label: { type: string }
        visit:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            checked_in_at: { type: string, format: date-time }
            checked_out_at: { type: string, format: date-time, nullable: true }
            status:
              $ref: '#/components/schemas/GuestVisitStatus'
        admission:
          type: object
          properties:
            allowed: { type: boolean }
            reason_code:
              type: string
              nullable: true
              enum: [outside_permitted_interval, request_not_approved, guest_already_inside, wrong_visit_date]
            reason: { type: string, nullable: true }
            override_available:
              type: boolean
              description: >-
                Whether the officer on duty may set the refusal aside. True for
                an entry outside the interval or on the wrong day; false for a
                request that was never approved.
            override_requires_reason: { type: boolean }
        checked_at: { type: string, format: date-time }

    CheckInInput:
      type: object
      required: [guest_request_id]
      properties:
        guest_request_id: { type: integer, format: int64, minimum: 1 }
        override_reason:
          type: string
          minLength: 3
          maxLength: 1000
          nullable: true
          description: >-
            §2.4.2's «admit on the responsible officer's decision». Required
            when the refusal is one that may be set aside.

    CheckOutInput:
      type: object
      required: [guest_visit_id]
      properties:
        guest_visit_id: { type: integer, format: int64, minimum: 1 }

    VisitRegisterEntry:
      type: object
      description: One row of the journal of clause 2.1.2, plus the officers.
      properties:
        guest_visit_id: { type: integer, format: int64 }
        guest_full_name: { type: string }
        inviting_resident: { type: string }
        inviting_resident_id: { type: integer, format: int64, nullable: true }
        room:
          type: string
          description: >-
            The room the host held **on the day of the visit**, not today: a
            resident who has since moved did not receive their guest in the
            room they live in now.
        checked_in_at: { type: string, format: date-time }
        checked_out_at: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/GuestVisitStatus'
        recorded_by:
          type: string
          nullable: true
          description: The officer who recorded the entry.
        closed_by:
          type: string
          nullable: true
          description: The officer who recorded the exit — often a later shift.
        admitted_on_decision: { type: boolean }
        admission_note: { type: string, nullable: true }
        corrections:
          type: array
          description: >-
            FR-21's correcting entries, shown beside the row they correct. The
            row itself is never rewritten.
          items:
            type: object
            properties:
              recorded_at: { type: string, format: date-time }
              by: { type: integer, format: int64, nullable: true }
              correction: { type: string }

    IllegalTransitionError:
      type: object
      description: §3.5.4. The move asked for is not one the state machine has.
      required: [message]
      properties:
        message: { type: string }
        status:
          $ref: '#/components/schemas/GuestRequestStatus'
        attempted_status:
          $ref: '#/components/schemas/GuestRequestStatus'

    QuotaError:
      type: object
      description: §3.3.4. The daily ceiling for the resident or for the dormitory.
      required: [message]
      properties:
        message: { type: string }
        quota_scope: { type: string, enum: [resident, building] }
        quota_limit: { type: integer }
        approved_today: { type: integer }
        visit_date: { type: string, format: date }

    EntryNotPermittedError:
      type: object
      description: >-
        FR-18 and FR-19. The record is refused, not the person: the system does
        not restrict the physical movement of people.
      required: [message]
      properties:
        message: { type: string }
        reason_code:
          type: string
          enum: [outside_permitted_interval, request_not_approved, guest_already_inside, wrong_visit_date]
        override_available: { type: boolean }
        override_requires_reason: { type: boolean }

    VisitAlreadyClosedError:
      type: object
      description: FR-21. The register is append-only; a mistake is a correcting entry.
      required: [message]
      properties:
        message: { type: string }
        guest_visit_id: { type: integer, format: int64 }
        checked_out_at: { type: string, format: date-time }

    MaintenanceRequestStatus:
      type: string
      description: |
        FR-38's six states: «submitted → accepted → in progress → completed →
        closed; and submitted → rejected», plus FR-39's one edge back from
        `completed` to `accepted`.

        The values are FR-38's words and not §3.5.2's. That sequence diagram
        was drawn before the requirement was worded this way and labels the
        same states `new`, `assigned` and `done`; the requirement is what the
        module is accepted against and a client reads the stored value, so the
        requirement wins.

        `closed` carries both endings and does not split them: which of the two
        it was is the difference between `confirmed_at` being set and
        `auto_closed` being true. A seventh state would have to be handled by
        every reader of the queue and would tell the reporter nothing those two
        columns do not.
      enum: [submitted, accepted, in_progress, completed, closed, rejected]

    MaintenanceCategory:
      type: string
      description: |
        FR-36's categories. Six values fixed by the requirement, not a lookup
        table: nobody administers the list from a screen and a category carries
        no attributes of its own.

        `other` is present on purpose. A resident who cannot find their defect
        in five words abandons the form, and the queue then holds a tidy
        taxonomy of the defects that were easy to classify.
      enum: [plumbing, electrical, furniture, heating, network, other]

    MaintenanceLocation:
      type: string
      description: |
        FR-36's location: «own room or a named common area».

        The two behave differently at the moment the request is written.
        `own_room` binds to the room of the submitter's active residency
        record, read from the register; `common_area` names the place in
        `location_note`, because the register holds rooms and beds and knows
        nothing about the kitchen on the fourth floor. `room_id` is null for a
        common area.
      enum: [own_room, common_area]

    MaintenanceUrgency:
      type: string
      description: |
        FR-36's urgency, in the three values §3.4.3 gives
        `MAINTENANCE_REQUEST.priority`.

        The resident sets it and the warden may change it on triage. A scale
        nobody can move is a scale everybody maximises: the resident's choice
        is what they know — water on the floor now, a wobbly chair whenever —
        and the warden's is what the queue is ordered by. The change is a row
        in the work log like any other.
      enum: [routine, urgent, emergency]

    MaintenanceRequest:
      type: object
      description: |
        One maintenance request as the resident and the warden read it.

        Three fields are computed and none of them stored: `age_days`,
        `overdue` and `confirmation_window_open` are questions about the clock,
        and a column holding the answer would be wrong between two runs of
        whatever updated it. The threshold and the window arrive from
        configuration, so moving either changes what the client reads on the
        next request.

        `photo_paths` carries paths and not URLs. A path is meaningless without
        the object store's credentials, which is what makes it safe to
        serialise; the image itself is read from
        `GET /maintenance-requests/{id}/photos/{index}`, one at a time, when
        the client is about to show it.

        `work_log` is where the reason for a refusal and the comment on every
        move actually live (§3.4.1, decision 6). There is deliberately no
        `rejection_reason` on the request to disagree with the history.
      required: [id, building_id, reporter_id, category, location, description, status]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        building_name: { type: string }
        room_id:
          type: [integer, 'null']
          format: int64
          description: Null for a common area (§3.4.3, «NULL for common areas»).
        room_number: { type: [string, 'null'] }
        reporter_id: { type: integer, format: int64 }
        reporter_name: { type: string }
        category:
          $ref: '#/components/schemas/MaintenanceCategory'
        category_label: { type: string }
        location:
          $ref: '#/components/schemas/MaintenanceLocation'
        location_note: { type: [string, 'null'] }
        place:
          type: string
          description: Where the defect is, in words — «Room 412», or the named common area.
        title: { type: [string, 'null'] }
        description: { type: string }
        urgency:
          $ref: '#/components/schemas/MaintenanceUrgency'
        urgency_label: { type: string }
        photo_paths:
          type: array
          maxItems: 3
          items: { type: string }
        photo_count: { type: integer, minimum: 0, maximum: 3 }
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        status_label: { type: string }
        assigned_to: { type: [integer, 'null'], format: int64 }
        assignee_name: { type: [string, 'null'] }
        assigned_at: { type: [string, 'null'], format: date-time }
        target_date:
          type: [string, 'null']
          format: date
          description: >-
            The planned completion date. Never null past `submitted` and
            outside `rejected` — FR-37's second criterion, kept by a CHECK
            constraint as well as by the form rule.
        completed_at: { type: [string, 'null'], format: date-time }
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: Set only when the reporter closed it themselves.
        closed_at: { type: [string, 'null'], format: date-time }
        auto_closed:
          type: boolean
          description: >-
            FR-39. True when the confirmation window ran out with no answer. A
            request the resident confirmed is evidence the defect was fixed; one
            that closed for want of an answer is evidence of nothing but that
            the dormitory stopped waiting, and the two must not be confused.
        reopen_count: { type: integer, minimum: 0 }
        age_days:
          type: integer
          minimum: 0
          description: FR-40's «age since submission», in whole days.
        overdue: { type: boolean }
        overdue_after_days: { type: integer }
        confirmation_window_days: { type: integer }
        confirmation_window_open:
          type: boolean
          description: >-
            Whether the reporter may still confirm or dispute. The screen reads
            it so as to offer the two buttons only while they would work.
        work_log:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceWorkLogEntry'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MaintenanceWorkLogEntry:
      type: object
      description: |
        One entry of the append-only work log (§3.4.1, decision 6; §4.4.4).

        `from_status` null means the row records a submission rather than a
        move: the request did not change state, it came into being.
        `actor_id` null means nobody decided — the scheduled closure of FR-39 —
        and `by_the_scheduler` says so plainly, so that no client fills the gap
        with an author the record deliberately does not have.
      required: [id, to_status, recorded_at]
      properties:
        id: { type: integer, format: int64 }
        from_status:
          oneOf:
            - $ref: '#/components/schemas/MaintenanceRequestStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        summary: { type: string }
        comment: { type: [string, 'null'] }
        actor_id: { type: [integer, 'null'], format: int64 }
        actor_name: { type: [string, 'null'] }
        by_the_scheduler: { type: boolean }
        recorded_at: { type: string, format: date-time }

    MaintenanceRequestInput:
      type: object
      description: |
        FR-36's submission. Multipart, because of the photographs.

        There is no `room_id` and that is the design: an «own room» request is
        bound to the room of the submitter's active residency record, read from
        the housing register. A client that could name the room could name
        somebody else's.
      required: [building_id, category, location, description]
      properties:
        building_id: { type: integer, format: int64, minimum: 1 }
        category:
          $ref: '#/components/schemas/MaintenanceCategory'
        location:
          $ref: '#/components/schemas/MaintenanceLocation'
        location_note:
          type: string
          maxLength: 255
          description: >-
            Required when `location` is `common_area` and ignored otherwise —
            a note beside a room resolved from the register would be a second,
            unreliable answer to «where».
        title: { type: string, maxLength: 255 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        urgency:
          $ref: '#/components/schemas/MaintenanceUrgency'
        photos:
          type: array
          maxItems: 3
          description: >-
            Up to three. The ceiling is configuration, is refused here as a 422
            naming `photos`, and is refused again by a CHECK constraint.
          items: { type: string, format: binary }

    MaintenanceAcceptanceInput:
      type: object
      required: [target_date]
      properties:
        target_date:
          type: string
          format: date
          description: >-
            The planned completion date, and mandatory: FR-37 makes acceptance
            without one impossible. A date in the past is refused — the resident
            is told this date the moment the acceptance succeeds.
        assigned_to:
          type: integer
          format: int64
          description: >-
            The responsible party FR-37 names beside the date. Optional, and
            **restricted to the staff of the dormitory the request belongs
            to** — the warden himself, the manager, the duty officer, the
            security officer. A resident, or a member of staff of another
            dormitory, is 422 naming this field. Until the acceptance of
            15.09.2026 any identifier in the users table was admitted, and the
            answer carries the assignee's full name, so counting upwards read
            the staff of every other building. The administrator is outside it
            too: he reads every queue and promises no dates.
        urgency:
          $ref: '#/components/schemas/MaintenanceUrgency'
        comment: { type: string, maxLength: 1000 }

    MaintenanceRejectionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: >-
            FR-37, first criterion: «rejection without a reason is impossible».
            Stored as the comment of the work-log row the transition writes.

    MaintenanceCommentInput:
      type: object
      description: >-
        The optional sentence a transition carries into the work log. On
        `/reopening` it is the resident's «what is still wrong»; FR-39 does not
        demand one, and the history gets a sentence of its own when it is empty.
      properties:
        comment: { type: string, maxLength: 1000 }

    MaintenanceQueuePage:
      type: object
      description: FR-40. One page of a dormitory's queue, as rows of scalars.
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceQueueRow'
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer, minimum: 1 }
            last_page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1 }
            total: { type: integer, minimum: 0 }

    MaintenanceQueueRow:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        submitted_at: { type: string, format: date-time }
        age_days: { type: integer, minimum: 0 }
        category: { type: string }
        urgency: { type: string }
        place: { type: string }
        status:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
        target_date: { type: [string, 'null'], format: date }
        overdue: { type: boolean }
        reporter: { type: string }
        assignee: { type: [string, 'null'] }

    ConfirmationWindowClosedError:
      type: object
      description: |
        FR-39, and the one refusal of this module a transition table cannot
        express. Once the nightly pass has run, the request is `closed` and the
        state machine refuses the reopening on its own; between the window
        closing and that run the request is still `completed` and
        `completed → accepted` is a move the table admits — correctly, because
        that is the move FR-39 is about. What has run out is the clock.

        409 rather than 422: the body is well formed and the caller is the right
        person, and the same call a day earlier would have succeeded.
      required: [message]
      properties:
        message: { type: string }
        maintenance_request_id: { type: integer, format: int64 }
        confirmation_window_days: { type: integer }
        window_closed_on: { type: [string, 'null'], format: date }

    LostFoundItemKind:
      type: string
      description: |
        `LOST_FOUND_ITEM.kind` of the ER model: «lost or found». One table and
        two directions of the same notice, because a find and a loss share
        every attribute the model lists and differ in one thing only — which
        side of the exchange is holding the object.

        Only a `found` entry admits a claim. A claim is the sentence «that is
        mine», and there is nothing to say it about a notice whose author has
        lost something and is holding nothing.
      enum: [found, lost]

    LostFoundCustody:
      type: string
      description: |
        Who is physically holding the object: the one column that records which
        of §2.5.4's two paths a find took.

        `finder` is the default and is the module's ordinary path — the object
        stays with the resident who found it, who publishes it, hands it over
        in person and decides on claims. No member of staff is involved.

        `administration` is an object handed in at the security post or
        deposited for safekeeping. That is the case Civil Code art. 227 cl. 1
        para. 2 addresses: a thing found on premises and handed to the person
        representing the owner of those premises, who thereby acquires the
        rights and bears the duties of the finder. On the default path no
        hand-over within the meaning of that paragraph takes place, and nothing
        in the provision requires one; the system records which path a find
        took rather than imposing one.

        The practical consequence is the one FR-26 needs: claims on an entry
        are answered by whoever is holding the object.
      enum: [finder, administration]

    LostFoundItemStatus:
      type: string
      description: |
        The three states of §3.5.5's diagram the MVP reaches.

        §3.5.5 draws seven. `draft` belongs to a publication flow §2.5.4
        refuses — «publication passes through no staff approval step» — so
        there is nothing for an entry to wait in. `archived` is the ninety-day
        and thirty-day passes, whose intervals that section itself calls
        configuration subject to agreement with the campus directorate.
        `withdrawn` and `hidden` are the author's retraction and the warden's
        removal of an improper entry, and none of FR-24, FR-25 or FR-26 asks
        for either. A state no route reaches would make this enumeration
        describe a system that does not exist.

        `published` is the public list and `claimed` is not, which is what
        makes FR-26's «a declined claim returns the find to the published list»
        say something. `resolved` is outside the feed altogether, on any
        filter, which is FR-26's third criterion.
      enum: [published, claimed, resolved]

    LostFoundClaimStatus:
      type: string
      description: |
        `LOST_FOUND_CLAIM.status` of the ER model — «new accepted declined» —
        plus the one state FR-26 adds to it.

        `referred` is the requirement's own word: «a claim the two sides cannot
        settle is referred to the warden, who decides». A referral is neither an
        acceptance nor a refusal and neither is it a fresh claim — the person
        holding the object has already answered, and what is outstanding is a
        disagreement. Folding it back into `new` would lose the fact the warden
        needs, that somebody has already said no.

        The ending of a referred claim is one of the two the model already has:
        the warden upholds it and the claim is `accepted`, or the warden does
        not and it is `declined`. `decided_by` is what tells a claim the finder
        accepted from a claim the warden did.
      enum: [new, accepted, declined, referred]

    LostFoundItem:
      type: object
      description: |
        One find as the dormitory reads it.

        **There is no `reporter_id` here, no `reporter_name`, no telephone and
        no e-mail**, and the omission is FR-25's second acceptance criterion:
        «the find card displays neither the name nor the contacts of the
        registering user». The exchange runs through claims inside the system,
        because a feed read by several hundred people with a name beside every
        entry is a directory of who found what and lives where (§3.5.3).

        `happened_on` and `declared_on` are two dates that must not be confused
        (§3.4.2). The first is the day the object was found; the second is the
        day the find was declared to the police or to a local self-government
        body, null while nothing has been declared. The six-month period of
        Civil Code art. 228 cl. 1 runs from the second and never from
        `created_at`. FR-27 counts it and is outside the MVP.

        `photo_path` is a path in the object store and not a URL. The path is
        meaningless without the store's credentials, which is what makes it
        safe to serialise; the image itself is read from
        `GET /lost-found/{id}/photo` when the client is about to show it.

        `claim_count` says how many claims the entry carries and never what any
        of them says. `can_claim` is the three facts a claim would be refused on
        — it is not the reader's own entry, it is a find rather than a loss, and
        it has not gone home — so a client draws the button from the same facts
        the form would refuse it on rather than offering one that answers 422.
      required: [id, building_id, kind, title, place, happened_on, status]
      properties:
        id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        building_name: { type: string }
        kind:
          $ref: '#/components/schemas/LostFoundItemKind'
        kind_label: { type: string }
        custody:
          $ref: '#/components/schemas/LostFoundCustody'
        custody_label: { type: string }
        title:
          type: string
          description: >-
            FR-24's «category», in the shape a dormitory uses it — the short
            line naming the object.
        description: { type: [string, 'null'] }
        place:
          type: string
          description: Where it turned up, in words. The register holds rooms, not landings.
        happened_on:
          type: string
          format: date
          description: The day of the finding, which is not the day of the entry.
        declared_on:
          type: [string, 'null']
          format: date
          description: >-
            The day the find was declared to the police or to a local
            self-government body (Civil Code art. 227 cl. 2). Null while nothing
            has been declared, in which case no period has begun.
        photo_path: { type: [string, 'null'] }
        has_photograph: { type: boolean }
        status:
          $ref: '#/components/schemas/LostFoundItemStatus'
        status_label: { type: string }
        resolved_at: { type: [string, 'null'], format: date-time }
        claim_count: { type: integer, minimum: 0 }
        can_claim:
          type: [boolean, 'null']
          description: Whether the reading account is in a position to claim this entry at all.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LostFoundClaim:
      type: object
      description: |
        One claim as the three people party to it read it: the claimant,
        whoever is holding the object, and the warden on a referral.

        **The claimant's name is here and the entry's author's is not**, and the
        asymmetry is deliberate (§3.5.3). A claim is read by three people
        arranging a handover, and the person handing an umbrella over has to
        know who to hand it to; the find card is read by the whole dormitory,
        which is why it carries nobody at all. No contacts travel in either
        direction — the exchange meets at the handover point, which is the one
        piece of location this module publishes and is a place the person
        holding the object chose.

        `may_be_referred` is the offer of §2.4.4 — «the claimant is offered the
        option of referring the decision to the warden» — as a flag rather than
        something a client infers from a status. It goes false once the
        referral has been made.
      required: [id, lost_found_item_id, claimant_id, message, status]
      properties:
        id: { type: integer, format: int64 }
        lost_found_item_id: { type: integer, format: int64 }
        claimant_id: { type: integer, format: int64 }
        claimant_name: { type: string }
        message:
          type: string
          description: >-
            FR-26's «identifying features» — the substance of the claim, and the
            only thing the holder judges it on.
        status:
          $ref: '#/components/schemas/LostFoundClaimStatus'
        status_label: { type: string }
        handover_point:
          type: [string, 'null']
          description: >-
            Where the object changes hands. Null until somebody accepts the
            claim, and required from the moment they do.
        decided_by:
          type: [integer, 'null']
          format: int64
          description: >-
            Whoever answered it. FR-26's first criterion turns on this: a claim
            the finder accepted and a claim the warden decided both end at
            `accepted`, and only this tells them apart.
        decided_by_name: { type: string }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_note: { type: [string, 'null'] }
        referred_at: { type: [string, 'null'], format: date-time }
        may_be_referred: { type: boolean }
        created_at: { type: string, format: date-time }

    LostFoundItemInput:
      type: object
      description: |
        FR-24's publication form, `multipart/form-data`.

        There is no `status` field and no `reporter_id` field, and neither is an
        omission: publication passes through no approval step, so there is no
        state to ask for, and the record is bound to the publishing account, so
        there is nobody to name.
      required: [building_id, title, place, happened_on]
      properties:
        building_id: { type: integer, format: int64 }
        title:
          type: string
          minLength: 3
          maxLength: 255
          description: >-
            FR-24's «category», in the shape a dormitory uses it — the short
            line naming the object.
        description: { type: string, maxLength: 2000 }
        place:
          type: string
          minLength: 3
          maxLength: 255
        happened_on:
          type: string
          format: date
          description: >-
            The day of the finding. Not later than today; nothing refuses an old
            one, because somebody clearing a desk drawer in December may well be
            publishing what they picked up in September.
        declared_on:
          type: string
          format: date
          description: >-
            The day the find was declared to the police or to a local
            self-government body. Optional on both paths and required on
            neither: art. 227 cl. 2 puts the duty on the finder where the
            entitled person is unknown, and whether the university files such
            declarations is the university's to settle. Not before
            `happened_on`, and not in the future.
        kind:
          $ref: '#/components/schemas/LostFoundItemKind'
        custody:
          $ref: '#/components/schemas/LostFoundCustody'
        photo:
          type: string
          format: binary
          description: >-
            FR-24, third criterion: optional, and at most one. Validated for
            type and size; the stored name is generated and never the client's.

    LostFoundClaimInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 2000
          description: >-
            FR-26's identifying features. The floor is real: a claim that says
            «it's mine» gives the person holding the object nothing to judge,
            and the whole peer-to-peer arrangement of §2.5.4 rests on their
            refusals being answerable.

    LostFoundAcceptanceInput:
      type: object
      required: [handover_point]
      properties:
        handover_point:
          type: string
          minLength: 3
          maxLength: 255
          description: >-
            Where the owner collects it. §2.4.4: «the claimant is notified with
            the handover point».
        note: { type: string, maxLength: 1000 }

    LostFoundDeclineInput:
      type: object
      description: >-
        FR-26 asks for no reason on a refusal, so none is required. The claimant
        is told either way, and the offer of a referral is what the requirement
        puts in its place.
      properties:
        reason: { type: string, maxLength: 1000 }

    LostFoundReferralInput:
      type: object
      description: >-
        The referral is the claimant repeating a claim the warden can read in
        full on the row, so a second statement of it is a courtesy.
      properties:
        note: { type: string, maxLength: 1000 }

    LostFoundDecisionInput:
      type: object
      description: >-
        One act and not two routes: the warden read the claim, the refusal and
        the marks, and says which of the two residents is right.
      required: [upheld, note]
      properties:
        upheld:
          type: boolean
          description: True upholds the claim; false leaves the refusal standing.
        note:
          type: string
          minLength: 3
          maxLength: 1000
          description: >-
            Required in both directions. A decision that overrides a person
            entitled to make it is one nobody can answer if nobody explained it.
        handover_point:
          type: string
          minLength: 3
          maxLength: 255
          description: Required when `upheld` is true, for the reason the acceptance requires it.

    NoAcceptedClaimError:
      type: object
      description: |
        FR-26's «only», and the one refusal of this module a transition table
        cannot express. The entry is `claimed` and `claimed → resolved` is a
        move the table admits — correctly, because that is the move FR-26 is
        about. What is missing is a row in another table: no claim on the entry
        has been accepted.

        409 rather than 422: the body is well formed and the caller is the
        person holding the object, and the same call after an acceptance would
        succeed.
      required: [message]
      properties:
        message: { type: string }
        lost_found_item_id: { type: integer, format: int64 }
        outstanding_claims:
          type: integer
          minimum: 0
          description: How many claims on the entry are still waiting for an answer.

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationLinks:
      type: object
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'] }
        last_page: { type: integer }
        links:
          type: array
          description: |
            One entry per page button, in the order they are drawn, with the
            previous and next arrows first and last. `page` is null on an arrow
            that leads nowhere, and absent on the ellipsis that stands for a gap
            in a long sequence.
          items:
            $ref: '#/components/schemas/PaginationLink'
        path: { type: string }
        per_page: { type: integer }
        to: { type: [integer, 'null'] }
        total: { type: integer }

    PaginationLink:
      type: object
      required: [url, label, active]
      properties:
        url: { type: [string, 'null'] }
        label: { type: string }
        page: { type: [integer, 'null'] }
        active: { type: boolean }
