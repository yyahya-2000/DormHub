# Everything routed here goes to the front controller. The file does not have
# to exist in this container — only in the PHP one, which is where
# SCRIPT_FILENAME is resolved.
# Through a variable, so nginx re-resolves: written as a literal it keeps the
# address it saw at start, and a deploy that replaces the PHP container leaves
# this one talking to nobody.
resolver 127.0.0.11 valid=10s ipv6=off;
set $upstream app:9000;
fastcgi_pass $upstream;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_read_timeout 120;
