# Rate limits, in the http context so the zones are shared by every server.
#
# The real client address first: behind the host's nginx every request would
# otherwise be counted against the proxy, and one shared counter is no limit
# at all. The range is Docker's own bridge network, which is the only thing
# that can reach this container.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 10 MB holds around 160 000 addresses. The API rate is generous for a person
# and cheap to exceed with a script; the burst absorbs a screen that fires
# several requests at once, which the register and the building card both do.
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=assets:10m rate=600r/m;

# PHP-FPM has a fixed number of workers, so the ceiling that matters is how
# many requests one address may have in flight at once.
limit_conn_zone $binary_remote_addr zone=conn:10m;

limit_req_status 429;
limit_conn_status 429;
