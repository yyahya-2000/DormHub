server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 20M;

    # TLS and HSTS belong to the host's nginx; these are the rest.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns every path the API does not, because routing is client-side.
    location / {
        try_files $uri /index.html;
    }

    # Vite writes the content hash into the file name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api {
        include /etc/nginx/laravel.conf;
    }

    location = /up {
        access_log off;
        include /etc/nginx/laravel.conf;
    }

    location ^~ /swagger-ui/ {
        alias /var/www/html/public/swagger-ui/;
        expires 1h;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
