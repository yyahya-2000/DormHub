; Development overrides for the PHP application container.
memory_limit = 512M
max_execution_time = 120

; Guest photographs and scanned documents go through these limits.
upload_max_filesize = 16M
post_max_size = 20M

date.timezone = UTC

; OPcache stays on with timestamp validation so that a bind-mounted source tree
; is picked up without restarting the container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
