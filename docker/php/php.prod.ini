memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 16M
post_max_size = 20M

date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On

; The source tree is baked into the image, so it cannot change under a running
; container and OPcache never has to stat it.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
